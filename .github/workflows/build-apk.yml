            <label>الاسم</label><input id="f_first" value="${esc(s.first)}">
            <label>القسم</label><input id="f_cls" list="dl" value="${esc(s.cls)}"><datalist id="dl">${classes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
            <div class="acts"><button class="btn" data-act="savestu" data-sid="${sid||''}">حفظ</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
