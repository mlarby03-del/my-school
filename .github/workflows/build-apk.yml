              return `<button class="row" data-act="stu" data-sid="${k}"><span class="nm">${esc(nameOf(s))}<br><small class="muted">${esc(s.cls)} · ${ds}</small></span><span class="rc hot">×${n[k]}</span></button>`;}).join('');
