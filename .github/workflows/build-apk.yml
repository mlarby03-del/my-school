            const aj=recs.filter(r=>r.type==='abs'&&r.just).length;
            const p=curPeriod();
            modal(`<h3>${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)}${s.father?' · الأب: '+esc(s.father):''}${motherName(s)?' · الأم: '+esc(motherName(s)):''}</p>
            ${s.phone?`<p class="muted" dir="ltr" style="text-align:right;margin:0">📞 ${esc(s.phone)}</p>`:''}${s.address?`<p class="muted" style="margin:0">🏠 ${esc(s.address)}</p>`:''}
