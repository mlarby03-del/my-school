          function nPhotos(){return db.records.reduce((n,r)=>n+(r.photos||[]).length,0);}
          function viewData(){
            const l=lastBk();
            return `<div class="title">💾 حفظ المعطيات واسترجاعها</div><div class="pad">
            <div class="prev"><b>${db.students.length}</b> تلميذ · <b>${db.records.length}</b> تسجيل · <b>${nPhotos()}</b> صورة<br><span class="muted">آخر نسخة احتياطية: ${l?fmtDT(l):'لم تُحفظ بعد'}</span></div>
            <h3 style="margin:16px 0 6px">حفظ</h3>
            <div class="menu"><button class="btn" data-act="bkfull">💾 حفظ نسخة كاملة (مع صور التقارير)</button>
