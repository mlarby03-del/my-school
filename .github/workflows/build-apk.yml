            const st=`<style>.sf{font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif;color:#12201d;background:#fff;direction:rtl;text-align:right;line-height:1.6;font-size:14px;padding:${w?28:12}px}.sf h1{font-size:22px;margin:0 0 2px}.sf h2{font-size:16px;margin:16px 0 6px;border-bottom:2px solid #0f766e;padding-bottom:2px;color:#0f766e}.sf .sub{color:#5d6e6a;font-size:13px}.sf table{border-collapse:collapse;width:100%}.sf th,.sf td{border:1px solid #cfdad7;padding:5px 8px;vertical-align:top}.sf th{background:#eef4f2;width:30%;font-weight:700}.sf .t th{width:auto}.sf .st td{text-align:center}.sf .im{display:inline-block;width:46%;margin:4px;vertical-align:top}.sf .im img{width:100%;border:1px solid #cfdad7}.sf .im div{font-size:12px;color:#5d6e6a}</style>`;
            return `<div class="sfroot sf"${w?` style="width:${w}px;box-sizing:border-box"`:''}>${st}
            <div class="blk"><h1>ملف التلميذ</h1><div class="sub">${esc(SCHOOL)} · ${p?esc(p.name)+' ('+fmtDate(p.from)+' ← '+(p.to?fmtDate(p.to):'مفتوح')+')':'كل المدة'} · أُنشئ في ${fmtDate(todayStr())}</div></div>
            <h2 class="blk">البيانات الشخصية</h2><table>${id.map(x=>`<tr class="blk"><th>${x[0]}</th><td>${esc(x[1])}</td></tr>`).join('')}</table>
            <h2 class="blk">الإحصاء</h2><table class="t st"><tr class="blk"><th>الغيابات</th><th>مبررة</th><th>غير مبررة</th><th>التأخرات</th><th>دفتر المراسلة</th><th>المشاغبة</th><th>الاستدعاءات</th><th>التقارير</th></tr><tr class="blk"><td>${c.abs}</td><td>${aj}</td><td>${c.abs-aj}</td><td>${c.late}</td><td>${c.book}</td><td>${c.bad}</td><td>${c.conv}</td><td>${c.rpt}</td></tr></table>
            <h2 class="blk">السجل (${recs.length})</h2>${recs.length?`<table class="t"><tr class="blk"><th>التاريخ</th><th>النوع</th><th>التفاصيل</th></tr>${recs.map(r=>`<tr class="blk"><td style="white-space:nowrap">${fmtDate(r.date)}</td><td style="white-space:nowrap">${TYPES[r.type].nav}</td><td>${esc(det(r))}${r.photos&&r.photos.length?' 📷':''}</td></tr>`).join('')}</table>`:'<div class="sub">لا توجد تسجيلات.</div>'}
            ${cOf(sid).length?`<h2 class="blk">اتصالات وزيارات الولي</h2><table class="t">${cOf(sid).map(x=>`<tr class="blk"><td style="white-space:nowrap">${fmtDate(x.date)} ${esc(x.time||'')}</td><td style="white-space:nowrap">${HOW[x.how]||x.how}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table>`:''}
            ${withPh.length?`<h2 class="blk">المرفقات المصورة</h2>`+withPh.map(r=>r.photos.map(pid=>`<div class="im blk">${imgs?(imgs[pid]?`<img src="${imgs[pid]}" alt=""/>`:''):`<img data-pid="${pid}" alt=""/>`}<div>${fmtDate(r.date)} — ${TYPES[r.type].nav}</div></div>`).join('')).join(''):''}
            </div>`;
