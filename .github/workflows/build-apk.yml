          }
          const DNAMES={abs:'الغيابات',late:'التأخرات',late10:'تأخرات الساعة العاشرة',esc:'الهروب من الحصص',book:'دفتر المراسلة (لم يُحضر)',bad:'المشاغبون'};
          function dailyText(date,cls){
            const D=dayData(date,cls);
            let t=`كشف يوم ${fmtDate(date)}${cls?' — القسم '+cls:''}${S.rshift?(S.rshift==='ص'?' — الفترة الصباحية':' — الفترة المسائية'):''}\n${SCHOOL}\n`;
            for(const k of ['abs','late','late10','esc','book','bad']){
              const cl=Object.keys(D[k]).sort(cmpNat),tot=cl.reduce((n,c)=>n+D[k][c].length,0);
              t+=`\n${DNAMES[k]} (${tot})\n`;
