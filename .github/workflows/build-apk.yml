name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p www
          cat > package.json <<'EOF_PKG'
          {
            "name": "suivi-eleves",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          EOF_PKG
          cat > capacitor.config.json <<'EOF_CFG'
          {
            "appId": "dz.mjd.suivi",
            "appName": "متابعة التلاميذ",
            "webDir": "www"
          }
          EOF_CFG
          cat > www/index.html <<'EOF_HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#0f766e">
          <title>متابعة التلاميذ</title>
          <style>
          :root{--bg:#f4f7f6;--card:#fff;--tx:#12201d;--mu:#62726e;--pr:#0f766e;--pr2:#0d5f59;--bd:#dbe4e1;--red:#c0392b;--amb:#fff4d6;--grn:#e3f6ee}
          @media (prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18231f;--tx:#e8f0ed;--mu:#9bb0aa;--pr:#2bb3a6;--pr2:#239a8f;--bd:#2a3a35;--red:#ff7b6b;--amb:#3a3118;--grn:#17352b}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
          header{position:sticky;top:0;z-index:5;background:var(--pr);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
          header .t{flex:1;line-height:1.25}header b{display:block;font-size:17px}header small{opacity:.85;font-size:12px}
          header button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:20px;border-radius:10px;width:42px;height:42px}
          main{max-width:720px;margin:0 auto}
          nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
          nav button{flex:1 0 auto;min-width:64px;border:0;background:none;color:var(--mu);padding:8px 2px 7px;font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
          nav button span{font-size:21px;line-height:1}nav button.on{color:var(--pr);font-weight:700}
          .bar{display:flex;gap:8px;align-items:center;padding:10px 12px}
          .bar b{flex:1}.bar input,.bar select{flex:1;min-width:0}
          input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:4px 0}
          label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
          .btn{font:inherit;border:0;background:var(--pr);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600}
          .btn:disabled{opacity:.45}.btn.sm{padding:7px 12px;font-size:14px}
          .btn.ghost{background:transparent;color:var(--pr);border:1px solid var(--bd)}.btn.danger{background:var(--red);color:#fff}
          .title{font-size:20px;font-weight:700;padding:14px 14px 0}
          .sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 14px 6px;font-size:14px;color:var(--mu)}.sum b{color:var(--tx)}
          .hint{margin:0;padding:0 14px 8px;font-size:13px;color:var(--mu)}
          h3{margin:16px 14px 6px;font-size:16px}h3 small{color:var(--mu);font-weight:400;font-size:13px;margin-right:6px}h3.d{font-size:14px;color:var(--pr)}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:0 12px}
          .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;font:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px}
          .card b{font-size:18px}.card small{color:var(--mu)}
          .row{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:0;border-bottom:1px solid var(--bd);padding:13px 14px;font:inherit;color:var(--tx);text-align:right;min-height:52px}
          .row .nm{flex:1}.row .sub{color:var(--mu);font-size:13px}.row .no{width:24px;color:var(--mu);font-size:13px}
          .row .st{font-size:13px;font-weight:700;color:var(--red);max-width:48%;text-align:left}
          .row.rec.on{background:var(--amb)}.row.rec.on.just{background:var(--grn)}.row.rec.on.just .st{color:var(--pr)}
          .badges i{font-style:normal;font-size:12px;background:var(--bg);border-radius:8px;padding:2px 6px;margin-right:3px}
          .x{border:0;background:none;color:var(--red);font-size:18px;padding:4px 8px}
          .idx{display:none}
          .rc{font-size:13px;font-weight:700;color:var(--mu);background:var(--bg);border-radius:8px;padding:1px 7px}.rc.hot,.stats .hot b{color:var(--red)}
          .stats .hot{background:var(--amb)}
          .warn.bk{margin:10px 12px 0;cursor:pointer;border:1px solid var(--bd)}
          .warn{background:var(--amb);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
          .qk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.qk button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}.qk button span{font-size:22px}.qk button.on{background:var(--amb);border-color:var(--red);font-weight:700}
          .cv{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
          .qk button:last-child:nth-child(odd){grid-column:span 2}
          .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
          .th{position:relative}.th .x{position:absolute;top:-6px;left:-6px;background:var(--card);border:1px solid var(--bd);border-radius:50%;width:22px;height:22px;padding:0;font-size:12px;line-height:20px}
          .ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
          .vw{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
          .vw img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}.vw img.big{max-width:none;max-height:none;width:250%}.vw .btn{flex:none}
          nav::-webkit-scrollbar{display:none}
          .rf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
          nav button{font-size:10.5px!important}
          .muted{color:var(--mu)}.pad{padding:12px 14px}
          .empty{text-align:center;padding:48px 24px}.empty .big{font-size:48px}.empty .btn{display:block;margin:10px auto;min-width:240px}
          .mb{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
          .mc{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
          .mc h3{margin:0 0 4px}.acts,.menu{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.menu{flex-direction:column}.menu .btn{text-align:right}
          .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.stats div{background:var(--bg);border-radius:10px;text-align:center;padding:8px 2px}.stats b{display:block;font-size:20px}.stats small{font-size:11px;color:var(--mu)}
          .hl .row{padding:9px 4px;min-height:0}
          .prev{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
          .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips span{background:var(--bg);border-radius:8px;padding:3px 8px;font-size:13px}
          #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
          #toast.show{opacity:1;transform:translateX(-50%)}
          .mrow{display:flex;gap:6px;align-items:flex-start}.mrow input,.mrow textarea{flex:1}.mic{flex:none;width:46px;height:46px;margin:4px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:20px}
          .alerts{margin:10px 12px 0;background:var(--amb);border-radius:12px;padding:4px 0 6px}.alerts .ah{display:flex;justify-content:space-between;align-items:center;padding:6px 12px}.alerts .row{background:transparent}
          .seg{display:flex;gap:6px;padding:10px 12px 0}.seg button{flex:1;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
          .rtxt{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 12px;padding:12px;font-size:14px}
          .pr{display:flex;gap:6px;align-items:center}.pr .btn{flex:1;text-align:right}.pr small{opacity:.75;margin-right:6px}
          .acts a.btn{text-decoration:none;display:inline-block}
          .row.hr[data-act=recinfo]{cursor:pointer}
          .cmp{padding:6px 12px}.cr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}.ch{display:flex;justify-content:space-between}.cb{height:10px;background:var(--bg);border-radius:6px;margin:8px 0;overflow:hidden}.cb i{display:block;height:100%;background:var(--pr);border-radius:6px}.cn{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);gap:6px;flex-wrap:wrap}
          .hero{position:relative;margin:10px 12px 0;border-radius:16px;overflow:hidden;height:260px;border:1px solid var(--bd)}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}.hero .hc{position:absolute;inset:auto 0 0 0;padding:26px 14px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));display:flex;flex-direction:column}.hero .hc b{font-size:16px}.hero .hc small{opacity:.85;font-size:12px}
          .tg{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed;min-width:560px}.tg th,.tg td{border:1px solid var(--bd);padding:4px;text-align:center;vertical-align:middle;height:46px;word-break:break-word}.tg th{background:var(--bg);font-weight:700}.tg td.sl{background:var(--bg);font-size:11px;width:78px;color:var(--mu)}.tg td.fill{background:var(--grn);cursor:pointer}.tg td.emp{cursor:pointer;color:var(--bd)}.tg small{display:block;color:var(--mu);font-size:10.5px}.tgw{overflow-x:auto;padding:0 8px}
          </style>
          </head>
          <body>
          <header><div class="t"><b>متابعة التلاميذ</b><small id="hsub">متوسطة المجاهد الطاهر ايت علجت</small></div><button data-act="period" aria-label="الفترة">📅</button><button data-act="settings" aria-label="الإعدادات">⚙️</button></header>
          <main id="app"></main>
          <nav id="nav"></nav>
          <div id="modal"></div>
          <div id="viewer"></div>
          <div id="toast"></div>
          <input type="file" id="file" hidden accept=".xlsx,.xlsm,.xls,.csv,.txt">
          <input type="file" id="rfile" hidden accept=".json,application/json">
          <input type="file" id="tfile" hidden accept=".xlsx,.xlsm,.csv,.txt">
          <input type="file" id="pcam" hidden accept="image/*" capture="environment">
          <input type="file" id="pgal" hidden accept="image/*" multiple>
          <script>
          /* ===== قراءة ملفات Excel (xlsx) و CSV بدون مكتبات خارجية ===== */
          async function inflateRaw(u8){
            const ds=new DecompressionStream('deflate-raw');
            const stream=new Blob([u8]).stream().pipeThrough(ds);
            return new Uint8Array(await new Response(stream).arrayBuffer());
          }
          async function unzip(buf){
            const u8=new Uint8Array(buf), dv=new DataView(buf);
            let eocd=-1;
            for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){
              if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
            }
            if(eocd<0) throw new Error('NOTZIP');
            const n=dv.getUint16(eocd+10,true);
            let p=dv.getUint32(eocd+16,true);
            const files={}, dec=new TextDecoder();
            for(let k=0;k<n;k++){
              if(dv.getUint32(p,true)!==0x02014b50) break;
              const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
              const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
              const off=dv.getUint32(p+42,true);
              const name=dec.decode(u8.subarray(p+46,p+46+nl));
              files[name]={method,csize,off};
              p+=46+nl+el+cl;
            }
            async function read(name){
              const f=files[name]; if(!f) return null;
              const ln=dv.getUint16(f.off+26,true), le=dv.getUint16(f.off+28,true);
              const start=f.off+30+ln+le;
              const data=u8.subarray(start,start+f.csize);
              const out=f.method===0?data:await inflateRaw(data);
              return dec.decode(out);
            }
            return {files,read};
          }
          function xmlDecode(s){
            return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
                    .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
                    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
          }
          function attrs(s){const o={};s.replace(/([\w:.-]+)\s*=\s*"([^"]*)"/g,(_,k,v)=>{o[k]=xmlDecode(v);});return o;}
          function tText(s){
            s=s.replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');
            let out='';s.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g,(_,t)=>{out+=xmlDecode(t);});
            return out;
          }
          function colIdx(ref){
            const m=/^([A-Z]+)/.exec(ref);let n=0;
            for(const ch of m[1]) n=n*26+ch.charCodeAt(0)-64;
            return n-1;
          }
          async function readXlsx(buf){
            if(typeof DecompressionStream==='undefined') throw new Error('NODS');
            const z=await unzip(buf);
            const wb=await z.read('xl/workbook.xml');
            if(!wb) throw new Error('NOTXLSX');
            const rels=await z.read('xl/_rels/workbook.xml.rels')||'';
            const relMap={};
            (rels.match(/<Relationship\b[^>]*>/g)||[]).forEach(t=>{const a=attrs(t);relMap[a.Id]=a.Target;});
            const sst=[];
            const sx=await z.read('xl/sharedStrings.xml');
            if(sx) (sx.match(/<si\b[^>]*>[\s\S]*?<\/si>|<si\b[^>]*\/>/g)||[]).forEach(si=>sst.push(tText(si)));
            const sheets=[];
            const tags=wb.match(/<sheet\b[^>]*>/g)||[];
            for(const tag of tags){
              const a=attrs(tag);
              let target=relMap[a['r:id']];
              if(!target) continue;
              target=target.startsWith('/')?target.slice(1):'xl/'+target;
              const xml=await z.read(target);
              if(!xml) continue;
              const rows=[];
              const cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
              let m;
              while((m=cre.exec(xml))){
                const at=attrs(m[1]); if(!at.r||m[2]===undefined) continue;
                const body=m[2]; let val='';
                if(at.t==='s'){const v=/<v>([\s\S]*?)<\/v>/.exec(body); if(v) val=sst[+v[1]]??'';}
                else if(at.t==='inlineStr'){val=tText(body);}
                else{const v=/<v>([\s\S]*?)<\/v>/.exec(body); if(v) val=xmlDecode(v[1]);}
                val=String(val).trim();
                if(val==='') continue;
                const r=+/\d+/.exec(at.r)[0]-1, c=colIdx(at.r);
                (rows[r]=rows[r]||[])[c]=val;
              }
              const out=[];
              for(let i=0;i<rows.length;i++){
                const r=rows[i]||[]; const row=[];
                for(let j=0;j<r.length;j++) row.push(r[j]??'');
                out.push(row);
              }
              sheets.push({name:a.name,rows:out});
            }
            if(!sheets.length) throw new Error('NOSHEETS');
            return sheets;
          }
          function parseCSV(t){
            t=t.replace(/^﻿/,'');
            const first=t.split('\n')[0];
            const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
            const rows=[];let row=[],cur='',q=false;
            for(let i=0;i<t.length;i++){
              const c=t[i];
              if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
              else if(c==='"') q=true;
              else if(c===d){row.push(cur);cur='';}
              else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; row.push(cur);rows.push(row);row=[];cur=''; }
              else cur+=c;
            }
            if(cur!==''||row.length){row.push(cur);rows.push(row);}
            return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''));
          }
          if(typeof module!=='undefined') module.exports={readXlsx,parseCSV};

          /* ===== متابعة التلاميذ — متوسطة المجاهد الطاهر ايت علجت ===== */
          const KEY='mjd_suivi_v1';
          const TYPES={
            abs:{label:'الغيابات',icon:'🚫',nav:'الغيابات',short:'الغيابات'},
            late:{label:'التأخرات',icon:'⏰',nav:'التأخرات',short:'التأخرات'},
            late10:{label:'تأخرات الساعة العاشرة',icon:'🕙',nav:'تأخر العاشرة',short:'العاشرة'},
            esc:{label:'الهروب من الحصص',icon:'🏃',nav:'الهروب',short:'الهروب'},
            book:{label:'عدم إحضار دفتر المراسلة',icon:'📓',nav:'دفتر المراسلة',short:'الدفتر'},
            bad:{label:'التلاميذ المشاغبون',icon:'⚠️',nav:'المشاغبون',short:'المشاغبة'},
            conv:{label:'الاستدعاءات',icon:'📨',nav:'الاستدعاءات',short:'الاستدعاء'},
            rpt:{label:'التقارير',icon:'📝',nav:'التقارير',short:'التقارير'}
          };
          const LV={1:'السنة الأولى متوسط',2:'السنة الثانية متوسط',3:'السنة الثالثة متوسط',4:'السنة الرابعة متوسط',0:'أقسام غير مصنفة'};
          const $=s=>document.querySelector(s);
          const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
          const pad=n=>String(n).padStart(2,'0');
          const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
          function norm(s){
            return String(s==null?'':s).toLowerCase()
              .replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-0x660))
              .normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g,'')
              .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
          }
          function load(){
            try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.students))return normDb(d);}catch(e){}
            return normDb({});
          }
          let db=load();
          function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('تعذّر الحفظ: ذاكرة المتصفح ممتلئة أو ممنوعة');}}
          let S={tab:'search',cls:'',lcls:'',date:todayStr(),q:'',hist:false,hcls:'',imp:null,rep:null,qdate:todayStr(),msid:'',pend:[],recent:[],ncls:''};

          const nameOf=s=>(s.last+' '+s.first).trim();
          const cmpName=(a,b)=>nameOf(a).localeCompare(nameOf(b),'ar');
          const cmpNat=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
          const classes=()=>[...new Set(db.students.map(s=>s.cls))].sort(cmpNat);
          const studentsOf=c=>db.students.filter(s=>s.cls===c).sort(cmpName);
          const byId=id=>db.students.find(s=>s.id===id);
          function levelOf(c){
            if(db.levels&&db.levels[c]) return db.levels[c];
            const n=norm(c);
            if(/ثاني|2eme|2em/.test(n)) return 2;
            if(/ثالث|3eme|3em/.test(n)) return 3;
            if(/رابع|4eme|4em/.test(n)) return 4;
            if(/اول|1er|premi/.test(n)) return 1;
            const d=/\d/.exec(n);
