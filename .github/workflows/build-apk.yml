          function cmpRows(){
            const rows=[['الترتيب','القسم','عدد التلاميذ','الغيابات','منها مبررة','غيابات لكل تلميذ','التأخرات','تأخرات لكل تلميذ']];
            cmpData().forEach((o,i)=>rows.push([i+1,o.cls,o.n,o.abs,o.j,Math.round(o.ra*100)/100,o.late,Math.round(o.rl*100)/100]));
