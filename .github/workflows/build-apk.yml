            <div class="menu"><button class="btn" data-act="bkwa">📤 حفظ / إرسال نسخة كاملة الآن</button></div>
            <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="y_ok" style="width:auto;margin:0"> حفظت النسخة الاحتياطية وأريد المتابعة</label>
            <div class="acts"><button class="btn danger" data-act="yearGo">🎓 بدء السنة الجديدة</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }
          async function yearGo(){
            if(!$('#y_ok')||!$('#y_ok').checked){toast('أكّد أولا أنك حفظت نسخة احتياطية');return;}
            const P=yearPlan(),mp=new Map(P.up),gr=new Set(P.grad);
            db.students=db.students.filter(s=>!gr.has(s.cls));
            db.students.forEach(s=>{if(mp.has(s.cls)) s.cls=mp.get(s.cls);});
            for(const id of new Set([...db.records.flatMap(r=>r.photos||[]),...db.dayPics.map(x=>x.pid),...db.justs.flatMap(j=>j.photos||[]),...Object.values(db.timetables).flat()])){try{await photoDel(id);}catch(x){}}
            db.timetables={};db.dayPics=[];db.sched=[];db.subs=[];db.justs=[];db.decisions=[];db.requests=[];db.pev=[];db.tabs=[];db.reps={};db.absSince={};
            db.records=[];db.contacts=[];db.periods=[];db.curP='';db.levels={};
            save();closeM();S.lcls='';S.cls='';S.tab='lists';render();toast('بدأت السنة الجديدة: '+db.students.length+' تلميذ');
          }

          /* ---------- مشاركة نص (واتساب / مسنجر …) ---------- */
          async function shareText(t){
            try{
              const C=window.Capacitor;
              if(C&&C.isNativePlatform&&C.isNativePlatform()){await plug('Share').share({text:t,dialogTitle:'إرسال عبر'});return;}
              if(navigator.share){await navigator.share({text:t});return;}
            }catch(e){if(/cancel|abort|dismiss/i.test(String(e&&(e.name||e.message)))) return;}
            window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
          }
          document.addEventListener('click',e=>{const a=e.target.closest('a[data-plog]');if(a) logContact(a.dataset.sid,a.dataset.plog,'');});

          /* ---------- حفظ في ذاكرة الهاتف ---------- */
          async function saveLocal(full){
            try{
              const txt=await buildBackup(full),name='backup-'+todayStr()+(full?'-full':'')+'-'+Date.now().toString(36).slice(-3)+'.json';
              const C=window.Capacitor;
              if(!(C&&C.isNativePlatform&&C.isNativePlatform())){await download(name,txt,'application/json');return;}
              const FS=plug('Filesystem');if(!FS) throw new Error('الإضافة غير متوفرة');
              try{await FS.requestPermissions();}catch(x){}
              await FS.writeFile({path:'MutabaaTalamid/'+name,data:toB64(txt),directory:'DOCUMENTS',recursive:true});
              try{localStorage.setItem('mjd_last_backup',new Date().toISOString());}catch(x){}
              render();
              modal(`<h3>✅ تم الحفظ في الهاتف</h3><p>المكان: <b dir="ltr">Documents/MutabaaTalamid/${name}</b></p><p class="muted">تلقاه في تطبيق «الملفات» ← Documents ← MutabaaTalamid. وللاسترجاع استعمل «استرجاع من ملف» واختر الملف من الهاتف.</p><div class="acts"><button class="btn" data-act="closem">حسنا</button></div>`);
            }catch(e){toast('تعذّر الحفظ في الهاتف: '+String(e&&(e.message||e)).slice(0,90)+' — استعمل «إرسال» ثم اختر Drive أو الملفات');}
          }


          async function listLocal(){
            const C=window.Capacitor;
            if(!(C&&C.isNativePlatform&&C.isNativePlatform())){$('#rfile').value='';$('#rfile').click();return;}
            try{
              const FS=plug('Filesystem');try{await FS.requestPermissions();}catch(x){}
              const r=await FS.readdir({path:'MutabaaTalamid',directory:'DOCUMENTS'});
              const fl=(r.files||[]).map(f=>typeof f==='string'?{name:f}:f).filter(f=>/\.json$/i.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name));
              modal(`<h3>📂 النسخ المحفوظة في الهاتف</h3><p class="muted" dir="ltr" style="text-align:right">Documents/MutabaaTalamid</p>
              <div class="menu">${fl.length?fl.map(f=>`<button class="btn ghost" data-act="openlocal" data-name="${esc(f.name)}" dir="ltr">${esc(f.name)}</button>`).join(''):'<p class="muted">لا توجد نسخ في هذا المجلد.</p>'}</div>
              <div class="acts"><button class="btn ghost" data-act="restore">اختيار ملف آخر من الهاتف…</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            }catch(x){modal(`<h3>لا توجد نسخ هنا</h3><p class="muted">لم أجد مجلد النسخ في الهاتف. اختر الملف يدويا.</p><div class="acts"><button class="btn" data-act="restore">📥 اختيار ملف من الهاتف…</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);}
          }
          async function openLocal(name){
            try{
              const r=await plug('Filesystem').readFile({path:'MutabaaTalamid/'+name,directory:'DOCUMENTS',encoding:'utf8'});
              const txt=typeof r.data==='string'?r.data:await r.data.text();
              closeM();await readBackup({text:async()=>txt});
            }catch(x){toast('تعذّرت قراءة الملف: '+String(x&&(x.message||x)).slice(0,80));}
          }

          /* ---------- ربط الأحداث ---------- */
          function extraClick(a,d,el,e){
            switch(a){
              case 'mic':micFor(d.for);break;
