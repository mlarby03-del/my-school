          function exportRows(types){
            const rows=[['التاريخ','القسم','اللقب','الاسم','النوع','ملاحظة','الأستاذ','السبب','صور']];
            db.records.filter(r=>types.includes(r.type)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
              const s=byId(r.sid); if(!s) return;
              rows.push([r.date,s.cls,s.last,s.first,TYPES[r.type].nav+(r.type==='abs'&&r.just?' (مبرر)':''),r.note||'',r.teacher||'',r.reason||'',(r.photos||[]).length||'']);
            });
            return rows;
          }

          /* ---------- الاستيراد ---------- */
          function guess(rows){
            let hi=0;
            for(let i=0;i<Math.min(rows.length,12);i++){if((rows[i]||[]).filter(x=>x!=='').length>=2){hi=i;break;}}
            const m={hi,clsCol:-1,last:-1,first:-1,full:-1,lvlCol:-1,grpCol:-1,father:-1,motherLast:-1,motherFirst:-1,phone:-1,address:-1,sex:-1,birth:-1,birthPlace:-1,status:-1};
            (rows[hi]||[]).forEach((c,i)=>{
              const h=norm(c); if(!h) return;
              const X=(k)=>{if(m[k]<0)m[k]=i;};
              if(/لقب.*ام|ام.*لقب|nom.*mere/.test(h)&&/(?:^|\s)ال?ام(?:\s|$)|mere/.test(h)) X('motherLast');
              else if(/اسم.*(?:\s)ال?ام(?:\s|$)|(?:^|\s)ال?ام.*اسم|prenom.*mere/.test(h)||h==='الام') X('motherFirst');
              else if(/(?:^|\s)ال?اب(?:\s|$)|pere/.test(h)&&/اسم|nom|prenom|اب/.test(h)&&!/لقب/.test(h)) X('father');
              else if(/هاتف|phone|tel|mobile|portable|جوال|نقال/.test(h)) X('phone');
              else if(/عنوان|adresse|address/.test(h)) X('address');
              else if(/جنس|sexe|gender/.test(h)) X('sex');
              else if(/مكان|lieu/.test(h)) X('birthPlace');
              else if(/ميلاد|naiss|birth/.test(h)) X('birth');
              else if(/صفه|statut|status/.test(h)) X('status');
              else if(/فوج|groupe|group/.test(h)){if(m.grpCol<0)m.grpCol=i;}
              else if(/مستوي|niveau|level/.test(h)){if(m.lvlCol<0)m.lvlCol=i;}
              else if(/قسم|classe|class|section/.test(h)){if(m.clsCol<0)m.clsCol=i;}
              else if((/لقب/.test(h)&&/اسم/.test(h))||(/nom/.test(h)&&/prenom/.test(h))||/nom complet|full ?name/.test(h)){if(m.full<0)m.full=i;}
              else if(/prenom|^ال?اسم|first|given/.test(h)){if(m.first<0)m.first=i;}
              else if(/لقب|^nom|famille|last|surname/.test(h)){if(m.last<0)m.last=i;}
            });
            return m;
          }
          const cell=(r,i)=>i>=0&&r[i]!=null?String(r[i]).replace(/\s+/g,' ').trim():'';
          function lvNum(v){
            const n=norm(v);
            if(/اول|1er|premi/.test(n)) return 1;
            if(/ثاني|2e|deuxi/.test(n)) return 2;
            if(/ثالث|3e|troisi/.test(n)) return 3;
            if(/رابع|4e|quatri/.test(n)) return 4;
            const d=/[1-4]/.exec(n);return d?+d[0]:0;
          }
          function autoMode(m,multi){return m.clsCol>=0?'col':(m.lvlCol>=0&&m.grpCol>=0?'combo':(multi?'sheet':'fixed'));}
          function parseSheet(sh,m,clsMode,fixed){
            const out=[];let cur='';
            for(const r of sh.rows.slice(m.hi+1)){
              if(!r) continue;
              let last=cell(r,m.last),first=cell(r,m.first);
              if(m.full>=0&&!last&&!first) last=cell(r,m.full);
              if(!last&&!first) continue;
              let c;
              if(clsMode==='col'){c=cell(r,m.clsCol);if(c)cur=c;else c=cur;}
              else if(clsMode==='combo'){
                const lv=cell(r,m.lvlCol),g=cell(r,m.grpCol).replace(/\.0$/,''),n=lvNum(lv);
                c=(!lv&&!g)?'':(n?n+'م':(lv+' '))+g;
              }
              else if(clsMode==='sheet') c=sh.name.trim();
              else c=fixed.trim();
              const ex={};['father','motherLast','motherFirst','phone','address','sex','birth','birthPlace','status'].forEach(k=>{const v=cell(r,m[k]);if(v)ex[k]=v;});
              out.push({cls:c,last,first,...ex});
            }
            return out;
          }
          function impCompute(I){
            let list=[];
            if(I.sheet==='all'){
              for(const sh of I.sheets){const m=guess(sh.rows);list=list.concat(parseSheet(sh,m,autoMode(m,true),''));}
            }else{
              list=parseSheet(I.sheets[I.sheet],I.map,I.clsMode,I.fixed);
            }
            const have=new Map(db.students.map(s=>[norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first),s]));
            const fresh=[],upd=[];let skipped=0,noCls=0;
            for(const s of list){
              if(!s.cls){noCls++;continue;}
              const k=norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first);
              if(have.has(k)){skipped++;const o=have.get(k);if(!(o.id===undefined)&&Object.keys(s).some(x=>!['cls','last','first'].includes(x)&&!o[x])) upd.push([o,s]);continue;}
              have.set(k,s);fresh.push(s);
            }
            return {fresh,skipped,noCls,upd};
          }
          function colOpts(sh,sel,extra){
            const w=Math.max(0,...sh.rows.slice(0,15).map(r=>(r||[]).length));
            const hr=sh.rows[0]||[];
            let h=extra||'';
            for(let i=0;i<w;i++){
              const hdr=(sh.rows[S.imp.map.hi]||[])[i];
              h+=`<option value="${i}"${sel===i?' selected':''}>${esc(hdr?hdr:'عمود '+(i+1))}</option>`;
            }
            return h;
          }
          function viewImport(){
            const I=S.imp,res=impCompute(I);
            let h=`<div class="bar"><button class="btn ghost sm" data-act="impcancel">→ رجوع</button><b>استيراد التلاميذ</b></div><p class="muted pad">الملف: ${esc(I.file)}</p><div class="pad">`;
            h+=`<label>الورقة</label><select id="isheet">${I.sheets.length>1?`<option value="all"${I.sheet==='all'?' selected':''}>كل الأوراق (تلقائي)</option>`:''}${I.sheets.map((s,i)=>`<option value="${i}"${I.sheet===i?' selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
            if(I.sheet!=='all'){
              const sh=I.sheets[I.sheet],m=I.map,none='<option value="-1">— لا يوجد —</option>';
              const clsSel=I.clsMode==='col'?'c'+m.clsCol:I.clsMode;
              const clsOpts=`<option value="sheet"${clsSel==='sheet'?' selected':''}>اسم الورقة</option><option value="fixed"${clsSel==='fixed'?' selected':''}>قسم واحد (أكتبه)</option>${m.lvlCol>=0&&m.grpCol>=0?`<option value="combo"${clsSel==='combo'?' selected':''}>المستوى + رقم الفوج (مثال 4م1)</option>`:''}`+
                colOpts(sh,-9).replace(/<option value="(\d+)"( selected)?>/g,(x,i)=>`<option value="c${i}"${clsSel==='c'+i?' selected':''}>`);
              h+=`<label>عمود القسم</label><select id="m_cls">${clsOpts}</select>`;
              if(I.clsMode==='fixed') h+=`<input id="m_fixed" placeholder="مثال: 1م1" value="${esc(I.fixed)}">`;
              h+=`<label>عمود اللقب</label><select id="m_last">${colOpts(sh,m.last,none)}</select>
              <label>عمود الاسم</label><select id="m_first">${colOpts(sh,m.first,none)}</select>
              <label>أو عمود «اللقب والاسم» معا</label><select id="m_full">${colOpts(sh,m.full,none)}</select>`;
            }
            const byC={};res.fresh.forEach(s=>byC[s.cls]=(byC[s.cls]||0)+1);
            const names=Object.keys(byC).sort(cmpNat);
            h+=`<div class="prev"><b>${res.fresh.length}</b> تلميذ جديد في <b>${names.length}</b> قسم${res.skipped?` · ${res.skipped} موجود مسبقا (يتخطى)${res.upd.length?' — ويُكمَّل '+res.upd.length+' ببيانات جديدة (الأب، العنوان…)':''}`:''}${res.noCls?` · ${res.noCls} بدون قسم (يتخطى)`:''}
            <div class="chips">${names.map(c=>`<span>${esc(c)} <b>${byC[c]}</b></span>`).join('')}</div>${names.some(c=>levelOf(c)===0)?`<p class="warn">⚠️ هذه الأقسام ما فيها رقم المستوى (1 إلى 4) وستظهر في «أقسام أخرى»: ${names.filter(c=>levelOf(c)===0).map(esc).join('، ')}. تقدر تصحح اسمها بعد الاستيراد.</p>`:''}
            ${res.fresh.slice(0,4).map(s=>`<div class="muted">${esc(s.cls)} — ${esc((s.last+' '+s.first).trim())}</div>`).join('')}</div>`;
            h+=`<div class="acts"><button class="btn" data-act="impgo"${res.fresh.length||res.upd.length?'':' disabled'}>✅ استيراد ${res.fresh.length} تلميذ</button></div></div>`;
            return h;
          }
          async function onFile(f){
            try{
              const ext=f.name.split('.').pop().toLowerCase();let sheets;
              if(ext==='xlsx'||ext==='xlsm') sheets=await readXlsx(await f.arrayBuffer());
              else if(ext==='csv'||ext==='txt'){
                const b=new Uint8Array(await f.arrayBuffer());let t;
                try{t=new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){t=new TextDecoder('windows-1256').decode(b);}
                sheets=[{name:f.name.replace(/\.\w+$/,''),rows:parseCSV(t)}];
              }else if(ext==='xls'){toast('صيغة xls قديمة: افتح الملف في Excel واحفظه بصيغة xlsx ثم أعد المحاولة');return;}
              else{toast('نوع الملف غير مدعوم');return;}
              const I={file:f.name,sheets,sheet:sheets.length>1?'all':0,fixed:'',map:null,clsMode:'sheet'};
              I.map=guess(sheets[0].rows);I.clsMode=autoMode(I.map,sheets.length>1);
              closeM();S.imp=I;render();window.scrollTo(0,0);
            }catch(e){
              const m=String(e&&e.message);
              toast(m==='NODS'?'المتصفح قديم: احفظ الملف بصيغة CSV ثم استورده':m==='NOTZIP'||m==='NOTXLSX'?'الملف ليس xlsx صالحا':'تعذّرت قراءة الملف');
            }
          }
          function impSetSheet(v){
            const I=S.imp;I.sheet=v==='all'?'all':+v;
            if(I.sheet!=='all'){const sh=I.sheets[I.sheet];I.map=guess(sh.rows);I.clsMode=autoMode(I.map,I.sheets.length>1);}
          }

