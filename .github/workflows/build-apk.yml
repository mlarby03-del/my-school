            ${cOf(sid).length?`<h2 class="blk">اتصالات وزيارات الولي</h2><table class="t">${cOf(sid).map(x=>`<tr class="blk"><td style="white-space:nowrap">${fmtDate(x.date)} ${esc(x.time||'')}</td><td style="white-space:nowrap">${HOW[x.how]||x.how}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</table>`:''}
