          function viewReq(){
            if(!db.students.length) return `<div class="title">🙋 طلبات التلاميذ</div>`+emptyState();
            const all=db.requests.map(r=>({r,s:byId(r.sid)})).filter(o=>o.s).sort((a,b)=>b.r.date.localeCompare(a.r.date)),
              L=all.filter(o=>S.rqf==='a'||(S.rqf==='d'?o.r.done:!o.r.done)),np=all.filter(o=>!o.r.done).length,sg=(v,t)=>`<button class="${S.rqf===v?'on':''}" data-act="rqf" data-v="${v}">${t}</button>`;
            return `<div class="title">🙋 طلبات التلاميذ</div><div class="acts" style="padding:0 12px"><button class="btn sm" data-act="rqadd">➕ طلب جديد</button></div>
            <div class="seg">${sg('p','⏳ قيد الانتظار ('+np+')')}${sg('d','✅ تمّت')}${sg('a','الكل')}</div>`+
            (L.length?L.map(o=>`<div class="row"><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)} · ${fmtDate(o.r.date)} · <b>${esc(o.r.kind)}</b>${o.r.note?' — '+esc(o.r.note):''}</small></span><button class="btn sm${o.r.done?' ghost':''}" data-act="rqdone" data-id="${o.r.id}">${o.r.done?'↩️':'✅ تم'}</button><button class="x" data-act="rqdel" data-id="${o.r.id}" aria-label="حذف">✕</button></div>`).join(''):'<p class="muted pad">لا توجد طلبات</p>');
          }
          function rqModal(){
            modal(`<h3>🙋 طلب جديد</h3><label>التلميذ (اكتب الاسم)</label><input id="rq_q" type="search" autocomplete="off" placeholder="🔍 ابحث بالاسم…"><input type="hidden" id="rq_sid"><div id="rq_res"></div>
            <label>نوع الطلب</label><select id="rq_kind">${RQK.map(k=>`<option>${k}</option>`).join('')}</select>
