            else db.records.splice(db.records.indexOf(r),1);
            save();render();
          }

          /* ---------- بطاقة التلميذ ---------- */
          function quick(sid,type){
            const date=S.qdate||todayStr();
            if(type==='conv'||type==='rpt'){detModal(type,sid,date);return;}
            const r=findRec(type,sid,date);
            if(!r) db.records.push(mkRec(type,sid,date));
            else if(type==='abs'&&!r.just) r.just=true;
            else db.records.splice(db.records.indexOf(r),1);
            save();render();stuModal(sid);
          }
          function stuModal(sid){
            const s=byId(sid); if(!s) return;
            S.msid=sid;
            const c=counts()[sid]||zero();
            const recs=db.records.filter(r=>r.sid===sid).sort((a,b)=>b.date.localeCompare(a.date));
            modal(`<h3>${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)}</p>
            <label>سجّل في تاريخ</label><input type="date" id="qdate" value="${S.qdate}">
            <div class="qk">${Object.keys(TYPES).map(k=>{const r=findRec(k,sid,S.qdate);return `<button class="${r?'on':''}" data-act="quick" data-sid="${sid}" data-type="${k}"><span>${TYPES[k].icon}</span>${TYPES[k].nav}${r?(k==='abs'&&r.just?' (مبرر) ✓':' ✓'):''}</button>`;}).join('')}</div>
            <div class="stats">${Object.keys(TYPES).map(k=>`<div class="${c[k]>=3?'hot':''}"><b>${c[k]}</b><small>${TYPES[k].short}</small></div>`).join('')}</div>
            ${c.late>=3?`<p class="warn">⏰ تأخر ${c.late} مرات${lateTail(sid)}</p>`:''}${c.abs>=3?`<p class="warn">🚫 غاب ${c.abs} مرات</p>`:''}
            <div class="hl">${recs.length?recs.map(r=>`<div class="row hr"><span class="sub">${fmtDate(r.date)}</span><span class="nm">${TYPES[r.type].icon} ${TYPES[r.type].nav}</span><span class="st">${recNote(r)}</span><button class="x" data-act="delrec2" data-rid="${r.id}" data-sid="${sid}">✕</button></div>`).join(''):'<p class="muted">لا توجد تسجيلات</p>'}</div>
            <div class="acts"><button class="btn ghost" data-act="editstu" data-sid="${sid}">✏️ تعديل</button><button class="btn danger" data-act="delstu" data-sid="${sid}">🗑️ حذف</button><button class="btn" data-act="closem">إغلاق</button></div>`);
          }
          function recNote(r){
            if(r.type==='abs'&&r.just) return 'مبرَّر';
            if(r.type==='conv'||r.type==='rpt') return esc((r.teacher||'')+(r.teacher&&r.reason?' — ':'')+(r.reason||''))+(r.photos&&r.photos.length?' 📷'+r.photos.length:'');
            return esc(r.note||'');
          }
          function detDay(type,sid){
            const n=db.records.filter(x=>x.type===type&&x.sid===sid&&x.date===S.date).length;
            return n>1?' (×'+n+')':'';
          }
          const DET={
            conv:{icon:'📨',who:'الأستاذ المستدعي',why:'سبب الاستدعاء',add:'تسجيل الاستدعاء',cnt:'عدد الاستدعاءات',nw:'استدعاء جديد'},
            rpt:{icon:'📝',who:'الأستاذ كاتب التقرير',why:'سبب التقرير',add:'تسجيل التقرير',cnt:'عدد التقارير',nw:'تقرير جديد'}
          };
          function photosHtml(r){
            return r.photos&&r.photos.length?'<div class="thumbs">'+r.photos.map(id=>`<img data-pid="${id}" data-act="view" alt="صورة التقرير">`).join('')+'</div>':'';
          }
          function renderPend(){
            const e=$('#pend');if(!e) return;
            e.innerHTML=S.pend.map(id=>`<span class="th"><img data-pid="${id}" data-act="view" alt=""><button class="x" data-act="unpend" data-pid="${id}" aria-label="حذف الصورة">✕</button></span>`).join('');
            hydrate();
          }
          function detModal(type,sid,date){
            const s=byId(sid); if(!s) return;
            const D=DET[type];
            const recs=db.records.filter(r=>r.sid===sid&&r.type===type).sort((a,b)=>b.date.localeCompare(a.date));
            const teachers=[...new Set(db.records.filter(r=>(r.type==='conv'||r.type==='rpt')&&r.teacher).map(r=>r.teacher))];
            modal(`<h3>${D.icon} ${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)} · ${D.cnt}: <b>${recs.length}</b></p>
            <div>${recs.map(r=>`<div class="cv"><div><b>${fmtDate(r.date)}</b> · ${esc(r.teacher||'—')}<br><span class="muted">${esc(r.reason||'')}</span>${photosHtml(r)}</div><button class="x" data-act="deldet" data-type="${type}" data-rid="${r.id}" data-sid="${sid}" data-date="${date}" aria-label="حذف">✕</button></div>`).join('')}</div>
            <h3 style="margin-top:14px;font-size:15px">${D.nw} — ${fmtDate(date)}</h3>
            <label>${D.who}</label><input id="c_teacher" list="tl" autocomplete="off"><datalist id="tl">${teachers.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
            <label>${D.why}</label><textarea id="c_reason" rows="3"></textarea>
            ${type==='rpt'?`<label>صورة التقرير المكتوب</label><div class="ph"><button class="btn ghost sm" data-act="shoot">📷 تصوير</button><button class="btn ghost sm" data-act="gallery">🖼️ من المعرض</button></div><div id="pend" class="thumbs"></div>`:''}
            <div class="acts"><button class="btn" data-act="adddet" data-type="${type}" data-sid="${sid}" data-date="${date}">${D.add}</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            renderPend();hydrate();
          }
          function dropRec(rid){
            const r=db.records.find(x=>x.id===rid);
            if(r&&r.photos) r.photos.forEach(photoDel);
            db.records=db.records.filter(x=>x.id!==rid);
          }

          /* ---------- الصور (IndexedDB) ---------- */
          let _idb;
          function idb(){return _idb||(_idb=new Promise((res,rej)=>{const q=indexedDB.open('mjd_photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
          async function photoPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
          async function photoGet(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
          function photoDel(id){idb().then(d=>{d.transaction('p','readwrite').objectStore('p').delete(id);delete purl[id];}).catch(()=>{});}
          function photoClear(){return idb().then(d=>new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').clear();t.oncomplete=()=>res();t.onerror=()=>res();})).catch(()=>{});}
          const purl={};
          async function photoUrl(id){if(purl[id]) return purl[id];try{const b=await photoGet(id);if(!b) return '';return purl[id]=URL.createObjectURL(b);}catch(e){return '';}}
          async function hydrate(){
            for(const im of document.querySelectorAll('img[data-pid]')){
              if(im.getAttribute('src')) continue;
              const u=await photoUrl(im.dataset.pid);
              if(u) im.src=u; else im.alt='الصورة غير متوفرة';
            }
          }
          function shrink(file,max,q){
            return new Promise((res,rej)=>{
              const url=URL.createObjectURL(file),im=new Image();
              im.onload=()=>{
                let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));
                w=Math.round(w*k);h=Math.round(h*k);
                const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
                URL.revokeObjectURL(url);
                c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
              };
              im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
              im.src=url;
            });
          }
          async function addPhotos(files){
            for(const f of files){
              try{
                const b=await shrink(f,1600,0.72),id='p'+uid();
                await photoPut(id,b);
                const tr=S.ptarget&&db.records.find(x=>x.id===S.ptarget);
                if(tr){(tr.photos=tr.photos||[]).push(id);save();}else S.pend.push(id);
              }catch(e){toast('تعذّر حفظ الصورة');}
            }
            if(S.ptarget){const t=S.ptarget;S.ptarget='';recModal(t);render();}else renderPend();
          }

          /* ---------- حفظ المعطيات واسترجاعها ---------- */
          let BK=null;
          const lastBk=()=>{try{return localStorage.getItem('mjd_last_backup')||'';}catch(e){return '';}};
          const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?'':pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
          function bkBanner(){
            if(!db.records.length) return '';
