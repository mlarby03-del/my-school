      - name: Use a fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -d > ~/.android/debug.keystore <<'EOF_KEY'
          
          EOF_KEY

      - name: Raise versionCode so each build installs over the old one
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((1000 + ${{ github.run_number }}))/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: suivi-eleves-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
