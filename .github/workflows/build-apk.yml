          function exportRows(types){
            const rows=[['التاريخ','القسم','اللقب','الاسم','النوع','ملاحظة','الأستاذ','السبب','صور']];
            db.records.filter(r=>types.includes(r.type)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
              const s=byId(r.sid); if(!s) return;
              rows.push([r.date,s.cls,s.last,s.first,TYPES[r.type].nav+(r.type==='abs'&&r.just?' (مبرر)':''),r.note||'',r.teacher||'',r.reason||'',(r.photos||[]).length||'']);
            });
            return rows;
          }

          /* ---------- الاستيراد ---------- */
          function guess(rows){
            let hi=0;
            for(let i=0;i<Math.min(rows.length,12);i++){if((rows[i]||[]).filter(x=>x!=='').length>=2){hi=i;break;}}
            const m={hi,clsCol:-1,last:-1,first:-1,full:-1,lvlCol:-1,grpCol:-1,father:-1,motherLast:-1,motherFirst:-1,phone:-1,address:-1,sex:-1,birth:-1,birthPlace:-1,status:-1};
            (rows[hi]||[]).forEach((c,i)=>{
              const h=norm(c); if(!h) return;
              const X=(k)=>{if(m[k]<0)m[k]=i;};
              if(/لقب.*ام|ام.*لقب|nom.*mere/.test(h)&&/(?:^|\s)ال?ام(?:\s|$)|mere/.test(h)) X('motherLast');
              else if(/اسم.*(?:\s)ال?ام(?:\s|$)|(?:^|\s)ال?ام.*اسم|prenom.*mere/.test(h)||h==='الام') X('motherFirst');
              else if(/(?:^|\s)ال?اب(?:\s|$)|pere/.test(h)&&/اسم|nom|prenom|اب/.test(h)&&!/لقب/.test(h)) X('father');
              else if(/هاتف|phone|tel|mobile|portable|جوال|نقال/.test(h)) X('phone');
              else if(/عنوان|adresse|address/.test(h)) X('address');
              else if(/جنس|sexe|gender/.test(h)) X('sex');
              else if(/مكان|lieu/.test(h)) X('birthPlace');
              else if(/ميلاد|naiss|birth/.test(h)) X('birth');
              else if(/صفه|statut|status/.test(h)) X('status');
              else if(/فوج|groupe|group/.test(h)){if(m.grpCol<0)m.grpCol=i;}
              else if(/مستوي|niveau|level/.test(h)){if(m.lvlCol<0)m.lvlCol=i;}
              else if(/قسم|classe|class|section/.test(h)){if(m.clsCol<0)m.clsCol=i;}
              else if((/لقب/.test(h)&&/اسم/.test(h))||(/nom/.test(h)&&/prenom/.test(h))||/nom complet|full ?name/.test(h)){if(m.full<0)m.full=i;}
              else if(/prenom|^ال?اسم|first|given/.test(h)){if(m.first<0)m.first=i;}
              else if(/لقب|^nom|famille|last|surname/.test(h)){if(m.last<0)m.last=i;}
            });
            return m;
          }
          const cell=(r,i)=>i>=0&&r[i]!=null?String(r[i]).replace(/\s+/g,' ').trim():'';
          function lvNum(v){
            const n=norm(v);
            if(/اول|1er|premi/.test(n)) return 1;
            if(/ثاني|2e|deuxi/.test(n)) return 2;
            if(/ثالث|3e|troisi/.test(n)) return 3;
            if(/رابع|4e|quatri/.test(n)) return 4;
            const d=/[1-4]/.exec(n);return d?+d[0]:0;
          }
          function autoMode(m,multi){return m.clsCol>=0?'col':(m.lvlCol>=0&&m.grpCol>=0?'combo':(multi?'sheet':'fixed'));}
          function parseSheet(sh,m,clsMode,fixed){
            const out=[];let cur='';
            for(const r of sh.rows.slice(m.hi+1)){
              if(!r) continue;
              let last=cell(r,m.last),first=cell(r,m.first);
              if(m.full>=0&&!last&&!first) last=cell(r,m.full);
              if(!last&&!first) continue;
              let c;
              if(clsMode==='col'){c=cell(r,m.clsCol);if(c)cur=c;else c=cur;}
              else if(clsMode==='combo'){
                const lv=cell(r,m.lvlCol),g=cell(r,m.grpCol).replace(/\.0$/,''),n=lvNum(lv);
                c=(!lv&&!g)?'':(n?n+'م':(lv+' '))+g;
              }
              else if(clsMode==='sheet') c=sh.name.trim();
              else c=fixed.trim();
              const ex={};['father','motherLast','motherFirst','phone','address','sex','birth','birthPlace','status'].forEach(k=>{const v=cell(r,m[k]);if(v)ex[k]=v;});
              out.push({cls:c,last,first,...ex});
            }
            return out;
          }
          function impCompute(I){
            let list=[];
            if(I.sheet==='all'){
              for(const sh of I.sheets){const m=guess(sh.rows);list=list.concat(parseSheet(sh,m,autoMode(m,true),''));}
            }else{
              list=parseSheet(I.sheets[I.sheet],I.map,I.clsMode,I.fixed);
            }
            const have=new Map(db.students.map(s=>[norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first),s]));
            const fresh=[],upd=[];let skipped=0,noCls=0;
            for(const s of list){
              if(!s.cls){noCls++;continue;}
              const k=norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first);
              if(have.has(k)){skipped++;const o=have.get(k);if(!(o.id===undefined)&&Object.keys(s).some(x=>!['cls','last','first'].includes(x)&&!o[x])) upd.push([o,s]);continue;}
              have.set(k,s);fresh.push(s);
            }
            return {fresh,skipped,noCls,upd};
          }
          function colOpts(sh,sel,extra){
            const w=Math.max(0,...sh.rows.slice(0,15).map(r=>(r||[]).length));
            const hr=sh.rows[0]||[];
            let h=extra||'';
            for(let i=0;i<w;i++){
              const hdr=(sh.rows[S.imp.map.hi]||[])[i];
              h+=`<option value="${i}"${sel===i?' selected':''}>${esc(hdr?hdr:'عمود '+(i+1))}</option>`;
            }
            return h;
          }
          function viewImport(){
            const I=S.imp,res=impCompute(I);
            let h=`<div class="bar"><button class="btn ghost sm" data-act="impcancel">→ رجوع</button><b>استيراد التلاميذ</b></div><p class="muted pad">الملف: ${esc(I.file)}</p><div class="pad">`;
            h+=`<label>الورقة</label><select id="isheet">${I.sheets.length>1?`<option value="all"${I.sheet==='all'?' selected':''}>كل الأوراق (تلقائي)</option>`:''}${I.sheets.map((s,i)=>`<option value="${i}"${I.sheet===i?' selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
            if(I.sheet!=='all'){
              const sh=I.sheets[I.sheet],m=I.map,none='<option value="-1">— لا يوجد —</option>';
              const clsSel=I.clsMode==='col'?'c'+m.clsCol:I.clsMode;
              const clsOpts=`<option value="sheet"${clsSel==='sheet'?' selected':''}>اسم الورقة</option><option value="fixed"${clsSel==='fixed'?' selected':''}>قسم واحد (أكتبه)</option>${m.lvlCol>=0&&m.grpCol>=0?`<option value="combo"${clsSel==='combo'?' selected':''}>المستوى + رقم الفوج (مثال 4م1)</option>`:''}`+
                colOpts(sh,-9).replace(/<option value="(\d+)"( selected)?>/g,(x,i)=>`<option value="c${i}"${clsSel==='c'+i?' selected':''}>`);
              h+=`<label>عمود القسم</label><select id="m_cls">${clsOpts}</select>`;
              if(I.clsMode==='fixed') h+=`<input id="m_fixed" placeholder="مثال: 1م1" value="${esc(I.fixed)}">`;
              h+=`<label>عمود اللقب</label><select id="m_last">${colOpts(sh,m.last,none)}</select>
              <label>عمود الاسم</label><select id="m_first">${colOpts(sh,m.first,none)}</select>
              <label>أو عمود «اللقب والاسم» معا</label><select id="m_full">${colOpts(sh,m.full,none)}</select>`;
            }
            const byC={};res.fresh.forEach(s=>byC[s.cls]=(byC[s.cls]||0)+1);
            const names=Object.keys(byC).sort(cmpNat);
            h+=`<div class="prev"><b>${res.fresh.length}</b> تلميذ جديد في <b>${names.length}</b> قسم${res.skipped?` · ${res.skipped} موجود مسبقا (يتخطى)${res.upd.length?' — ويُكمَّل '+res.upd.length+' ببيانات جديدة (الأب، العنوان…)':''}`:''}${res.noCls?` · ${res.noCls} بدون قسم (يتخطى)`:''}
            <div class="chips">${names.map(c=>`<span>${esc(c)} <b>${byC[c]}</b></span>`).join('')}</div>${names.some(c=>levelOf(c)===0)?`<p class="warn">⚠️ هذه الأقسام ما فيها رقم المستوى (1 إلى 4) وستظهر في «أقسام أخرى»: ${names.filter(c=>levelOf(c)===0).map(esc).join('، ')}. تقدر تصحح اسمها بعد الاستيراد.</p>`:''}
            ${res.fresh.slice(0,4).map(s=>`<div class="muted">${esc(s.cls)} — ${esc((s.last+' '+s.first).trim())}</div>`).join('')}</div>`;
            h+=`<div class="acts"><button class="btn" data-act="impgo"${res.fresh.length||res.upd.length?'':' disabled'}>✅ استيراد ${res.fresh.length} تلميذ</button></div></div>`;
            return h;
          }
          async function onFile(f){
            try{
              const ext=f.name.split('.').pop().toLowerCase();let sheets;
              if(ext==='xlsx'||ext==='xlsm') sheets=await readXlsx(await f.arrayBuffer());
              else if(ext==='csv'||ext==='txt'){
                const b=new Uint8Array(await f.arrayBuffer());let t;
                try{t=new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){t=new TextDecoder('windows-1256').decode(b);}
                sheets=[{name:f.name.replace(/\.\w+$/,''),rows:parseCSV(t)}];
              }else if(ext==='xls'){toast('صيغة xls قديمة: افتح الملف في Excel واحفظه بصيغة xlsx ثم أعد المحاولة');return;}
              else{toast('نوع الملف غير مدعوم');return;}
              const I={file:f.name,sheets,sheet:sheets.length>1?'all':0,fixed:'',map:null,clsMode:'sheet'};
              I.map=guess(sheets[0].rows);I.clsMode=autoMode(I.map,sheets.length>1);
              closeM();S.imp=I;render();window.scrollTo(0,0);
            }catch(e){
              const m=String(e&&e.message);
              toast(m==='NODS'?'المتصفح قديم: احفظ الملف بصيغة CSV ثم استورده':m==='NOTZIP'||m==='NOTXLSX'?'الملف ليس xlsx صالحا':'تعذّرت قراءة الملف');
            }
          }
          function impSetSheet(v){
            const I=S.imp;I.sheet=v==='all'?'all':+v;
            if(I.sheet!=='all'){const sh=I.sheets[I.sheet];I.map=guess(sh.rows);I.clsMode=autoMode(I.map,I.sheets.length>1);}
          }

          /* ---------- الأحداث ---------- */
          document.addEventListener('click',e=>{
            const el=e.target.closest('[data-act]');if(!el) return;
            const a=el.dataset.act,d=el.dataset;
            if(a==='none') return;
            if(a==='closem'){if(el.classList.contains('mb')&&e.target!==el) return;closeM();return;}
            switch(a){
              case 'tab':S.tab=d.tab;S.hist=false;S.imp=null;S.rep=null;render();window.scrollTo(0,0);break;
              case 'settings':settingsModal();break;
              case 'pick':closeM();$('#file').value='';$('#file').click();break;
              case 'lcls':S.lcls=d.c;render();window.scrollTo(0,0);break;
              case 'lback':S.lcls='';render();break;
              case 'stu':stuModal(d.sid);break;
              case 'quick':quick(d.sid,d.type);break;
              case 'adddet':{
                const type=d.type,teacher=$('#c_teacher').value.trim(),reason=$('#c_reason').value.trim();
                if(!teacher&&!reason&&!S.pend.length){toast('اكتب الأستاذ أو السبب');break;}
                const rec={id:uid(),type,sid:d.sid,date:d.date,teacher,reason};
                if(type==='rpt'&&S.pend.length){rec.photos=S.pend.slice();S.pend=[];}
                db.records.push(rec);
                save();render();detModal(type,d.sid,d.date);toast(type==='rpt'?'تم تسجيل التقرير':'تم تسجيل الاستدعاء');break;}
              case 'deldet':dropRec(d.rid);save();render();detModal(d.type,d.sid,d.date);break;
              case 'shoot':{S.ptarget='';const i=$('#pcam');i.value='';i.click();break;}
              case 'gallery':{S.ptarget='';const i=$('#pgal');i.value='';i.click();break;}
              case 'unpend':S.pend=S.pend.filter(x=>x!==d.pid);photoDel(d.pid);renderPend();break;
              case 'view':photoUrl(d.pid).then(u=>{if(u)$('#viewer').innerHTML=`<div class="vw" data-act="closev"><img src="${u}" alt="" data-act="zoom"><button class="btn" data-act="closev">إغلاق</button></div>`;else toast('الصورة غير متوفرة');});break;
              case 'zoom':el.classList.toggle('big');break;
              case 'closev':$('#viewer').innerHTML='';break;
              case 'addnew':addNew();break;
              case 'rep':S.rep={type:'late',period:'',min:3,cls:''};render();window.scrollTo(0,0);break;
              case 'repback':S.rep=null;render();break;
              case 'tap':tap(d.sid);break;
              case 'hist':S.hist=true;S.hcls=S.cls;render();break;
              case 'hback':S.hist=false;render();break;
              case 'delrec':dropRec(d.rid);save();render();break;
              case 'delrec2':dropRec(d.rid);save();stuModal(d.sid);render();break;
              case 'savebad':{const note=$('#note').value.trim();const r=findRec('bad',d.sid,S.date);
                if(r) r.note=note; else db.records.push({id:uid(),type:'bad',sid:d.sid,date:S.date,note});
                save();closeM();render();break;}
              case 'unbad':{const r=findRec('bad',d.sid,S.date);if(r)db.records.splice(db.records.indexOf(r),1);save();closeM();render();break;}
              case 'addstu':formStu('');break;
              case 'editstu':formStu(d.sid);break;
              case 'savestu':saveStu(d.sid);break;
              case 'delstu':modal(`<h3>حذف ${esc(nameOf(byId(d.sid)))}؟</h3><p class="muted">سيُحذف التلميذ وكل تسجيلاته.</p><div class="acts"><button class="btn danger" data-act="delstu2" data-sid="${d.sid}">نعم، احذف</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);break;
              case 'delstu2':db.records.filter(r=>r.sid===d.sid).forEach(r=>(r.photos||[]).forEach(photoDel));db.students=db.students.filter(s=>s.id!==d.sid);db.records=db.records.filter(r=>r.sid!==d.sid);db.contacts=db.contacts.filter(x=>x.sid!==d.sid);save();closeM();render();break;
              case 'export':{const t=d.type;download(`${TYPES[t].nav}.csv`,toCSV(exportRows([t])),'text/csv;charset=utf-8');break;}
              case 'exportall':download('كل-التسجيلات.csv',toCSV(exportRows(Object.keys(TYPES))),'text/csv;charset=utf-8');closeM();break;
              case 'editcls':modal(`<h3>✏️ تعديل القسم</h3><p class="muted">${studentsOf(d.c).length} تلميذ</p>
                <label>اسم القسم</label><input id="cls_new" value="${esc(d.c)}" autocomplete="off">
                <p class="muted" style="font-size:12px">مثال: 1م1 أو 2م3 (الرقم الأول هو المستوى). إذا كتبت اسم قسم موجود، يندمج التلاميذ فيه.</p>
                <label>المستوى</label><select id="cls_lv"><option value="">تلقائي (حسب الاسم)</option>${[1,2,3,4].map(k=>`<option value="${k}"${(db.levels||{})[d.c]===k?' selected':''}>${LV[k]}</option>`).join('')}</select>
                <div class="acts"><button class="btn" data-act="savecls" data-c="${esc(d.c)}">حفظ</button><button class="btn danger" data-act="delcls" data-c="${esc(d.c)}">🗑️ حذف القسم</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);break;
              case 'savecls':{
                const nn=$('#cls_new').value.trim();
                if(!nn){toast('اكتب اسم القسم');break;}
                db.levels=db.levels||{};const lv=$('#cls_lv').value;
                if(d.c!==nn) delete db.levels[d.c];
                if(lv) db.levels[nn]=+lv; else delete db.levels[nn];
                db.students.forEach(s=>{if(s.cls===d.c)s.cls=nn;});
                if(S.lcls===d.c)S.lcls=nn;if(S.cls===d.c)S.cls=nn;
                save();closeM();render();toast('تم تعديل القسم');break;}
              case 'delcls':modal(`<h3>حذف القسم ${esc(d.c)}؟</h3><p class="muted">سيُحذف ${studentsOf(d.c).length} تلميذ وكل تسجيلاتهم.</p><div class="acts"><button class="btn danger" data-act="delcls2" data-c="${esc(d.c)}">نعم، احذف</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);break;
              case 'delcls2':{
                const ids=new Set(db.students.filter(s=>s.cls===d.c).map(s=>s.id));
                db.records.filter(r=>ids.has(r.sid)).forEach(r=>(r.photos||[]).forEach(photoDel));
                db.students=db.students.filter(s=>!ids.has(s.id));db.records=db.records.filter(r=>!ids.has(r.sid));
                if(S.lcls===d.c)S.lcls='';if(S.cls===d.c)S.cls='';
                save();closeM();render();toast('تم حذف القسم');break;}
              case 'gotodata':closeM();S.tab='data';S.hist=false;S.imp=null;S.rep=null;render();window.scrollTo(0,0);break;
              case 'bkfull':case 'bkdata':{
                toast('جاري تحضير النسخة…');
                const full=a==='bkfull';
                buildBackup(full).then(txt=>download('نسخة-احتياطية-'+todayStr()+(full?'-كاملة':'')+'.json',txt,'application/json'))
                  .then(ok=>{if(ok){try{localStorage.setItem('mjd_last_backup',new Date().toISOString());}catch(e){}render();toast('تم حفظ النسخة');}})
                  .catch(()=>toast('تعذّر تحضير النسخة'));
                break;}
              case 'rsreplace':restoreApply(false);break;
              case 'rsmerge':restoreApply(true);break;
              case 'restore':closeM();$('#rfile').value='';$('#rfile').click();break;
              case 'reset':modal(`<h3>مسح كل البيانات؟</h3><p class="muted">سيُحذف كل التلاميذ والتسجيلات نهائيا. خذ نسخة احتياطية أولا.</p><div class="acts"><button class="btn danger" data-act="reset2">نعم، امسح كل شيء</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);break;
              case 'reset2':photoClear();db=normDb({});save();S.lcls='';S.cls='';closeM();render();break;
              case 'impcancel':S.imp=null;render();break;
              case 'impgo':{
                const res=impCompute(S.imp);
                res.upd.forEach(([o,s])=>{for(const k in s){if(!['cls','last','first'].includes(k)&&!o[k]) o[k]=s[k];}});
                res.fresh.forEach(s=>db.students.push({id:uid(),...s}));
                save();S.imp=null;S.tab='lists';S.lcls='';render();window.scrollTo(0,0);
                toast('تم استيراد '+res.fresh.length+' تلميذ');break;}
              default:extraClick(a,d,el,e);
            }
          });
          document.addEventListener('change',e=>{
            const t=e.target,id=t.id;
            if(t.dataset&&t.dataset.lvc!==undefined){if(+t.value){db.levels=db.levels||{};db.levels[t.dataset.lvc]=+t.value;save();render();}}
            else if(id==='file'&&t.files[0]) onFile(t.files[0]);
            else if(id==='rfile'&&t.files[0]){const f=t.files[0];t.value='';readBackup(f);}
            else if(id==='pcam'||id==='pgal'){addPhotos([...t.files]);}
            else if(id==='n_cls'){const e=$('#n_newcls');e.hidden=t.value!=='__new';if(!e.hidden)e.focus();if(t.value!=='__new')S.ncls=t.value;}
            else if(id==='qdate'){S.qdate=t.value||todayStr();stuModal(S.msid);}
            else if(id==='r_type'){S.rep.type=t.value;render();}
            else if(id==='r_period'){S.rep.period=t.value;render();}
            else if(id==='r_min'){S.rep.min=+t.value;render();}
            else if(id==='r_cls'){S.rep.cls=t.value;render();}
            else if(id==='date'){S.date=t.value||todayStr();render();}
            else if(id==='cls'){S.cls=t.value;render();}
            else if(id==='hcls'){S.hcls=t.value;render();}
            else if(id==='isheet'){impSetSheet(t.value);render();}
            else if(id==='m_cls'){const I=S.imp,v=t.value;if(v==='sheet'||v==='fixed'||v==='combo')I.clsMode=v;else{I.clsMode='col';I.map.clsCol=+v.slice(1);}render();}
            else if(id==='m_fixed'){S.imp.fixed=t.value;render();}
            else if(id==='m_last'){S.imp.map.last=+t.value;render();}
            else if(id==='m_first'){S.imp.map.first=+t.value;render();}
            else if(id==='m_full'){S.imp.map.full=+t.value;render();}
            else extraChange(t);
          });
          document.addEventListener('input',e=>{
            const t=e.target;
            if(t.id==='pm_text'||t.id==='pm_phone') pmLinks();
            if(t.id==='q'){S.q=t.value;render();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}
            else if(t.id==='m_fixed'){S.imp.fixed=t.value;const p=$('.prev');if(p){const b=document.querySelector('[data-act=impgo]');const r=impCompute(S.imp);if(b){b.disabled=!r.fresh.length;b.textContent='✅ استيراد '+r.fresh.length+' تلميذ';}}}
          });
          /* ================= ميزات إضافية ================= */
          Object.assign(S,{rtab:'day',rdate:todayStr(),rcls:'',rmonth:todayStr().slice(0,7),ltime:'',ptarget:'',recFrom:'stu',sfile:'',alertAll:false,cmpR:'all',cmpS:'abs'});
          const SCHOOL='متوسطة المجاهد الطاهر ايت علجت';
          const FLD={father:'اسم الأب',motherLast:'لقب الأم',motherFirst:'اسم الأم',address:'العنوان',phone:'الهاتف',sex:'الجنس',birth:'تاريخ الميلاد',birthPlace:'مكان الميلاد',status:'الصفة'};
          const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
          function normDb(d){
            return {students:d.students||[],records:d.records||[],levels:d.levels||{},contacts:d.contacts||[],templates:Array.isArray(d.templates)?d.templates:DEF_TPL(),periods:d.periods||[],curP:d.curP||'',settings:Object.assign({lateMax:3,absMax:5},d.settings||{})};
          }
          function mkRec(type,sid,date){
            const r={id:uid(),type,sid,date};
            if(type==='late'){const t=S.ltime||(date===todayStr()?nowHM():'');if(t) r.time=t;}
            return r;
          }
          const motherName=s=>((s.motherLast||'')+' '+(s.motherFirst||'')).trim();

          /* ---------- الفترات الدراسية ---------- */
          const curPeriod=()=>db.periods.find(p=>p.id===db.curP)||null;
          function inP(r){const p=curPeriod();if(!p) return true;return r.date>=p.from&&(!p.to||r.date<=p.to);}
          const recsP=()=>db.records.filter(inP);
          function updHeader(){const e=$('#hsub');if(!e) return;const p=curPeriod();e.textContent=SCHOOL+(p?' · '+p.name:'');}
          function periodModal(){
            const cur=db.curP;
            modal(`<h3>📅 الفترة الدراسية</h3><p class="muted">العدادات والقوائم والتنبيهات تحسب حسب الفترة المختارة. معطيات الفترات الأخرى تبقى محفوظة وتظهر عند اختيارها.</p>
            <div class="menu"><button class="btn${cur===''?'':' ghost'}" data-act="pset" data-id="">كل المدة (بدون فلترة)</button>
            ${db.periods.map(p=>`<div class="pr"><button class="btn${cur===p.id?'':' ghost'}" data-act="pset" data-id="${p.id}">${esc(p.name)} <small>${fmtDate(p.from)} ← ${p.to?fmtDate(p.to):'مفتوح'}</small></button><button class="x" data-act="pdel" data-id="${p.id}" aria-label="حذف الفترة">✕</button></div>`).join('')}</div>
            <h3 style="margin-top:14px;font-size:15px">إضافة فترة</h3>
            <label>الاسم</label><input id="p_name" placeholder="مثال: الفصل الأول" autocomplete="off">
            <label>من</label><input id="p_from" type="date" value="${todayStr()}">
            <label>إلى (اختياري)</label><input id="p_to" type="date">
            <div class="acts"><button class="btn" data-act="padd">إضافة</button><button class="btn ghost" data-act="pnew">بدء فصل جديد من اليوم</button><button class="btn ghost" data-act="pyear">فصول السنة الدراسية</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }
          function periodAct(a,d){
            const td=todayStr();
            if(a==='pset'){db.curP=d.id;}
            else if(a==='pdel'){db.periods=db.periods.filter(p=>p.id!==d.id);if(db.curP===d.id)db.curP='';save();periodModal();render();return;}
            else if(a==='padd'){
              const name=$('#p_name').value.trim(),from=$('#p_from').value,to=$('#p_to').value;
              if(!name||!from){toast('اكتب اسم الفترة وتاريخ البداية');return;}
              if(to&&to<from){toast('تاريخ النهاية قبل البداية');return;}
              const p={id:uid(),name,from,to};db.periods.push(p);db.curP=p.id;
            }else if(a==='pnew'){
              db.periods.filter(p=>!p.to&&p.from<td).forEach(p=>{p.to=addDays(td,-1);});
              const p={id:uid(),name:'الفصل '+(db.periods.length+1),from:td,to:''};db.periods.push(p);db.curP=p.id;
            }else if(a==='pyear'){
              const n=new Date(),y=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;
              const defs=[['الفصل الأول',y+'-09-01',y+'-12-31'],['الفصل الثاني',(y+1)+'-01-01',(y+1)+'-03-31'],['الفصل الثالث',(y+1)+'-04-01',(y+1)+'-07-15']];
              defs.forEach(([name,from,to])=>{if(!db.periods.some(p=>p.name===name&&p.from===from))db.periods.push({id:uid(),name,from,to});});
              const c=db.periods.find(p=>td>=p.from&&td<=p.to);if(c)db.curP=c.id;
            }
            save();closeM();render();toast(curPeriod()?'الفترة: '+curPeriod().name:'كل المدة');
          }

          /* ---------- بيانات التلميذ الإضافية ---------- */
          const EXK=['father','motherLast','motherFirst','phone','address','sex','birth','birthPlace'];
          function extraFields(s,p){
            const o=(v,t)=>`<option value="${v}"${s.sex===v?' selected':''}>${t}</option>`;
            return `<label>اسم الأب</label><input id="${p}father" value="${esc(s.father||'')}" autocomplete="off">
            <label>لقب الأم</label><input id="${p}motherLast" value="${esc(s.motherLast||'')}" autocomplete="off">
            <label>اسم الأم</label><input id="${p}motherFirst" value="${esc(s.motherFirst||'')}" autocomplete="off">
            <label>رقم هاتف الولي</label><input id="${p}phone" type="tel" inputmode="tel" dir="ltr" value="${esc(s.phone||'')}" autocomplete="off">
            <label>العنوان (اكتب أو المس 🎤 وتكلّم)</label><div class="mrow"><input id="${p}address" value="${esc(s.address||'')}" autocomplete="off"><button type="button" class="mic" data-act="mic" data-for="${p}address" aria-label="إملاء صوتي">🎤</button></div>
            <label>الجنس</label><select id="${p}sex"><option value="">—</option>${o('ذكر','ذكر')}${o('أنثى','أنثى')}</select>
            <label>تاريخ الميلاد</label><input id="${p}birth" type="date" value="${/^\d{4}-\d\d-\d\d$/.test(s.birth||'')?s.birth:''}">
            <label>مكان الميلاد</label><input id="${p}birthPlace" value="${esc(s.birthPlace||'')}" autocomplete="off">`;
          }
          function readExtra(p){
            const o={};
            EXK.forEach(k=>{const e=$('#'+p+k);const v=e?e.value.trim():'';if(v)o[k]=v;});
            return o;
          }
          function formStu(sid){
            const s=sid?byId(sid):{last:'',first:'',cls:S.lcls||S.cls||''};
            modal(`<h3>${sid?'تعديل تلميذ':'إضافة تلميذ'}</h3>
            <label>اللقب</label><input id="f_last" value="${esc(s.last)}">
            <label>الاسم</label><input id="f_first" value="${esc(s.first)}">
            <label>القسم</label><input id="f_cls" list="dl" value="${esc(s.cls)}"><datalist id="dl">${classes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
            ${extraFields(s,'f_')}
            <div class="acts"><button class="btn" data-act="savestu" data-sid="${sid||''}">حفظ</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }
          function saveStu(sid){
            const last=$('#f_last').value.trim(),first=$('#f_first').value.trim(),cls=$('#f_cls').value.trim();
            if(!(last||first)||!cls){toast('اكتب الاسم والقسم');return;}
            const ex=readExtra('f_');
            if(sid){const s=byId(sid);Object.assign(s,{last,first,cls});EXK.forEach(k=>{if(ex[k]) s[k]=ex[k]; else delete s[k];});}
            else db.students.push({id:uid(),last,first,cls,...ex});
            save();closeM();render();toast('تم الحفظ');
          }

          /* ---------- الإملاء الصوتي ---------- */
          function micPut(el,t){el.value=(el.value?el.value+' ':'')+t;el.dispatchEvent(new Event('input',{bubbles:true}));toast('كُتب: '+t);}
          async function micFor(id){
            const el=$('#'+id);if(!el) return;
            try{
              const C=window.Capacitor;
              if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.isPluginAvailable&&C.isPluginAvailable('SpeechRecognition')){
                const SR=C.registerPlugin('SpeechRecognition');
                try{await SR.requestPermissions();}catch(e){}
                const r=await SR.start({language:'ar-DZ',maxResults:1,popup:true,prompt:'تكلّم الآن'});
                const t=r&&r.matches&&r.matches[0];
                if(t){micPut(el,t);return;}
              }else{
                const W=window.SpeechRecognition||window.webkitSpeechRecognition;
                if(W){const rc=new W();rc.lang='ar-DZ';rc.interimResults=false;rc.maxAlternatives=1;
                  rc.onresult=ev=>{const t=ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript;if(t) micPut(el,t);};
                  rc.onerror=()=>{el.focus();toast('تعذّر الإملاء. استعمل 🎤 في لوحة المفاتيح');};
                  rc.start();toast('🎤 تكلّم الآن…');return;}
              }
            }catch(e){}
            el.focus();toast('المس 🎤 في لوحة مفاتيح التليفون وتكلّم، يكتب لك ما تقول');
          }

          /* ---------- تفاصيل التسجيل: تبرير، وقت، ملاحظة، صور ---------- */
          function recCollect(rid){
            const r=db.records.find(x=>x.id===rid);if(!r) return;
            const g=id=>{const e=$('#'+id);return e?e.value.trim():null;};
            if(r.type==='abs'){const j=g('ri_just');if(j!==null){if(j) r.just=true; else delete r.just;}}
            if(r.type==='late'){const t=g('ri_time');if(t!==null){if(t) r.time=t; else delete r.time;}}
            if(r.type==='conv'||r.type==='rpt'){const a=g('ri_teacher'),b=g('ri_reason');if(a!==null) r.teacher=a;if(b!==null) r.reason=b;}
            else{const n=g('ri_note');if(n!==null){if(n) r.note=n; else delete r.note;}}
            save();
          }
          function recModal(rid){
            const r=db.records.find(x=>x.id===rid);if(!r) return;
