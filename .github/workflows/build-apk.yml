            else if(r.type==='late') t=(r.time?'⏰ '+esc(r.time):'')+(r.note?' — '+esc(r.note):'');
            else if(r.type==='conv'||r.type==='rpt') t=esc((r.teacher||'')+(r.teacher&&r.reason?' — ':'')+(r.reason||''));
