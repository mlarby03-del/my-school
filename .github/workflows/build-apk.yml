            }
            const list=Object.keys(n).filter(k=>n[k]>=R.min).sort((a,b)=>n[b]-n[a]||cmpName(byId(a),byId(b)));
            let h=`<div class="bar"><button class="btn ghost sm" data-act="repback">→ رجوع</button><b>📊 التلاميذ المتكررون</b></div>
            <div class="pad rf"><select id="r_type">${Object.keys(TYPES).map(k=>`<option value="${k}"${R.type===k?' selected':''}>${TYPES[k].nav}</option>`).join('')}</select>
            <select id="r_period"><option value=""${R.period===''?' selected':''}>كل الفترة</option><option value="7"${R.period==='7'?' selected':''}>آخر 7 أيام</option><option value="30"${R.period==='30'?' selected':''}>آخر 30 يوما</option><option value="month"${R.period==='month'?' selected':''}>هذا الشهر</option></select>
            <select id="r_min">${[1,2,3,4,5,7,10].map(k=>`<option value="${k}"${R.min===k?' selected':''}>على الأقل ${k}</option>`).join('')}</select>
            <select id="r_cls">${classOptions(R.cls,'كل الأقسام')}</select></div>
            <p class="muted pad">${list.length} تلميذ</p>`;
            h+=list.map(k=>{const s=byId(k);const ds=dates[k].sort().reverse().slice(0,5).map(fmtDate).join('، ');
              return `<button class="row" data-act="stu" data-sid="${k}"><span class="nm">${esc(nameOf(s))}<br><small class="muted">${esc(s.cls)} · ${ds}</small></span><span class="rc hot">×${n[k]}</span></button>`;}).join('');
            return h;
          }
          function formStu(sid){
            const s=sid?byId(sid):{last:'',first:'',cls:S.lcls||S.cls||''};
            modal(`<h3>${sid?'تعديل تلميذ':'إضافة تلميذ'}</h3>
