              modal(`<h3>⚠️ ${esc(nameOf(s))}</h3><p class="muted">${fmtDate(S.date)}</p><label>ملاحظة (اختياري)</label><textarea id="note" rows="3" placeholder="مثال: تشويش داخل القسم">${r?esc(r.note||''):''}</textarea>
              <div class="acts"><button class="btn" data-act="savebad" data-sid="${sid}">${r?'حفظ':'تسجيل'}</button>${r?`<button class="btn danger" data-act="unbad" data-sid="${sid}">إلغاء التسجيل</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
              return;
