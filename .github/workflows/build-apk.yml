             <div style="text-align:center;font-size:17px;font-weight:bold;margin:8px 0 4px;text-decoration:underline">التقرير الشهري لمستشار التربية</div>
             <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>شهر : <b>${mn}</b></span><span>عدد أيام الدراسة: <b>${d.days}</b></span></div>
             <h4>1- غيابات وتأخرات التلاميذ حسب الأقسام</h4>
             <table><tr><th rowspan="2" style="width:56px">القسم</th><th rowspan="2" style="width:38px">التعداد</th><th colspan="5">الغيابات</th><th colspan="2">التأخرات</th><th rowspan="2" style="width:36px">العاشرة</th><th rowspan="2" style="width:38px">المرحاض</th><th rowspan="2" style="width:34px">الساحة</th><th rowspan="2" style="width:34px">الهروب</th></tr>
             <tr><th style="width:36px">تلاميذ</th><th style="width:34px">أيام</th><th style="width:34px">مبررة</th><th style="width:40px">غ.مبررة</th><th style="width:38px">نسبة %</th><th style="width:34px">عدد</th><th style="width:34px">مبررة</th></tr>${tb}</table>
             <p style="font-size:10px;margin:3px 0">نسبة الغياب = أيام الغياب ÷ (التعداد × أيام الدراسة).</p>
            </div>
            <div class="pg blk">
             <div style="display:flex;gap:12px"><div style="flex:1"><h4 style="margin-top:0">2- أكثر التلاميذ غيابا</h4>${top(d.topA,o=>o.abs)}</div><div style="flex:1"><h4 style="margin-top:0">3- أكثر التلاميذ تأخرا (+ العاشرة)</h4>${top(d.topL,o=>o.late+o.late10)}</div></div>
             <h4>4- غيابات الأساتذة (دروس لم تقدم)</h4>${tch}
             <p style="font-size:12px;margin:4px 0">حصص التعويض المسجلة: <b>${d.subs}</b> · غيابات الأساتذة المسجلة في الطاقم — ${ev(d.tev)}</p>
             <h4>5- غيابات وتأخرات المشرفين التربويين</h4><p style="font-size:12px;margin:4px 0">${ev(d.sev)}</p>
             <h4>6- الحالات الصحية الخاصة المسجلة: <b>${d.health}</b> · طلبات التلاميذ هذا الشهر: <b>${d.reqs}</b></h4>
             <h4>7- الإجراءات المتخذة</h4>${bx(60,R.act)}
             <h4>8- ملاحظات مستشار التربية</h4>${bx(70,R.cons)}
             <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:12px;position:absolute;left:32px;right:32px;bottom:60px"><span>إمضاء مستشار التربية:</span><span>إمضاء الناظر:</span><span>إمضاء المدير:</span></div>
            </div></div>`;
          }
          function viewMm(){
            const ym=S.mmonth,d=mmData(ym),R=mmR(ym);
            const mk=(id,l,v)=>`<label>${l}</label><textarea id="${id}" rows="3">${esc(v||'')}</textarea>`;
            return `<div class="bar"><input type="month" id="mm_m" value="${ym}"><label style="margin:0">أيام الدراسة</label><input type="number" id="mm_days" inputmode="numeric" value="${d.days}" style="max-width:70px"></div>
            <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="mmpdf">📄 حفظ PDF</button></div>
            <p class="hint">يُملأ تلقائيا من كل ما سجلته في الشهر. عدّل عدد أيام الدراسة (بعد خصم العطل) فتُحسب النسب عليه.</p>
            <div class="sum"><span>غياب <b>${d.T.ad}</b> يوم · تأخرات <b>${d.T.late}</b> · نسبة الغياب <b>${f2(d.T.rate)}%</b> · أساتذة غائبون <b>${d.tch.length}</b></span></div>
            <div style="padding:0 12px">${mk('mm_act','7- الإجراءات المتخذة',R.act)}${mk('mm_cons','8- ملاحظات مستشار التربية',R.cons)}</div>
            <h3 class="d">معاينة</h3><div style="overflow:auto;padding:0 6px"><div style="zoom:.46;border:1px solid var(--line,#8884)">${mmDoc(ym)}</div></div>`;
          }
          const _vk12=viewKash;
          viewKash=function(){
            const mm=S.rtab==='mm';
            if(mm) S.rtab='day';
            let h=_vk12();
            if(mm) S.rtab='mm';
            h=h.replace(/^(<div class="seg">.*?)<\/div>/s,(m,a)=>{if(mm) a=a.replace(/ class="on"/g,' class=""');return a+`<button class="${mm?'on':''}" data-act="rtab" data-v="mm">📅 تقرير شهري</button></div>`;});
            if(!mm) return h;
            return h.match(/^<div class="seg">.*?<\/div>/s)[0]+viewMm();
          };
          const _ec13=extraClick;
          extraClick=function(a,d,el,e){
            if(a==='mmpdf'){const ym=S.mmonth;toast('جاري إنشاء PDF…');htmlToPdf(mmDoc(ym)).then(b=>download('التقرير-الشهري-'+ym+'.pdf',b,'application/pdf')).then(ok=>{if(ok) toast('تم إنشاء الملف');}).catch(()=>toast('تعذّر إنشاء PDF'));return;}
            _ec13(a,d,el,e);
          };
          const _ecg13=extraChange;
          extraChange=function(t){
            const id=t.id;
            if(id==='mm_m'){S.mmonth=t.value||todayStr().slice(0,7);render();return;}
            if(id==='mm_days'){mmR(S.mmonth).days=t.value;save();render();return;}
            if(id==='mm_act'||id==='mm_cons'){mmR(S.mmonth)[id.slice(3)]=t.value;save();render();return;}
            _ecg13(t);
          };

          render();

          </script>
          </body>
          </html>
          EOF_HTML

      - name: Install
        run: |
          npm install
          npm install @capacitor-community/speech-recognition@^6.0.0 || echo "speech plugin skipped"

      - name: Add Android
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

