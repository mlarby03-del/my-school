            (L.length?L.map((o,i)=>`<button class="row" data-act="stu" data-sid="${o.s.id}"><span class="no">${i+1}</span><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)}${o.j?' · '+o.j+' غياب مبرر':''}</small></span><span class="rc ${o.abs>=5?'hot':''}">🚫${o.abs}</span><span class="rc ${o.late>=3?'hot':''}">⏰${o.late}</span></button>`).join(''):'<p class="muted pad">لا توجد تسجيلات في هذا الشهر</p>');
          }
          async function copyText(t){
            try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true;}}catch(e){}
            const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();
            let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();return ok;
          }

          /* ---------- ملف Excel (xlsx) ---------- */
          const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
          function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
          function concatU8(chunks){let n=0;chunks.forEach(c=>n+=c.length);const o=new Uint8Array(n);let p=0;chunks.forEach(c=>{o.set(c,p);p+=c.length;});return o;}
          function zipStore(files){
            const enc=new TextEncoder(),chunks=[],cen=[],now=new Date();
            const time=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),date=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
            let off=0;
            files.forEach(f=>{
              const name=enc.encode(f.name),data=f.data,crc=crc32(data);
              const lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);
              v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(10,time,true);v.setUint16(12,date,true);
              v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);lh.set(name,30);
              chunks.push(lh,data);
              const ch=new Uint8Array(46+name.length),w=new DataView(ch.buffer);
              w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint16(12,time,true);w.setUint16(14,date,true);
              w.setUint32(16,crc,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,off,true);ch.set(name,46);
              cen.push(ch);off+=lh.length+data.length;
            });
            let cs=0;cen.forEach(c=>{chunks.push(c);cs+=c.length;});
            const e=new Uint8Array(22),x=new DataView(e.buffer);
            x.setUint32(0,0x06054b50,true);x.setUint16(8,files.length,true);x.setUint16(10,files.length,true);x.setUint32(12,cs,true);x.setUint32(16,off,true);chunks.push(e);
            return concatU8(chunks);
          }
          const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
          const xe=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          function makeXlsx(sheets){
            const enc=new TextEncoder(),F=(n,s)=>({name:n,data:enc.encode(s)});
            const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
            const files=[
              F('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'),
              F('_rels/.rels',H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
              F('xl/workbook.xml',H+`<workbook xmlns="${NS}" xmlns:r="${R}"><sheets>`+sheets.map((s,i)=>`<sheet name="${xe(String(s.name).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'),
              F('xl/_rels/workbook.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`),
              F('xl/styles.xml',H+`<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`)
            ];
            sheets.forEach((s,i)=>{
              const w=Math.max(1,...s.rows.map(r=>r.length));
              let x=H+`<worksheet xmlns="${NS}"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols><col min="1" max="${w}" width="20" customWidth="1"/></cols><sheetData>`;
              s.rows.forEach((r,ri)=>{
                x+=`<row r="${ri+1}">`;
                r.forEach((v,ci)=>{
                  if(v===''||v==null) return;
                  const ref=colL(ci)+(ri+1),st=ri===0?' s="1"':'';
                  x+=typeof v==='number'?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
