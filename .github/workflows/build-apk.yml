              case 'sfile':closeM();S.sfile=d.sid;render();window.scrollTo(0,0);break;
              case 'sfileback':S.sfile='';render();break;
              case 'sfilepdf':filePdf();break;
              case 'recinfo':S.recFrom=d.from||'stu';recModal(d.rid);break;
              case 'recsave':{recCollect(d.rid);const r=db.records.find(x=>x.id===d.rid);closeM();render();if(S.recFrom==='stu'&&r) stuModal(r.sid);break;}
              case 'recdel':{const r=db.records.find(x=>x.id===d.rid),sid=r&&r.sid;dropRec(d.rid);save();closeM();render();if(S.recFrom==='stu'&&sid) stuModal(sid);break;}
              case 'recshoot':{recCollect(d.rid);S.ptarget=d.rid;const i=$('#pcam');i.value='';i.click();break;}
              case 'recgallery':{recCollect(d.rid);S.ptarget=d.rid;const i=$('#pgal');i.value='';i.click();break;}
              case 'recphotodel':{recCollect(d.rid);const r=db.records.find(x=>x.id===d.rid);if(r){r.photos=(r.photos||[]).filter(x=>x!==d.pid);if(!r.photos.length) delete r.photos;photoDel(d.pid);save();}recModal(d.rid);break;}
              case 'period':periodModal();break;
              case 'pset':case 'pdel':case 'padd':case 'pnew':case 'pyear':periodAct(a,d);break;
              case 'alertall':S.alertAll=!S.alertAll;render();break;
              case 'alertcfg':alertCfg();break;
              case 'alertsave':{db.settings.lateMax=Math.max(1,+$('#a_late').value||3);db.settings.absMax=Math.max(1,+$('#a_abs').value||5);save();closeM();render();break;}
              case 'rtab':S.rtab=d.v;render();break;
              case 'rcopy':copyText(dailyText(S.rdate,S.rcls)).then(ok=>toast(ok?'تم نسخ الكشف':'تعذّر النسخ'));break;
              case 'rwa':shareText(dailyText(S.rdate,S.rcls));break;
              case 'rxlsx':download('كشف-يوم-'+S.rdate+'.xlsx',makeXlsx([{name:'كشف اليوم',rows:dailyRows(S.rdate,S.rcls)}]),XLSX_MIME);break;
              case 'ccopy':copyText(cmpText()).then(ok=>toast(ok?'تم نسخ المقارنة':'تعذّر النسخ'));break;
              case 'cwa':shareText(cmpText());break;
              case 'cxlsx':download('مقارنة-الأقسام-'+todayStr()+'.xlsx',makeXlsx([{name:'مقارنة الأقسام',rows:cmpRows()}]),XLSX_MIME);break;
              case 'listlocal':listLocal();break;
              case 'openlocal':openLocal(d.name);break;
              case 'bklocal':saveLocal(true);break;
              case 'bklocal2':saveLocal(false);break;
              case 'bkwa':shareBackup(true);break;
              case 'bkwa2':shareBackup(false);break;
              case 'contacts':contactsModal(d.sid);break;
              case 'cadd':{const n=$('#cx_note').value.trim();logContact(d.sid,$('#cx_how').value,n);contactsModal(d.sid);toast('تم التسجيل');break;}
              case 'cdel':db.contacts=db.contacts.filter(x=>x.id!==d.id);save();contactsModal(d.sid);break;
              case 'tpl':tplModal(d.back);break;
              case 'tpladd':tplCollect();db.templates.push({id:uid(),name:'قالب جديد',text:'السلام عليكم، '});save();tplModal(d.back);break;
              case 'tpldel':tplCollect();db.templates.splice(+d.i,1);save();tplModal(d.back);break;
              case 'tplsave':tplCollect();toast('تم الحفظ');tplDone(d.back);break;
              case 'tplreset':db.templates=DEF_TPL();save();tplModal(d.back);break;
              case 'yearopen':yearModal();break;
              case 'yearGo':yearGo();break;
              case 'mxlsx':download('كشف-شهر-'+S.rmonth+'.xlsx',makeXlsx([{name:'كشف الشهر',rows:monthRows(S.rmonth,S.rcls)}]),XLSX_MIME);break;
            }
          }
          function extraChange(t){
            const id=t.id;
            if(id==='ltime') S.ltime=t.value;
            else if(id==='pm_phone'){const s=byId(t.dataset.sid);if(s){s.phone=t.value.trim();if(!s.phone) delete s.phone;save();}pmLinks();}
            else if(id==='pm_tpl'){const s=byId(t.dataset.sid),tp=db.templates[+t.value];if(s&&tp){$('#pm_text').value=fillTpl(tp.text,s);pmLinks();}}
            else if(id==='pm_why'){const s=byId(t.dataset.sid);if(s){$('#pm_text').value=parentMsg(s,t.value);pmLinks();}}
            else if(id==='c_r'){S.cmpR=t.value;render();}
            else if(id==='c_s'){S.cmpS=t.value;render();}
            else if(id==='r_shift'){S.rshift=t.value;render();}
            else if(id==='r_date'){S.rdate=t.value||todayStr();render();}
            else if(id==='r_cls2'){S.rcls=t.value;render();}
            else if(id==='r_month'){S.rmonth=t.value||todayStr().slice(0,7);render();}
          }

          /* ================= الفترات، صور اليوم، الأساتذة، التوقيت ================= */
          const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
          const JSDAY=d=>['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d];
          function rowState(type,r){
            const s=rowState0(type,r);
            return s+((type==='late'||type==='abs')&&r?' · '+(r.shift==='ص'?'صباحا':r.shift==='م'?'مساء':type==='abs'?'يوم كامل':''):'');
          }
          function shiftBar(){
            const o=(v,t)=>`<option value="${v}"${S.shift===v?' selected':''}>${t}</option>`,ab=S.tab==='abs';
            return `<div class="bar"><label style="margin:0;white-space:nowrap">الفترة</label><select id="shiftsel">${o('auto',ab?'يوم كامل':'تلقائي (حسب الساعة)')}${o('ص','صباحية')}${o('م','مسائية')}</select></div><p class="hint" style="margin-top:0">${ab?'اختر الفترة ثم المس التلميذ: يوم كامل أو صباحا فقط أو مساء فقط.':'تأخر صباحي ومسائي لنفس التلميذ: سجّله مرتين، مرة بكل فترة.'}</p>`;
          }
          /* صور اليوم (مثلا ورقة التأخرات) */
          const dpics=(type,date)=>db.dayPics.filter(x=>x.type===type&&x.date===date);
          function dayPicBar(type,date,all){
            if(all) return '';
            const n=dpics(type,date).length;
            return `<div class="bar" style="padding-top:0"><button class="btn ghost sm" data-act="daypics" data-type="${type}" data-date="${date}">📷 صور ${TYPES[type].nav} هذا اليوم${n?' ('+n+')':''}</button></div>`;
          }
          function dayPicsModal(type,date){
            const L=dpics(type,date);
            modal(`<h3>📷 ${TYPES[type].nav} — ${fmtDate(date)}</h3><p class="muted">صوّر ورقة القائمة أو الدفتر لهذا اليوم، وتبقى محفوظة مع التاريخ.</p>
            <div class="thumbs">${L.map(x=>`<span class="th"><img data-pid="${x.pid}" data-act="view" alt=""><button class="x" data-act="daypicdel" data-id="${x.id}" data-type="${type}" data-date="${date}" aria-label="حذف">✕</button></span>`).join('')||'<span class="muted">لا توجد صور</span>'}</div>
            <div class="ph"><button class="btn sm" data-act="ptgt" data-t="D:${type}|${date}" data-src="cam">📷 تصوير</button><button class="btn ghost sm" data-act="ptgt" data-t="D:${type}|${date}" data-src="gal">🖼️ من المعرض</button></div>
            <div class="acts"><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            hydrate();
          }
          /* هدف الصور */
          function pTarget(t,pid){
            if(!t) return false;
            if(t[1]===':'){
              const k=t[0],v=t.slice(2);
              if(k==='T'){const x=db.teachers.find(y=>y.id===v);if(x){(x.photos=x.photos||[]).push(pid);save();return true;}}
              else if(k==='C'){(db.timetables[v]=db.timetables[v]||[]).push(pid);save();return true;}
              else if(k==='D'){const [ty,dt]=v.split('|');db.dayPics.push({id:uid(),type:ty,date:dt,pid});save();return true;}
              else if(k==='J'){const j=db.justs.find(y=>y.id===v);if(j){(j.photos=j.photos||[]).push(pid);save();return true;}}
              return false;
            }
            const r=db.records.find(x=>x.id===t);if(r){(r.photos=r.photos||[]).push(pid);save();return true;}
            return false;
          }
          function pAfter(t){
            if(t[1]===':'){
              const k=t[0],v=t.slice(2);
              if(k==='T'){teacherModal(v);render();}
              else if(k==='C'){render();}
              else if(k==='J'){justModal(v);render();}
              else if(k==='D'){const [ty,dt]=v.split('|');dayPicsModal(ty,dt);render();}
            }else{recModal(t);render();}
          }
          const allPhotoIds=()=>new Set([...db.records.flatMap(r=>r.photos||[]),...db.dayPics.map(x=>x.pid),...db.teachers.flatMap(t=>t.photos||[]),...db.justs.flatMap(j=>j.photos||[]),...Object.values(db.timetables).flat()]);
          function mergeExtra(d){
            const have=new Set(db.teachers.map(t=>t.id));
            (d.teachers||[]).forEach(t=>{if(!have.has(t.id)) db.teachers.push(t);});
            Object.keys(d.timetables||{}).forEach(c=>{const cur=db.timetables[c]||[];db.timetables[c]=[...new Set([...cur,...d.timetables[c]])];});
            {const ht=new Set(db.tabs.map(s=>s.id));(d.tabs||[]).forEach(s=>{if(!ht.has(s.id)) db.tabs.push(s);});Object.keys(d.reps||{}).forEach(k=>{if(!db.reps[k]) db.reps[k]=d.reps[k];});Object.keys(d.absSince||{}).forEach(k=>{if(!db.absSince[k]) db.absSince[k]=d.absSince[k];});}
            {const hh=new Set(db.health.map(s=>s.id));(d.health||[]).forEach(s=>{if(!hh.has(s.id)) db.health.push(s);});}
            {const hd=new Set(db.decisions.map(s=>s.id));(d.decisions||[]).forEach(s=>{if(!hd.has(s.id)) db.decisions.push(s);});}
            {const hj=new Set(db.justs.map(s=>s.id));(d.justs||[]).forEach(s=>{if(!hj.has(s.id)) db.justs.push(s);});}
            {const hs=new Set(db.subs.map(s=>s.id));(d.subs||[]).forEach(s=>{if(!hs.has(s.id)) db.subs.push(s);});}
            if(!db.sched.length) db.sched=d.sched||[];if(!db.slots.length) db.slots=d.slots||[];
            const hp=new Set(db.dayPics.map(x=>x.id));
            (d.dayPics||[]).forEach(x=>{if(!hp.has(x.id)) db.dayPics.push(x);});
          }
          /* ---------- الأساتذة ---------- */
          const rcpt=t=>t.rday?(t.rday+(t.rfrom?' '+t.rfrom+(t.rto?'–'+t.rto:''):'')):(t.reception||'');
          function viewTeachers(){
            const q=norm(S.tq||''),td=JSDAY(new Date().getDay());
            let L=db.teachers.filter(t=>!q||norm(t.name+' '+(t.subject||'')).includes(q)).sort((a,b)=>(b.rday===td)-(a.rday===td)||a.name.localeCompare(b.name,'ar'));
            const today=db.teachers.filter(t=>t.rday===td);
            return `<div class="title">🧑‍🏫 الأساتذة</div>
            <div class="bar"><input id="tq" placeholder="🔍 ابحث بالاسم أو المادة" value="${esc(S.tq||'')}"><button class="btn sm" data-act="tnew">➕ أستاذ</button></div>
            ${today.length?`<div class="alerts"><div class="ah"><b>🕒 يستقبلون اليوم (${td})</b></div>${today.map(t=>`<button class="row" data-act="tedit" data-id="${t.id}"><span class="nm">${esc(t.name)}<br><small class="muted">${esc(t.subject||'')}</small></span><span class="rc">${esc(rcpt(t))}</span></button>`).join('')}</div>`:''}
            ${L.length?L.map(t=>`<button class="row" data-act="tedit" data-id="${t.id}"><span class="nm">${esc(t.name)}<br><small class="muted">${esc(t.subject||'—')}${rcpt(t)?' · 🕒 '+esc(rcpt(t)):''}</small></span>${t.photos&&t.photos.length?`<span class="rc">🗓️${t.photos.length}</span>`:''}</button>`).join(''):`<div class="empty"><div class="big">🧑‍🏫</div><p>لم تضف أي أستاذ بعد.</p><button class="btn" data-act="tnew">➕ إضافة أستاذ</button></div>`}`;
          }
          function teacherModal(id){
            const t=id?db.teachers.find(x=>x.id===id):{};
            const o=(v)=>`<option value="${v}"${t.rday===v?' selected':''}>${v||'—'}</option>`;
            modal(`<h3>${id?'🧑‍🏫 '+esc(t.name):'➕ أستاذ جديد'}</h3>
            <label>الاسم الكامل</label><input id="t_name" value="${esc(t.name||'')}" autocomplete="off">
            <label>المادة</label><input id="t_subject" value="${esc(t.subject||'')}" autocomplete="off">
            <label>رقم الهاتف (اختياري)</label><input id="t_phone" type="tel" dir="ltr" value="${esc(t.phone||'')}">
            <label>ساعة الاستقبال — اليوم</label><select id="t_rday">${['',...DAYS].map(o).join('')}</select>
            <div style="display:flex;gap:8px"><div style="flex:1"><label>من</label><input type="time" id="t_rfrom" value="${esc(t.rfrom||'')}"></div><div style="flex:1"><label>إلى</label><input type="time" id="t_rto" value="${esc(t.rto||'')}"></div></div>
            <label>ملاحظة</label><textarea id="t_note" rows="2">${esc(t.note||'')}</textarea>
            <label>الساعات المعوَّضة سابقا (قبل استعمال التطبيق)</label><input id="t_prevSubs" type="number" min="0" inputmode="numeric" value="${t.prevSubs||''}">
            ${id?tSubsInfo(id):''}
            ${id?`<button class="btn ghost sm" data-act="tgrid" data-id="${id}" style="margin-top:10px">🗓️ جدول التوقيت (إدخال يدوي)</button><label>جدول توقيت الأستاذ (صور)</label>
            <div class="thumbs">${(t.photos||[]).map(p=>`<span class="th"><img data-pid="${p}" data-act="view" alt=""><button class="x" data-act="tphdel" data-id="${id}" data-pid="${p}" aria-label="حذف">✕</button></span>`).join('')||'<span class="muted">لا توجد صور</span>'}</div>
            <div class="ph"><button class="btn sm" data-act="ptgt" data-t="T:${id}" data-src="cam">📷 تصوير</button><button class="btn ghost sm" data-act="ptgt" data-t="T:${id}" data-src="gal">🖼️ من المعرض</button></div>`:'<p class="muted">احفظ الأستاذ أولا لتضيف صورة جدول توقيته.</p>'}
            <div class="acts"><button class="btn" data-act="tsave" data-id="${id||''}">حفظ</button>${t.phone?`<a class="btn ghost" href="tel:${esc(t.phone)}">📞</a>`:''}${id?`<button class="btn danger" data-act="tdel" data-id="${id}">🗑️</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            hydrate();
          }
          function teacherSave(id){
            const v=k=>$('#t_'+k).value.trim(),name=v('name');
            if(!name){toast('اكتب اسم الأستاذ');return null;}
            const o={name,subject:v('subject'),phone:v('phone'),rday:v('rday'),rfrom:v('rfrom'),rto:v('rto'),note:v('note'),prevSubs:Math.max(0,+v('prevSubs')||0)};
            Object.keys(o).forEach(k=>{if(!o[k]) delete o[k];});
            if(id){const t=db.teachers.find(x=>x.id===id);const ph=t.photos;for(const k of ['subject','phone','rday','rfrom','rto','note','prevSubs']) delete t[k];Object.assign(t,o);if(ph) t.photos=ph;}
            else{id=uid();db.teachers.push({id,...o});}
            save();return id;
          }
          /* ---------- جداول توقيت التلاميذ ---------- */
          function viewTTPhotos(){
            const cl=classes();
            if(!cl.length) return `<div class="title">🗓️ جداول توقيت التلاميذ</div>`+emptyState();
            const c=S.ttcls,n=cl.reduce((k,x)=>k+((db.timetables[x]||[]).length?1:0),0);
            let h=`<div class="title">🗓️ جداول توقيت التلاميذ</div><div class="bar"><select id="ttcls">${classOptions(c,'اختر القسم')}</select></div>`;
            if(!c) return h+`<p class="hint">صوّر جدول توقيت كل قسم وتبقى محفوظة مرتبة. ${n} قسم من ${cl.length} عنده جدول.</p>`+cl.map(x=>`<button class="row" data-act="ttpick" data-c="${esc(x)}"><span class="nm">${esc(x)}</span><span class="rc ${(db.timetables[x]||[]).length?'':'hot'}">${(db.timetables[x]||[]).length?'🗓️ '+db.timetables[x].length:'بدون جدول'}</span></button>`).join('');
            const L=db.timetables[c]||[];
            return h+`<div class="pad"><div class="thumbs" style="gap:10px">${L.map(p=>`<span class="th"><img data-pid="${p}" data-act="view" alt="" style="width:120px;height:120px"><button class="x" data-act="ttdel" data-c="${esc(c)}" data-pid="${p}" aria-label="حذف">✕</button></span>`).join('')||'<span class="muted">لا يوجد جدول لهذا القسم بعد</span>'}</div>
            <div class="ph"><button class="btn" data-act="ptgt" data-t="C:${esc(c)}" data-src="cam">📷 تصوير الجدول</button><button class="btn ghost" data-act="ptgt" data-t="C:${esc(c)}" data-src="gal">🖼️ من المعرض</button></div><p class="muted">المس الصورة لتكبيرها.</p></div>`;
          }
          /* ---------- ربط ---------- */
          const _ec=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'daypics':dayPicsModal(d.type,d.date);return;
              case 'daypicdel':{const x=db.dayPics.find(y=>y.id===d.id);if(x){photoDel(x.pid);db.dayPics=db.dayPics.filter(y=>y.id!==d.id);save();}dayPicsModal(d.type,d.date);render();return;}
              case 'ptgt':{S.ptarget=d.t;const i=$(d.src==='cam'?'#pcam':'#pgal');i.value='';i.click();return;}
              case 'tnew':teacherModal('');return;
              case 'tedit':teacherModal(d.id);return;
              case 'tsave':{const id=teacherSave(d.id);if(id){closeM();render();toast('تم الحفظ');}return;}
              case 'tdel':modal(`<h3>حذف الأستاذ؟</h3><div class="acts"><button class="btn danger" data-act="tdel2" data-id="${d.id}">حذف</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);return;
              case 'tdel2':{const t=db.teachers.find(x=>x.id===d.id);if(t)(t.photos||[]).forEach(p=>photoDel(p));db.teachers=db.teachers.filter(x=>x.id!==d.id);save();closeM();render();return;}
              case 'tphdel':{const t=db.teachers.find(x=>x.id===d.id);if(t){t.photos=(t.photos||[]).filter(p=>p!==d.pid);if(!t.photos.length) delete t.photos;photoDel(d.pid);save();}teacherModal(d.id);render();return;}
              case 'ttpick':S.ttcls=d.c;render();return;
              case 'ttdel':{db.timetables[d.c]=(db.timetables[d.c]||[]).filter(p=>p!==d.pid);photoDel(d.pid);save();render();return;}
            }
            _ec(a,d,el,e);
          };
          const _ecg=extraChange;
          extraChange=function(t){
            if(t.id==='shiftsel'){S.shift=t.value;return;}
            if(t.id==='ttcls'){S.ttcls=t.value;render();return;}
            _ecg(t);
          };
          document.addEventListener('input',ev=>{if(ev.target.id==='tq'){S.tq=ev.target.value;const p=ev.target.selectionStart;render();const n=$('#tq');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(x){}}}});

          function tSubsInfo(id){
            const L=db.subs.filter(s=>s.sub===id).sort((a,b)=>b.date.localeCompare(a.date)),t=db.teachers.find(x=>x.id===id)||{},ym=todayStr().slice(0,7);
            const m=L.filter(s=>s.date.slice(0,7)===ym).length,off=db.subs.filter(s=>s.abs===id).length;
            return `<div class="prev" style="margin-top:8px"><b>📒 التعويضات المسجلة في التطبيق</b>
            <p class="muted" style="margin:4px 0">عوّض ${L.length} ساعة (هذا الشهر ${m}) · الإجمالي مع السابق: <b>${(+t.prevSubs||0)+L.length}</b> · عُوِّضت عنه ${off} ساعة</p>
            ${L.slice(0,8).map(s=>`<div class="row hr" style="padding:5px 2px"><span class="sub">${fmtDate(s.date)}</span><span class="nm" dir="ltr" style="text-align:right">${esc(s.slot)}</span><span class="st" style="color:var(--tx);font-weight:400">${esc(s.cls||'')}${s.did?' · '+esc(s.did):''}</span></div>`).join('')||'<span class="muted">لا توجد بعد</span>'}${L.length>8?'<span class="muted">… والمزيد في «📒 السجل»</span>':''}</div>`;
          }

          /* ================= جداول التوقيت اليدوية + استيراد Excel ================= */
          const DEF_SLOTS=['08:00–09:00','09:00–10:00','10:00–11:00','11:00–12:00','13:00–14:00','14:00–15:00','15:00–16:00','16:00–17:00'];
          const TDAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','السبت'];
          const slotsOf=()=>(db.slots&&db.slots.length?db.slots:DEF_SLOTS);
          const showSat=()=>db.settings.sat||db.sched.some(x=>x.day==='السبت');
          const daysShown=()=>TDAYS.filter(d=>d!=='السبت'||showSat());
          S.ttmode=S.ttmode||'c';S.ttt=S.ttt||'';
          const tName=id=>{const t=db.teachers.find(x=>x.id===id);return t?t.name:'';};
          function gridHtml(list,mode){
            const dy=daysShown(),sl=slotsOf();
            const at=(d,s)=>list.filter(x=>x.day===d&&x.slot===s);
            return `<div class="tgw"><table class="tg"><tr><th></th>${dy.map(d=>`<th>${d}</th>`).join('')}</tr>${sl.map((s,i)=>`<tr><td class="sl" dir="ltr">${esc(s)}</td>${dy.map(d=>{const c=at(d,s);return c.length?`<td class="fill" data-act="tcell" data-day="${d}" data-i="${i}">${c.map(x=>mode==='c'?`<b>${esc(x.subject||'')}</b><small>${esc(tName(x.tid)||x.tname||'')}</small>`:`<b>${esc(x.cls)}</b><small>${esc(x.subject||'')}</small>`).join('<hr style="margin:2px">')}</td>`:`<td class="emp" data-act="tcell" data-day="${d}" data-i="${i}">＋</td>`;}).join('')}</tr>`).join('')}</table></div>`;
          }
          function viewTT(){
            const m=S.ttmode,cl=classes();
            const seg=`<div class="seg"><button class="${m==='c'?'on':''}" data-act="ttmode" data-v="c">القسم</button><button class="${m==='t'?'on':''}" data-act="ttmode" data-v="t">الأستاذ</button><button class="${m==='s'?'on':''}" data-act="ttmode" data-v="s">🔄 تعويض</button><button class="${m==='l'?'on':''}" data-act="ttmode" data-v="l">📒 السجل</button><button class="${m==='p'?'on':''}" data-act="ttmode" data-v="p">الصور</button></div>`;
            const tools=`<div class="acts" style="padding:8px 12px 0;margin:0"><button class="btn sm ghost" data-act="ttimp">📥 استيراد جداول الأساتذة (Excel)</button><button class="btn sm ghost" data-act="ttslots">⚙️ الحصص</button></div>`;
            if(m==='p') return seg+viewTTPhotos();
            if(m==='s') return seg+viewSub();
            if(m==='l') return seg+viewSubLog();
            if(m==='c'){
              if(!cl.length) return seg+emptyState();
              const c=S.ttcls,n=db.sched.filter(x=>x.cls===c).length;
              return seg+`<div class="bar"><select id="ttcls">${classOptions(c,'اختر القسم')}</select></div>${tools}`+(c?`<p class="hint">المس أي خانة لإضافة أو تعديل حصة (${n} حصة مسجلة).</p>`+gridHtml(db.sched.filter(x=>x.cls===c),'c'):'<p class="hint">اختر القسم لعرض جدول توقيته أو إدخاله.</p>');
            }
            if(!db.teachers.length) return seg+`<div class="empty"><div class="big">🧑‍🏫</div><p>أضف الأساتذة أولا من تبويب «الأساتذة»، أو استورد جداولهم من Excel وتُنشأ أسماؤهم تلقائيا.</p><button class="btn" data-act="ttimp">📥 استيراد من Excel</button></div>`;
            const tid=S.ttt,n=db.sched.filter(x=>x.tid===tid).length;
            return seg+`<div class="bar"><select id="ttt"><option value="">اختر الأستاذ</option>${db.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(t=>`<option value="${t.id}"${t.id===tid?' selected':''}>${esc(t.name)}${t.subject?' — '+esc(t.subject):''}</option>`).join('')}</select></div>${tools}`+(tid?`<p class="hint">المس أي خانة لإضافة أو تعديل حصة (${n} حصة أسبوعيا).</p>`+gridHtml(db.sched.filter(x=>x.tid===tid),'t'):'<p class="hint">اختر الأستاذ لعرض جدول توقيته.</p>');
          }
          function cellModal(day,i){
            const slot=slotsOf()[i],m=S.ttmode;
            if(m==='c'){
              const c=S.ttcls,e=db.sched.find(x=>x.cls===c&&x.day===day&&x.slot===slot)||{};
              modal(`<h3>🗓️ ${esc(c)} — ${day}</h3><p class="muted">${esc(slot)}</p>
              <label>المادة</label><input id="g_subj" value="${esc(e.subject||'')}" autocomplete="off">
              <label>الأستاذ</label><select id="g_tid"><option value="">—</option>${db.teachers.map(t=>`<option value="${t.id}"${t.id===e.tid?' selected':''}>${esc(t.name)}${t.subject?' — '+esc(t.subject):''}</option>`).join('')}</select>
              <div class="acts"><button class="btn" data-act="gsave" data-day="${day}" data-i="${i}">حفظ</button>${e.id?`<button class="btn danger" data-act="gdel" data-id="${e.id}">🗑️ حذف الحصة</button>`:''}<button class="btn ghost" data-act="closem">إلغاء</button></div>`);
            }else{
              if(!S.ttt){toast('اختر الأستاذ أولا');return;}
              const e=db.sched.find(x=>x.tid===S.ttt&&x.day===day&&x.slot===slot)||{},t=db.teachers.find(x=>x.id===S.ttt)||{};
              modal(`<h3>🗓️ ${esc(t.name||'')} — ${day}</h3><p class="muted">${esc(slot)}</p>
              <label>القسم</label><select id="g_cls"><option value="">—</option>${classes().map(c=>`<option value="${esc(c)}"${c===e.cls?' selected':''}>${esc(c)}</option>`).join('')}</select>
              <label>المادة</label><input id="g_subj" value="${esc(e.subject||t.subject||'')}" autocomplete="off">
              <div class="acts"><button class="btn" data-act="gsave" data-day="${day}" data-i="${i}">حفظ</button>${e.id?`<button class="btn danger" data-act="gdel" data-id="${e.id}">🗑️ حذف الحصة</button>`:''}<button class="btn ghost" data-act="closem">إلغاء</button></div>`);
            }
          }
          function cellSave(day,i){
            const slot=slotsOf()[i],m=S.ttmode,subject=$('#g_subj').value.trim();
            let cls,tid;
            if(m==='c'){cls=S.ttcls;tid=$('#g_tid').value;}else{tid=S.ttt;cls=$('#g_cls').value;}
            db.sched=db.sched.filter(x=>!(m==='c'?(x.cls===cls&&x.day===day&&x.slot===slot):(x.tid===tid&&x.day===day&&x.slot===slot)));
            if(!cls||(!subject&&!tid)){save();closeM();render();return;}
            const clash=tid&&db.sched.find(x=>x.tid===tid&&x.day===day&&x.slot===slot&&x.cls!==cls);
            if(m==='t') db.sched=db.sched.filter(x=>!(x.cls===cls&&x.day===day&&x.slot===slot));
            db.sched.push({id:uid(),day,slot,cls,tid,subject});
            save();closeM();render();
            toast(clash?'⚠️ تنبيه: عند الأستاذ حصة أخرى في '+clash.cls+' في نفس الوقت':'تم الحفظ');
          }
          function slotsModal(){
            modal(`<h3>⚙️ الحصص وأيام الجدول</h3><p class="muted">اكتب كل حصة في سطر (مثال: 08:00–09:00). تغيير الأسماء لا يحذف الحصص القديمة المسجلة تحت اسم آخر.</p>
            <textarea id="sl_txt" rows="9" dir="ltr">${esc(slotsOf().join('\n'))}</textarea>
            <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="sl_sat" style="width:auto;margin:0"${db.settings.sat?' checked':''}> إظهار يوم السبت</label>
            <div class="acts"><button class="btn" data-act="slsave">حفظ</button><button class="btn ghost" data-act="slreset">الافتراضي</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }
          /* ---------- قراءة جداول الأساتذة من Excel ---------- */
          const AD=s=>String(s).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
          const DAYMAP=[[/^(ال)?احد$|^sun|^dim/,'الأحد'],[/^(ال)?(ا)?ثنين$|^(ال)?اثنين$|^mon|^lun/,'الاثنين'],[/^(ال)?ثلاثاء$|^tue|^mar/,'الثلاثاء'],[/^(ال)?اربعاء$|^wed|^mer/,'الأربعاء'],[/^(ال)?خميس$|^thu|^jeu/,'الخميس'],[/^(ال)?جمعة$|^fri|^ven/,'الجمعة'],[/^(ال)?سبت$|^sat|^sam/,'السبت']];
          function dayOf(s){
            const n=norm(AD(s||'')).replace(/\s+/g,'');if(!n||n.length>12) return '';
            for(const [re,d] of DAYMAP) if(re.test(n)) return d;return '';
          }
          function clsIn(s){
            const out=[];AD(s||'').replace(/(\d)\s*(?:م|am|AM|Am)\s*[-_ ]?\s*(\d{1,2})/g,(x,l,g)=>{out.push(l+'م'+g);return x;});
            return out;
          }
          function slotNorm(s){
            s=AD(String(s||'')).trim();if(!s) return '';
            const m=s.match(/(\d{1,2})\s*[:hH.]\s*(\d{2})?\s*[-–—ـ/إلى to]+\s*(\d{1,2})\s*[:hH.]\s*(\d{2})?/);
            if(m){const p=n=>String(n).padStart(2,'0');return p(m[1])+':'+(m[2]||'00')+'–'+p(m[3])+':'+(m[4]||'00');}
            return s.replace(/\s+/g,' ');
          }
          const GENERIC=/^(sheet|feuil|ورقة|page)\s*\d*$/i;
          function ttParseSheet(sh){
            const rows=sh.rows.map(r=>(r||[]).map(x=>x==null?'':String(x).trim()));
            const W=Math.max(0,...rows.map(r=>r.length));
            const out=[];
            /* 1) صيغة قائمة: أستاذ / يوم / حصة / قسم */
            for(let hi=0;hi<Math.min(rows.length,12);hi++){
              const h=rows[hi].map(c=>norm(c));
              const col=re=>h.findIndex(c=>c&&re.test(c));
              const ct=col(/استاذ|معلم|teacher|prof/),cd=col(/يوم|^day|jour/),cs=col(/حصه|ساعه|توقيت|وقت|hour|heure|time|creneau|slot/),cc=col(/قسم|فوج|class/),cm=col(/ماده|subject|matiere/);
              if(ct>=0&&cd>=0&&cs>=0&&cc>=0){
                for(let i=hi+1;i<rows.length;i++){
                  const r=rows[i],day=dayOf(r[cd]),slot=slotNorm(r[cs]),cl=clsIn(r[cc]);
                  if(!r[ct]||!day||!slot) continue;
                  (cl.length?cl:[]).forEach(c=>out.push({teacher:r[ct],day,slot,cls:c,subject:cm>=0?r[cm]:''}));
                }
                return out;
              }
            }
            /* 2) صيغة شبكة: أيام × حصص */
            let tr=false,hr=-1,dayCols=[];
            const find=(M)=>{for(let i=0;i<Math.min(M.length,30);i++){const cs=[];M[i].forEach((c,j)=>{const d=dayOf(c);if(d) cs.push([j,d]);});if(cs.length>=3) return [i,cs];}return null;};
            let M=rows,f=find(M);
            if(!f){
              const T=[];for(let j=0;j<W;j++){T.push(rows.map(r=>r[j]||''));}
              const f2=find(T);if(f2){M=T;f=f2;tr=true;}
            }
            if(!f) return out;
            [hr,dayCols]=f;
            const c0=Math.max(0,Math.min(...dayCols.map(x=>x[0]))-1);
            let teacher='';
            for(let i=0;i<hr&&!teacher;i++) for(const c of M[i]){const m=/(?:ال)?[أا]ستاذ(?:ة)?\s*[:：\-]?\s*(.+)|prof(?:esseur)?\.?\s*[:：]?\s*(.+)/i.exec(c||'');if(m&&(m[1]||m[2])){teacher=(m[1]||m[2]).trim();break;}}
            if(!teacher&&!GENERIC.test(sh.name||'')) teacher=sh.name;
            for(let i=hr+1;i<M.length;i++){
              const slot=slotNorm(M[i][c0]);if(!slot) continue;
              dayCols.forEach(([j,d])=>{
                const cell=M[i][j];if(!cell) return;
                const cl=clsIn(cell);if(!cl.length) return;
                const subj=cell.replace(/(\d)\s*(?:م|am)\s*[-_ ]?\s*(\d{1,2})/gi,'').replace(/[\/\n,،;+\-]+/g,' ').trim();
                cl.forEach(c=>out.push({teacher,day:d,slot,cls:c,subject:subj}));
              });
            }
            return out;
          }
          let TTI=null;
          async function onTTFile(f){
            try{
              let sheets;
              if(/\.(csv|txt)$/i.test(f.name)) sheets=[{name:f.name,rows:parseCSV(await f.text())}];
              else sheets=await readXlsx(await f.arrayBuffer());
              let all=[];const warn=[];
              sheets.forEach(sh=>{const r=ttParseSheet(sh);if(r.length) all=all.concat(r);});
              const noT=all.filter(x=>!x.teacher).length;all=all.filter(x=>x.teacher);
              if(!all.length){modal(`<h3>لم أجد جداول</h3><p class="muted">لم أتعرف على الأعمدة. الصيغتان المدعومتان:<br>١) قائمة بأعمدة: الأستاذ · المادة · اليوم · الحصة · القسم<br>٢) شبكة لكل أستاذ (ورقة باسمه أو سطر «الأستاذ: …»): الأيام في الأعلى والحصص على الجانب، وفي الخانات أسماء الأقسام (مثل 2م1).</p><div class="acts"><button class="btn" data-act="ttsample">⬇️ نموذج Excel جاهز</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);return;}
              const by={};all.forEach(x=>{(by[norm(x.teacher)]=by[norm(x.teacher)]||{name:x.teacher,n:0}).n++;});
              const cl=new Set(classes()),unk=[...new Set(all.map(x=>x.cls).filter(c=>!cl.has(c)))];
              TTI={all};
              const known=db.teachers.map(t=>norm(t.name));
              modal(`<h3>📥 جداول الأساتذة</h3><p class="muted">وجدت <b>${all.length}</b> حصة لـ <b>${Object.keys(by).length}</b> أستاذ.${noT?` (${noT} خانة بلا اسم أستاذ تُجاهلت)`:''}</p>
              <div class="chips">${Object.values(by).map(o=>`<span>${esc(o.name)} · ${o.n}${known.includes(norm(o.name))?'':' 🆕'}</span>`).join('')}</div>
              ${unk.length?`<p class="warn">أقسام غير موجودة عندك: ${unk.map(esc).join('، ')} — تُستورد كما هي.</p>`:''}
              <p class="muted">🆕 = أستاذ جديد يُضاف تلقائيا. جدول كل أستاذ موجود في الملف يُستبدل بالكامل.</p>
              <div class="acts"><button class="btn" data-act="ttgo">استيراد</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
            }catch(e){toast('تعذّرت قراءة الملف');}
          }
          function ttImport(){
            if(!TTI) return;
            const ids={};
            TTI.all.forEach(x=>{
              const k=norm(x.teacher);
              if(!ids[k]){let t=db.teachers.find(y=>norm(y.name)===k);if(!t){t={id:uid(),name:x.teacher};db.teachers.push(t);}ids[k]=t.id;}
            });
            const set=new Set(Object.values(ids));
            db.sched=db.sched.filter(x=>!set.has(x.tid));
            const seen=new Set(),sl=slotsOf().slice();
            TTI.all.forEach(x=>{
              const tid=ids[norm(x.teacher)],key=[tid,x.day,x.slot,x.cls].join('|');if(seen.has(key)) return;seen.add(key);
              if(!sl.includes(x.slot)) sl.push(x.slot);
              db.sched.push({id:uid(),day:x.day,slot:x.slot,cls:x.cls,tid,subject:x.subject||''});
            });
            const timeKey=s=>/^\d\d:\d\d/.test(s)?'0'+s:'1'+s;
            const nu=sl.filter(s=>!slotsOf().includes(s));
            db.slots=slotsOf().concat(nu.sort((a,b)=>timeKey(a).localeCompare(timeKey(b))));
            if(db.sched.some(x=>x.day==='السبت')) db.settings.sat=true;
            const n=TTI.all.length;TTI=null;save();closeM();S.ttmode='t';S.ttt=Object.values(ids)[0];render();toast('تم استيراد '+n+' حصة');
          }
          function ttSample(){
            const rows=[['الأستاذ','المادة','اليوم','الحصة','القسم'],['أ. كمال','رياضيات','الأحد','08:00–09:00','1م1'],['أ. كمال','رياضيات','الأحد','09:00–10:00','1م2'],['أ. سميرة','عربية','الاثنين','10:00–11:00','2م1']];
            download('نموذج-جداول-الأساتذة.xlsx',makeXlsx([{name:'جداول الأساتذة',rows}]),XLSX_MIME);
          }
          /* ---------- ربط ---------- */
          const _ec3=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'ttmode':S.ttmode=d.v;render();return;
              case 'tgrid':closeM();S.tab='tt';S.ttmode='t';S.ttt=d.id;render();window.scrollTo(0,0);return;
              case 'tcell':cellModal(d.day,+d.i);return;
              case 'gsave':cellSave(d.day,+d.i);return;
              case 'gdel':db.sched=db.sched.filter(x=>x.id!==d.id);save();closeM();render();return;
              case 'ttslots':slotsModal();return;
              case 'slsave':{const L=$('#sl_txt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(L.length) db.slots=[...new Set(L)];db.settings.sat=$('#sl_sat').checked;save();closeM();render();return;}
              case 'slreset':db.slots=[];save();slotsModal();render();return;
              case 'ttimp':{const i=$('#tfile');i.value='';i.click();return;}
              case 'ttgo':ttImport();return;
              case 'ttsample':ttSample();return;
            }
            _ec3(a,d,el,e);
          };
          const _ecg3=extraChange;
          extraChange=function(t){
            if(t.id==='tfile'){const f=t.files[0];t.value='';if(f) onTTFile(f);return;}
            if(t.id==='ttt'){S.ttt=t.value;render();return;}
            _ecg3(t);
          };

          /* ================= البحث عن أستاذ متاح لتعويض غائب ================= */
          Object.assign(S,{sdate:todayStr(),stid:'',sslot:'',snear:true});
          const nearF=C=>S.snear?C.filter(c=>c.prev||c.next):C;
          const dayName=d=>{const n=JSDAY(new Date(d+'T12:00:00').getDay());return n;};
          function busyAt(day,slot){return db.sched.filter(x=>x.day===day&&x.slot===slot);}
          function subCount(tid,ym){return db.subs.filter(s=>s.sub===tid&&s.date.slice(0,7)===ym).length;}
          function subTotal(t){return (+t.prevSubs||0)+db.subs.filter(s=>s.sub===t.id).length;}
          function candidates(day,idx,exclude,subject,key){
            const sl=slotsOf(),slot=sl[idx],busy=new Set(busyAt(day,slot).map(x=>x.tid));
            const prev=idx>0?new Set(busyAt(day,sl[idx-1]).map(x=>x.tid)):new Set(),next=idx<sl.length-1?new Set(busyAt(day,sl[idx+1]).map(x=>x.tid)):new Set();
            const today=new Set(db.sched.filter(x=>x.day===day).map(x=>x.tid)),ym=S.sdate.slice(0,7);
            return db.teachers.filter(t=>t.id!==exclude&&!busy.has(t.id)).map(t=>{const n=subCount(t.id,ym),mx=+db.settings.subMax||0,taken=mx>0&&n>=mx,other=db.subs.some(s=>s.date===S.sdate&&s.slot===slot&&s.sub===t.id&&s.key!==key);return {t,prev:prev.has(t.id),next:next.has(t.id),today:today.has(t.id),same:!!(subject&&t.subject&&norm(t.subject)===norm(subject)),n,tot:subTotal(t),taken,other,out:taken||other};})
              .sort((a,b)=>(a.out-b.out)||((b.prev||b.next)-(a.prev||a.next))||(b.today-a.today)||(b.same-a.same)||(a.n-b.n)||(a.tot-b.tot)||a.t.name.localeCompare(b.t.name,'ar'));
          }
          const isTD=x=>/(^|[^a-z])td([^a-z]|$)|اعمال موجهة|أعمال موجهة/i.test(x.subject||'');
          function tdPartners(x,day,tid){
            return busyAt(day,x.slot).filter(p=>levelOf(p.cls)!==4&&p.tid!==tid&&p.id!==x.id&&(p.cls===x.cls||((isTD(x)||isTD(p))&&db.sched.some(y=>y.tid===p.tid&&y.cls===x.cls&&!(y.day===day&&y.slot===x.slot)))));
          }
          function tdRow(p,x,key){
            const asg=db.subs.find(s=>s.key===key&&s.sub===p.tid),same=p.cls===x.cls,q=same?null:busyAt(dayName(S.sdate),x.slot).find(y=>levelOf(y.cls)!==4&&y.tid!==p.tid&&y.tid!==x.tid&&y.id!==x.id&&(isTD(y)||isTD(x)));
            return `<div class="row" style="min-height:0;padding:8px 6px"><span class="nm">🤝 ${esc(tName(p.tid))}<br><small class="muted">${same?'معه في نفس القسم (يبقى ويستقبل الفوجين)':'في هذه الحصة مع '+esc(p.cls)+' ← ينتقل إلى '+esc(x.cls)+(q?' · ويجمع '+esc(tName(q.tid))+' الفوجين':'')}${(same?'':' · يدرّس '+esc(x.cls)+' في حصص أخرى ✔')}</small></span><button class="btn sm${asg?'':' ghost'}" data-act="subset" data-key="${esc(key)}" data-sub="${p.tid}">${asg?'✅ معيَّن':'تعيين'}</button></div>`;
          }
          function candRow(c,key){
            const asg=db.subs.find(s=>s.key===key&&s.sub===c.t.id);
            const tag=[c.prev&&c.next?'عمل الحصة قبلها وبعدها':c.prev?'عمل الحصة السابقة':c.next?'يعمل الحصة الموالية':c.today?'حاضر اليوم (حصة أبعد)':'لا يعمل اليوم'];
            const why=c.other?' · ⛔ معيَّن في قسم آخر في هذه الحصة':c.taken?' · ⛔ أخذ نصيبه هذا الشهر':'';
            return `<div class="row" style="min-height:0;padding:8px 6px${c.out?';opacity:.55;text-decoration:line-through':''}"><span class="nm">${c.same?'⭐ ':''}${esc(c.t.name)}<br><small class="muted">${esc(c.t.subject||'')}${c.t.subject?' · ':''}${tag} · هذا الشهر ${c.n} ساعة · الإجمالي ${c.tot}${why}</small></span>${c.t.phone?`<a class="btn ghost sm" href="tel:${esc(c.t.phone)}">📞</a>`:''}<button class="btn sm${asg?'':' ghost'}" data-act="subset" data-key="${esc(key)}" data-sub="${c.t.id}">${asg?'✅ معيَّن':'تعيين'}</button></div>`;
          }
          function viewSub(){
            const day=dayName(S.sdate),sl=slotsOf(),ok=TDAYS.includes(day);
            const sel0=`<div class="bar"><input type="date" id="s_date" value="${S.sdate}"><span class="muted" style="white-space:nowrap">${day}</span></div>
            <div class="bar"><select id="s_tid"><option value="">— الأستاذ الغائب (اختياري) —</option>${db.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(t=>`<option value="${t.id}"${t.id===S.stid?' selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
            <div class="bar"><select id="s_slot"><option value="">${S.stid?'كل حصصه في هذا اليوم':'— اختر الحصة —'}</option>${sl.map((s,i)=>`<option value="${i}"${String(i)===S.sslot?' selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
            const near=`<div class="seg" style="padding-top:0"><button class="${S.snear?'on':''}" data-act="snear" data-v="1">⏱️ القريبة فقط (قبل/بعد)</button><button class="${S.snear?'':'on'}" data-act="snear" data-v="0">الكل</button></div>`;
            const quota=`<div class="bar"><label style="margin:0;white-space:nowrap">نصيب الأستاذ الشهري (ساعات)</label><input type="number" min="0" inputmode="numeric" id="s_max" value="${db.settings.subMax||''}" placeholder="بدون حد" style="max-width:110px"></div>`;
            const note=`<p class="hint">اختر اليوم والأستاذ الغائب لتظهر حصصه والأساتذة المتاحين لتعويضه (الأولوية لمن عمل الحصة قبلها أو بعدها)، أو اختر حصة فقط لترى كل المتاحين فيها.</p>`;
            const sel=sel0+near+quota;
            if(!db.sched.length) return sel+`<div class="empty"><div class="big">🗓️</div><p>لا توجد جداول توقيت بعد. أدخلها أو استوردها من Excel أولا.</p></div>`;
            if(!ok) return sel+`<p class="warn" style="margin:10px 12px">${day} — لا دراسة في هذا اليوم.</p>`;
            const cards=[];
            if(S.stid){
              let mine=db.sched.filter(x=>x.tid===S.stid&&x.day===day).sort((a,b)=>sl.indexOf(a.slot)-sl.indexOf(b.slot));
              if(S.sslot!=='') mine=mine.filter(x=>x.slot===sl[+S.sslot]);
              if(!mine.length) cards.push(`<p class="muted pad">لا توجد حصص لهذا الأستاذ ${S.sslot!==''?'في هذه الحصة':'يوم '+day}.</p>`);
              mine.forEach(x=>{
                const idx=sl.indexOf(x.slot),key=S.sdate+'|'+x.slot+'|'+x.cls,C=candidates(day,idx<0?0:idx,S.stid,x.subject||(db.teachers.find(t=>t.id===S.stid)||{}).subject,key).filter(c=>db.sched.some(y=>y.tid===c.t.id&&y.cls===x.cls)),done=db.subs.find(s=>s.key===key&&s.cls&&s.abs===S.stid);
                if(done){cards.push(`<div class="prev" style="margin:10px 12px;background:var(--grn)"><span style="text-decoration:line-through;opacity:.7"><b dir="ltr" style="display:inline-block">${esc(x.slot)}</b> — <b>${esc(x.cls)}</b> ${x.subject?'· '+esc(x.subject):''}</span><div style="margin-top:6px">✅ تم تعويضه: <b>${esc(tName(done.sub))}</b> <button class="btn ghost sm" data-act="subset" data-key="${esc(key)}" data-sub="${done.sub}">↩️ إلغاء</button></div></div>`);return;}
                cards.push(`<div class="prev" style="margin:10px 12px"><b dir="ltr" style="display:inline-block">${esc(x.slot)}</b> — <b>${esc(x.cls)}</b> ${x.subject?'· '+esc(x.subject):''}
                ${(()=>{const P=tdPartners(x,day,S.stid);return P.length?`<div class="hint" style="margin:6px 0 0">🤝 من نفس الحصة: يدرّس نفس القسم الآن (TD)، أو ينتقل إليه لأنه يدرّسه في حصص أخرى</div>`+P.map(p=>tdRow(p,x,key)).join(''):'';})()}
                <div style="margin-top:6px">${nearF(C).length?nearF(C).map(c=>candRow(c,key)).join(''):'<p class="muted">لا أحد من أساتذة القسم القريبين متاح'+(S.snear&&C.length?' — اضغط «الكل» لرؤية البقية':'')+'.</p>'}</div></div>`);
              });
            }else if(S.sslot!==''){
              const idx=+S.sslot,C=candidates(day,idx,'','',S.sdate+'|'+sl[idx]+'|');
              cards.push(`<div class="prev" style="margin:10px 12px"><b>المتاحون في ${esc(sl[idx])} — ${day}</b> (${nearF(C).length})<div style="margin-top:6px">${nearF(C).map(c=>candRow(c,S.sdate+'|'+sl[idx]+'|')).join('')||'<p class="muted">لا أحد متاح.</p>'}</div></div>`);
            }else return sel+note;
            const todaySubs=db.subs.filter(s=>s.date===S.sdate);
            return sel+cards.join('')+(todaySubs.length?`<div class="acts" style="padding:0 12px"><button class="btn sm" data-act="subshare">📤 إرسال قائمة تعويضات ${fmtDate(S.sdate)} (${todaySubs.length})</button></div>`:'');
          }
          function subsText(){
            const L=db.subs.filter(s=>s.date===S.sdate).sort((a,b)=>slotsOf().indexOf(a.slot)-slotsOf().indexOf(b.slot));
            let t=`تعويضات يوم ${dayName(S.sdate)} ${fmtDate(S.sdate)}\n${SCHOOL}\n\n`;
            L.forEach(s=>{t+=`• ${s.slot}${s.cls?' — '+s.cls:''}: يعوّض الأستاذ ${tName(s.sub)} الأستاذ ${tName(s.abs)}\n`;});
            return t.trim();
          }
          const _ec4=extraClick;
          extraClick=function(a,d,el,e){
            if(a==='subset'){
              const [date,slot,cls]=d.key.split('|'),ex=db.subs.find(s=>s.key===d.key&&s.sub===d.sub);
              if(ex) db.subs=db.subs.filter(s=>s!==ex);
              else{db.subs=db.subs.filter(s=>!(s.key===d.key&&s.cls));db.subs.push({id:uid(),key:d.key,date,slot,cls,abs:S.stid,sub:d.sub});}
              save();render();return;
            }
            if(a==='subshare'){shareText(subsText());return;}
            _ec4(a,d,el,e);
          };
          const _ecg4=extraChange;
          extraChange=function(t){
            if(t.id==='s_max'){db.settings.subMax=Math.max(0,+t.value||0);save();render();return;}
            if(t.id==='s_date'){S.sdate=t.value||todayStr();render();return;}
            if(t.id==='s_tid'){S.stid=t.value;render();return;}
            if(t.id==='s_slot'){S.sslot=t.value;render();return;}
            _ecg4(t);
          };

          /* ================= تبريرات الغياب + سجل التعويضات ================= */
          Object.assign(S,{jq:'',jcls:'',slm:todayStr().slice(0,7)});
          const JKINDS=['شهادة طبية','تبرير من الولي','ظرف عائلي','وفاة','ظرف قاهر','أخرى'];
          function viewJus(){
            if(!db.students.length) return emptyState();
            const q=norm(S.jq||'');
            const L=db.justs.filter(j=>{const s=byId(j.sid);return s&&(!S.jcls||s.cls===S.jcls)&&(!q||norm(nameOf(s)).includes(q));}).sort((a,b)=>b.from.localeCompare(a.from));
            const med=db.justs.filter(j=>j.kind==='شهادة طبية').length;
            return `<div class="title">🩺 تبريرات الغياب</div>
            <div class="bar"><input id="jq" placeholder="🔍 ابحث عن تلميذ" value="${esc(S.jq||'')}"><button class="btn sm" data-act="jnew" data-sid="">➕ تبرير</button></div>
            <div class="bar"><select id="jcls">${classOptions(S.jcls,'كل الأقسام')}</select><span class="muted">${L.length} تبرير · ${med} شهادة طبية</span></div>`+
            (L.length?L.map(j=>{const s=byId(j.sid);return `<button class="row" data-act="jedit" data-id="${j.id}"><span class="nm">${esc(nameOf(s))}<br><small class="muted">${esc(s.cls)} · ${fmtDate(j.from)}${j.to&&j.to!==j.from?' ← '+fmtDate(j.to):''}${j.note?' · '+esc(j.note.slice(0,40)):''}</small></span><span class="rc">${esc(j.kind||'')}${j.photos&&j.photos.length?' 📷'+j.photos.length:''}</span></button>`;}).join(''):'<p class="muted pad">لا توجد تبريرات مسجلة. المس «➕ تبرير» لإضافة شهادة طبية أو تبرير ولي مع صورتها.</p>');
          }
          function jOpts(q){
            const n=norm(q||'');
            return db.students.filter(s=>!n||norm(nameOf(s)+' '+s.cls).includes(n)).slice(0,40).map(s=>`<option value="${s.id}">${esc(nameOf(s))} — ${esc(s.cls)}</option>`).join('');
          }
          function justModal(id,sid0){
            const j=id?db.justs.find(x=>x.id===id):{from:todayStr(),to:'',kind:'شهادة طبية',note:''};
            if(id&&!j) return;
            const sid=id?j.sid:(sid0||''),s=sid?byId(sid):null,td=todayStr();
            const un=s?db.records.filter(r=>r.type==='abs'&&r.sid===sid&&!r.just).length:0;
            modal(`<h3>🩺 ${id?'تبرير غياب':'تبرير جديد'}</h3>
            ${s?`<p class="muted"><b>${esc(nameOf(s))}</b> · ${esc(s.cls)} · غيابات غير مبررة: ${un}</p><input type="hidden" id="j_sid" value="${sid}">`:
            `<label>التلميذ</label><input id="j_q" placeholder="🔍 اكتب جزءا من الاسم" autocomplete="off"><select id="j_sid" size="5">${jOpts('')}</select>`}
            <label>من تاريخ</label><input type="date" id="j_from" value="${esc(j.from||td)}">
            <label>إلى تاريخ (اتركه فارغا لليوم نفسه)</label><input type="date" id="j_to" value="${esc(j.to||'')}">
            <label>نوع التبرير</label><select id="j_kind">${JKINDS.map(k=>`<option${k===j.kind?' selected':''}>${k}</option>`).join('')}</select>
            <label>ملاحظة (مثال: طبيب … 3 أيام راحة)</label><div class="mrow"><textarea id="j_note" rows="2">${esc(j.note||'')}</textarea><button type="button" class="mic" data-act="mic" data-for="j_note" aria-label="إملاء صوتي">🎤</button></div>
            ${id?`<label>صورة الشهادة / الوثيقة</label><div class="thumbs">${(j.photos||[]).map(p=>`<span class="th"><img data-pid="${p}" data-act="view" alt=""><button class="x" data-act="jphdel" data-id="${id}" data-pid="${p}" aria-label="حذف">✕</button></span>`).join('')||'<span class="muted">لا توجد صور</span>'}</div>
            <div class="ph"><button class="btn sm" data-act="ptgt" data-t="J:${id}" data-src="cam">📷 تصوير</button><button class="btn ghost sm" data-act="ptgt" data-t="J:${id}" data-src="gal">🖼️ من المعرض</button></div>`:'<p class="muted">احفظ التبرير أولا ثم أضف صورة الشهادة.</p>'}
            <p class="muted" style="font-size:12px">عند الحفظ تُعلَّم غيابات التلميذ في هذه الفترة «مبررة» تلقائيا.</p>
            <div class="acts"><button class="btn" data-act="jsave" data-id="${id||''}">حفظ</button>${id?`<button class="btn danger" data-act="jdel" data-id="${id}">🗑️</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            hydrate();
          }
          function jApply(j){
            db.records.forEach(r=>{if(r.jid===j.id){delete r.jid;delete r.just;}});
            let n=0;const to=j.to||j.from;
            db.records.forEach(r=>{if(r.type==='abs'&&r.sid===j.sid&&r.date>=j.from&&r.date<=to&&!r.just){r.just=true;r.jid=j.id;n++;}});
            return n;
          }
          function justSave(id){
            const sid=$('#j_sid').value,from=$('#j_from').value,to=$('#j_to').value;
            if(!sid){toast('اختر التلميذ');return;}
            if(!from){toast('حدد تاريخ البداية');return;}
            if(to&&to<from){toast('تاريخ النهاية قبل البداية');return;}
            const o={sid,from,to:to||'',kind:$('#j_kind').value,note:$('#j_note').value.trim()};
            let j;
            if(id){j=db.justs.find(x=>x.id===id);Object.assign(j,o);}
            else{j={id:uid(),...o};db.justs.push(j);}
            const n=jApply(j);save();render();
            toast(n?`تم تبرير ${n} غياب`:'تم الحفظ (لا غياب مسجل في هذه الفترة)');
            justModal(j.id);
          }
          /* ---------- سجل التعويضات ---------- */
          const subsOf=ym=>db.subs.filter(s=>s.date.slice(0,7)===ym).sort((a,b)=>b.date.localeCompare(a.date)||slotsOf().indexOf(a.slot)-slotsOf().indexOf(b.slot));
          function viewSubLog(){
            const L=subsOf(S.slm),by={};
            L.forEach(s=>{by[s.sub]=(by[s.sub]||0)+1;});
            let h=`<div class="bar"><input type="month" id="sl_m" value="${S.slm}"><button class="btn sm" data-act="slnew">➕ تسجيل تعويض</button></div>
            <div class="sum"><span>${L.length} حصة معوَّضة هذا الشهر</span><button class="btn sm ghost" data-act="slxlsx">⬇️ Excel</button></div>
            ${Object.keys(by).length?`<div class="chips" style="padding:0 12px">${Object.keys(by).sort((a,b)=>by[b]-by[a]).map(t=>`<span>${esc(tName(t)||'—')} · ${by[t]} ساعة</span>`).join('')}</div>`:''}`;
            if(!L.length) return h+'<p class="muted pad">لا توجد تعويضات مسجلة هذا الشهر. تُسجَّل تلقائيا عند الضغط على «تعيين» في تبويب التعويض، أو أضفها يدويا.</p>';
            let last='';
            L.forEach(s=>{
              if(s.date!==last){h+=`<h3 class="d">${dayName(s.date)} ${fmtDate(s.date)}</h3>`;last=s.date;}
              h+=`<button class="row" data-act="sledit" data-id="${s.id}"><span class="nm"><b dir="ltr" style="display:inline-block">${esc(s.slot)}</b> · ${esc(s.cls||'—')}<br><small class="muted">${esc(tName(s.sub)||'—')} ← عن ${esc(tName(s.abs)||'—')}${s.did?' · '+esc(s.did):''}${s.note?' · 📝 '+esc(s.note.slice(0,40)):''}</small></span></button>`;
            });
            return h;
          }
          function subModal(id){
            const s=id?db.subs.find(x=>x.id===id):{date:S.sdate||todayStr(),slot:'',cls:'',abs:'',sub:'',did:'',note:''};
            const tOpt=v=>`<option value="">—</option>`+db.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(t=>`<option value="${t.id}"${t.id===v?' selected':''}>${esc(t.name)}</option>`).join('');
            modal(`<h3>📒 ${id?'تعويض':'تسجيل تعويض'}</h3>
            <label>التاريخ</label><input type="date" id="l_date" value="${esc(s.date)}">
            <label>الحصة (الساعة)</label><select id="l_slot">${slotsOf().map(x=>`<option${x===s.slot?' selected':''}>${esc(x)}</option>`).join('')}</select>
            <label>القسم</label><select id="l_cls"><option value="">—</option>${classes().map(c=>`<option${c===s.cls?' selected':''}>${esc(c)}</option>`).join('')}</select>
            <label>الأستاذ الغائب</label><select id="l_abs">${tOpt(s.abs)}</select>
            <label>الأستاذ المعوِّض</label><select id="l_sub">${tOpt(s.sub)}</select>
            <label>ماذا عوّض؟ (المادة / النشاط)</label><div class="mrow"><input id="l_did" value="${esc(s.did||'')}" placeholder="مثال: حل تمارين الرياضيات" autocomplete="off"><button type="button" class="mic" data-act="mic" data-for="l_did" aria-label="إملاء صوتي">🎤</button></div>
            <label>ملاحظة</label><div class="mrow"><textarea id="l_note" rows="3">${esc(s.note||'')}</textarea><button type="button" class="mic" data-act="mic" data-for="l_note" aria-label="إملاء صوتي">🎤</button></div>
            <div class="acts"><button class="btn" data-act="slsave2" data-id="${id||''}">حفظ</button>${id?`<button class="btn danger" data-act="sldel" data-id="${id}">🗑️</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }
          function subSave(id){
            const v=k=>$('#l_'+k).value.trim(),date=v('date'),slot=v('slot');
            if(!date||!slot||!$('#l_sub').value){toast('حدد التاريخ والحصة والأستاذ المعوِّض');return;}
            const o={date,slot,cls:v('cls'),abs:v('abs'),sub:v('sub'),did:v('did'),note:v('note')};
            o.key=date+'|'+slot+'|'+o.cls;
            if(id) Object.assign(db.subs.find(x=>x.id===id),o); else db.subs.push({id:uid(),...o});
            S.slm=date.slice(0,7);save();closeM();render();toast('تم الحفظ');
          }
          function subRows(ym){
            const rows=[['التاريخ','اليوم','الحصة','القسم','الأستاذ الغائب','الأستاذ المعوِّض','ماذا عوّض','ملاحظة']];
            subsOf(ym).slice().reverse().forEach(s=>rows.push([fmtDate(s.date),dayName(s.date),s.slot,s.cls||'',tName(s.abs),tName(s.sub),s.did||'',s.note||'']));
            return rows;
          }
          /* ---------- ربط ---------- */
          const _ec5=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'jnew':justModal('',d.sid||'');return;
              case 'jedit':justModal(d.id);return;
              case 'jsave':justSave(d.id);return;
              case 'jdel':modal(`<h3>حذف التبرير؟</h3><p class="muted">تعود الغيابات المرتبطة به «غير مبررة».</p><div class="acts"><button class="btn danger" data-act="jdel2" data-id="${d.id}">حذف</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);return;
              case 'jdel2':{const j=db.justs.find(x=>x.id===d.id);if(j){(j.photos||[]).forEach(p=>photoDel(p));db.records.forEach(r=>{if(r.jid===j.id){delete r.jid;delete r.just;}});db.justs=db.justs.filter(x=>x.id!==d.id);save();}closeM();render();return;}
              case 'jphdel':{const j=db.justs.find(x=>x.id===d.id);if(j){j.photos=(j.photos||[]).filter(p=>p!==d.pid);if(!j.photos.length) delete j.photos;photoDel(d.pid);save();}justModal(d.id);render();return;}
              case 'slnew':subModal('');return;
              case 'sledit':subModal(d.id);return;
              case 'slsave2':subSave(d.id);return;
              case 'sldel':db.subs=db.subs.filter(x=>x.id!==d.id);save();closeM();render();return;
              case 'slxlsx':download('سجل-التعويضات-'+S.slm+'.xlsx',makeXlsx([{name:'التعويضات',rows:subRows(S.slm)}]),XLSX_MIME);return;
            }
            _ec5(a,d,el,e);
          };
          const _ecg5=extraChange;
          extraChange=function(t){
            if(t.id==='jcls'){S.jcls=t.value;render();return;}
            if(t.id==='sl_m'){S.slm=t.value||todayStr().slice(0,7);render();return;}
            _ecg5(t);
          };
          document.addEventListener('input',ev=>{
            const t=ev.target;
            if(t.id==='jq'){S.jq=t.value;const p=t.selectionStart;render();const n=$('#jq');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(x){}}}
            else if(t.id==='j_q'){const s=$('#j_sid');if(s) s.innerHTML=jOpts(t.value);}
          });

          /* ================= سجل التأخرات بالفترات + القرارات + تقرير الأساتذة ================= */
          Object.assign(S,{hshift:'',hview:'rows',tview:'list',tm:todayStr().slice(0,7)});
          const decOf=(sid,type)=>db.decisions.filter(x=>x.sid===sid&&x.type===type).sort((a,b)=>b.date.localeCompare(a.date)||0);
          const decDate=(sid,type)=>{const L=decOf(sid,type);return L.length?L[0].date:'';};
          const effShift=r=>r.shift||(r.time?(r.time<'13:00'?'ص':'م'):'');
          function viewHist(type){
            const T=TYPES[type],hasShift=type==='late'||type==='abs',grp=type==='late'||type==='late10'||type==='abs';
            const sh=hasShift?S.hshift:'';
            let recs=recsP().filter(r=>r.type===type).filter(r=>{const s=byId(r.sid);return s&&(!S.hcls||s.cls===S.hcls)&&(S.hmode==='all'||r.date===S.hdate)&&(!sh||effShift(r)===sh);});
            recs.sort((a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||''));
            const chip=(v,t)=>`<button class="${sh===v?'on':''}" data-act="hshift" data-v="${v}">${t}</button>`;
            let h=`<div class="bar"><button class="btn ghost sm" data-act="hback">→ رجوع</button><b>سجل: ${T.nav}</b><button class="btn sm" data-act="export" data-type="${type}">⬇️ CSV</button></div>
            <div class="bar"><select id="hmode"><option value="day"${S.hmode==='all'?'':' selected'}>اليوم المختار فقط</option><option value="all"${S.hmode==='all'?' selected':''}>السجل الكلي</option></select>${S.hmode==='all'?'':`<input type="date" id="hdate" value="${S.hdate}">`}</div>
            ${hasShift?`<div class="seg" style="padding-top:0">${chip('ص','☀️ صباحية 08:00–12:00')}${chip('م','🌙 مسائية 13:30–16:30')}${chip('','📅 اليوم كاملا')}</div>`:''}
            <div class="bar"><select id="hcls">${classOptions(S.hcls,'كل الأقسام')}</select><span class="muted">${recs.length} تسجيل</span></div>
            ${grp?`<div class="seg" style="padding-top:0"><button class="${S.hview==='stu'?'':'on'}" data-act="hview" data-v="rows">حسب التسجيل</button><button class="${S.hview==='stu'?'on':''}" data-act="hview" data-v="stu">حسب التلميذ + القرارات</button></div>`:''}`+dayPicBar(type,S.hdate,S.hmode==='all');
            if(!recs.length) return h+'<p class="muted pad">لا توجد تسجيلات</p>';
            if(grp&&S.hview==='stu'){
              const dt=type==='late10'?'late10':type,m={};
              recs.forEach(r=>{const o=m[r.sid]||(m[r.sid]={s:byId(r.sid),all:0,j:0,u:0,k:0});o.all++;if(r.just) o.j++;else o.u++;const ld=decDate(r.sid,dt);if(!r.just&&!(ld&&r.date<=ld)) o.k++;});
              const L=Object.values(m).sort((a,b)=>b.k-a.k||b.u-a.u);
              return h+`<p class="hint">«منذ آخر قرار» = غير المبررة بعد آخر قرار سجلته؛ بعد كل قرار يبدأ الحساب من جديد.</p>`+L.map(o=>{const ld=decDate(o.s.id,dt);return `<div class="row"><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)} · مبررة <b>${o.j}</b> · غير مبررة <b>${o.u}</b>${ld?' · آخر قرار '+fmtDate(ld):''}</small></span><span class="rc ${o.k>=3?'hot':''}" title="منذ آخر قرار">${o.k}</span><button class="btn sm ghost" data-act="dec" data-sid="${o.s.id}" data-type="${dt}">📝 قرار</button></div>`;}).join('');
            }
            let last='';
            for(const r of recs){
              const s=byId(r.sid);
              if(r.date!==last){h+=`<h3 class="d">${fmtDate(r.date)}</h3>`;last=r.date;}
              h+=`<div class="row hr" data-act="recinfo" data-from="hist" data-rid="${r.id}"><span class="nm">${esc(nameOf(s))}</span><span class="sub">${esc(s.cls)}</span><span class="st">${rowState(type,r)}</span><button class="x" data-act="delrec" data-rid="${r.id}" aria-label="حذف">✕</button></div>`;
            }
            return h;
          }
          function sinceDec(sid,type){
            const ld=decDate(sid,type);
            const L=recsP().filter(r=>r.sid===sid&&r.type===type&&!(ld&&r.date<=ld));
            return {all:L.length,j:L.filter(r=>r.just).length,u:L.filter(r=>!r.just).length};
          }
          function decModal(sid,type){
            const s=byId(sid);if(!s) return;
            const c=sinceDec(sid,type),L=decOf(sid,type);
            modal(`<h3>📝 قرار — ${TYPES[type]?TYPES[type].nav:type}</h3><p class="muted"><b>${esc(nameOf(s))}</b> · ${esc(s.cls)}</p>
            <div class="prev">منذ آخر قرار${L.length?' ('+fmtDate(L[0].date)+')':''}: <b>${c.all}</b> تسجيل — مبرر <b>${c.j}</b> · غير مبرر <b>${c.u}</b></div>
            <label>القرار المتخذ (مثال: إنذار شفوي، استدعاء الولي، توبيخ)</label><div class="mrow"><textarea id="d_note" rows="3"></textarea><button type="button" class="mic" data-act="mic" data-for="d_note" aria-label="إملاء صوتي">🎤</button></div>
            <label>تاريخ القرار</label><input type="date" id="d_date" value="${todayStr()}">
            <p class="muted" style="font-size:12px">بعد الحفظ يبدأ حساب ${TYPES[type]?TYPES[type].nav:''} هذا التلميذ من الصفر (التسجيلات القديمة تبقى محفوظة).</p>
            <div class="acts"><button class="btn" data-act="decsave" data-sid="${sid}" data-type="${type}">💾 حفظ القرار وبدء حساب جديد</button><button class="btn ghost" data-act="closem">إغلاق</button></div>
            ${L.length?`<h3 style="font-size:15px;margin-top:14px">القرارات السابقة</h3><div class="hl">${L.map(x=>`<div class="row hr"><span class="sub">${fmtDate(x.date)}</span><span class="nm">${esc(x.note||'—')}</span><button class="x" data-act="decdel" data-id="${x.id}" data-sid="${sid}" data-type="${type}" aria-label="حذف">✕</button></div>`).join('')}</div><p class="muted" style="font-size:12px">حذف قرار يعيد العدّ من القرار الذي قبله.</p>`:''}`);
          }
          /* ---------- تقرير الأساتذة الشهري ---------- */
          function tRepData(ym){
            return db.teachers.map(t=>{
              const wk=db.sched.filter(x=>x.tid===t.id).length,done=db.subs.filter(s=>s.sub===t.id&&s.date.slice(0,7)===ym),cov=db.subs.filter(s=>s.abs===t.id&&s.date.slice(0,7)===ym);
              return {t,wk,done:done.length,cov:cov.length,tot:subTotal(t)};
            }).sort((a,b)=>b.done-a.done||b.cov-a.cov||a.t.name.localeCompare(b.t.name,'ar'));
          }
          function tRepHtml(){
            const L=tRepData(S.tm);
            return `<div class="title">📊 تقرير الأساتذة</div><div class="bar"><input type="month" id="t_m" value="${S.tm}"><button class="btn sm ghost" data-act="trxlsx">⬇️ Excel</button></div>
            <div class="bar"><button class="btn ghost sm" data-act="tview" data-v="list">→ قائمة الأساتذة</button><span class="muted">${db.teachers.length} أستاذ</span></div>
            <p class="hint">حصص الأسبوع من الجدول · «عوّض» و«عُوِّض عنه» من سجل التعويضات لهذا الشهر · الإجمالي يشمل الساعات السابقة.</p>`+
            (L.length?L.map(o=>`<div class="row"><span class="nm">${esc(o.t.name)}<br><small class="muted">${esc(o.t.subject||'—')} · ${o.wk} حصة أسبوعيا</small></span><span class="rc">عوّض ${o.done}</span><span class="rc ${o.cov?'hot':''}">عُوِّض عنه ${o.cov}</span><span class="rc">Σ ${o.tot}</span></div>`).join(''):'<p class="muted pad">لا يوجد أساتذة</p>');
          }
          function tRepRows(ym){
            const r=[['الأستاذ','المادة','حصص الأسبوع','ساعات عوّضها هذا الشهر','ساعات عُوِّضت عنه','إجمالي ساعات التعويض (مع السابق)']];
            tRepData(ym).forEach(o=>r.push([o.t.name,o.t.subject||'',o.wk,o.done,o.cov,o.tot]));return r;
          }
          const _vt=viewTeachers;
          viewTeachers=function(){
            if(S.tview==='rep') return tRepHtml();
            return _vt().replace('<button class="btn sm" data-act="tnew">➕ أستاذ</button></div>','<button class="btn sm" data-act="tnew">➕ أستاذ</button><button class="btn sm ghost" data-act="tview" data-v="rep">📊 تقرير</button></div>');
          };
          /* ---------- ربط ---------- */
          const _ec6=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'snear':S.snear=d.v==='1';render();return;
              case 'hshift':S.hshift=d.v;render();return;
              case 'hview':S.hview=d.v;render();return;
              case 'dec':decModal(d.sid,d.type);return;
              case 'decsave':{const n=$('#d_note').value.trim(),dt=$('#d_date').value||todayStr();if(!n){toast('اكتب القرار المتخذ');return;}db.decisions.push({id:uid(),sid:d.sid,type:d.type,date:dt,note:n});save();render();decModal(d.sid,d.type);toast('تم — بدأ الحساب من جديد');return;}
              case 'decdel':db.decisions=db.decisions.filter(x=>x.id!==d.id);save();render();decModal(d.sid,d.type);return;
              case 'tview':S.tview=d.v;render();return;
              case 'trxlsx':download('تقرير-الأساتذة-'+S.tm+'.xlsx',makeXlsx([{name:'الأساتذة',rows:tRepRows(S.tm)}]),XLSX_MIME);return;
            }
            _ec6(a,d,el,e);
          };
          const _ecg6=extraChange;
          extraChange=function(t){
            if(t.id==='t_m'){S.tm=t.value||todayStr().slice(0,7);render();return;}
            _ecg6(t);
          };

          /* ---------- الهروب من الحصص ---------- */
          function escGender(recs){
            const m={};recs.forEach(r=>{const s=byId(r.sid);if(!s) return;const o=m[s.cls]||(m[s.cls]={m:0,f:0,u:0,seen:new Set()});if(o.seen.has(s.id)) return;o.seen.add(s.id);if(s.sex==='ذكر')o.m++;else if(s.sex==='أنثى')o.f++;else o.u++;});
            const ks=Object.keys(m).sort(cmpNat);if(!ks.length) return '';
            let tm=0,tf=0,tu=0;ks.forEach(k=>{tm+=m[k].m;tf+=m[k].f;tu+=m[k].u;});
            return `<h3 class="d">👦👧 الهاربون حسب القسم</h3><table class="t st"><tr class="blk"><th>القسم</th><th>ذكور</th><th>إناث</th>${tu?'<th>؟</th>':''}<th>المجموع</th></tr>${ks.map(k=>`<tr><td>${esc(k)}</td><td>${m[k].m}</td><td>${m[k].f}</td>${tu?'<td>'+m[k].u+'</td>':''}<td><b>${m[k].m+m[k].f+m[k].u}</b></td></tr>`).join('')}<tr class="blk"><td>الكل</td><td>${tm}</td><td>${tf}</td>${tu?'<td>'+tu+'</td>':''}<td><b>${tm+tf+tu}</b></td></tr></table>`;
          }
          const _vr6=viewRecord;
          viewRecord=function(type){
            const h=_vr6(type);
            if(type!=='esc'||S.hist) return h;
            return h+escGender(db.records.filter(r=>r.type==='esc'&&r.date===S.date));
          };
          const _vh6=viewHist;
          viewHist=function(type){
            const h=_vh6(type);
            if(type!=='esc') return h;
            const recs=recsP().filter(r=>r.type==='esc').filter(r=>{const s=byId(r.sid);return s&&(!S.hcls||s.cls===S.hcls)&&(S.hmode==='all'||r.date===S.hdate);});
            return h+escGender(recs);
          };
          const _tap6=tap;
          tap=function(sid){
            if(S.tab!=='esc') return _tap6(sid);
            const s=byId(sid),r=findRec('esc',sid,S.date),sl=slotsOf();
            modal(`<h3>🏃 هروب — ${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)} · ${fmtDate(S.date)}${s.sex?' · '+esc(s.sex):''}</p>
            <label>الحصة التي هرب منها</label><select id="e_slot"><option value="">—</option>${sl.map(x=>`<option value="${esc(x)}"${r&&r.slot===x?' selected':''}>${esc(x)}</option>`).join('')}</select>
            ${s.sex?'':`<label>الجنس (لم يُحدَّد)</label><select id="e_sex"><option value="">—</option><option>ذكر</option><option>أنثى</option></select>`}
            <label>ملاحظة (اختياري)</label><div class="mrow"><textarea id="e_note" rows="2">${r?esc(r.note||''):''}</textarea><button type="button" class="mic" data-act="mic" data-for="e_note" aria-label="إملاء صوتي">🎤</button></div>
            <div class="acts"><button class="btn" data-act="escsave" data-sid="${sid}">${r?'حفظ':'تسجيل'}</button>${r?`<button class="btn danger" data-act="escdel" data-sid="${sid}">إلغاء التسجيل</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          };
          const _ec7=extraClick;
          extraClick=function(a,d,el,e){
            if(a==='escsave'){
              const s=byId(d.sid);let r=findRec('esc',d.sid,S.date);if(!r){r=mkRec('esc',d.sid,S.date);db.records.push(r);}
              const sl=$('#e_slot').value,nt=$('#e_note').value.trim();
              if(sl) r.slot=sl;else delete r.slot;if(nt) r.note=nt;else delete r.note;
              const sx=$('#e_sex');if(sx&&sx.value) s.sex=sx.value;
              save();closeM();render();return;
            }
            if(a==='escdel'){const r=findRec('esc',d.sid,S.date);if(r) db.records.splice(db.records.indexOf(r),1);save();closeM();render();return;}
            _ec7(a,d,el,e);
          };

          /* ================= التقرير اليومي لمستشار التربية (PDF) ================= */
          Object.assign(S,{msd:todayStr()});
          const FRD=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
          const isSchoolDay=d=>{const w=new Date(d+'T12:00:00').getDay();return w<=4||(w===6&&showSat());};
          const f2=n=>(isFinite(n)?n:0).toFixed(2).replace('.',',');
          const rg=D=>db.reps[D]||{};
          const rs=D=>(db.reps[D]=db.reps[D]||{});
          const MSN=(k,def)=>db.settings[k]===undefined||db.settings[k]===''?def:+db.settings[k];
          function repNo(D){
            const r=rg(D);if(r.no) return r.no;
            const ds=Object.keys(db.reps).filter(x=>x<D&&db.reps[x].no).sort();if(!ds.length) return '';
            let c=ds[ds.length-1],n=+db.reps[c].no;
            for(let i=0;i<150&&c<D;i++){c=addDays(c,1);if(isSchoolDay(c)) n++;}
            return n;
          }
          function absList(D){
            const by={};
            db.records.forEach(r=>{if(r.type==='abs'){(by[r.sid]=by[r.sid]||new Set()).add(r.date);}});
            const ids=new Set(Object.keys(by).filter(k=>by[k].has(D)));
            Object.keys(db.absSince).forEach(k=>{if(db.absSince[k]<=D&&byId(k)) ids.add(k);});
            const L=[];
            ids.forEach(sid=>{
              const s=byId(sid);if(!s) return;
              const ds=by[sid]||new Set(),as=db.absSince[sid]||'',has=d=>ds.has(d)||(as&&as<=d);
              let start=D,n=1,cur=D;
              for(let i=0;i<400;i++){cur=addDays(cur,-1);if(!isSchoolDay(cur)) continue;if(has(cur)){start=cur;n++;}else break;}
              const r=db.records.find(x=>x.type==='abs'&&x.sid===sid&&x.date===D);
              L.push({s,start,n,cal:Math.round((new Date(D+'T12:00:00')-new Date(start+'T12:00:00'))/864e5)+1,just:!!(r&&r.just),man:!!as});
            });
            return L.sort((a,b)=>b.n-a.n||cmpNat(a.s.cls,b.s.cls)||cmpName(a.s,b.s));
          }
          const stat1=s=>{const t=norm(s.status||'');return /نصف/.test(t)?'ن':/داخل/.test(t)?'د':/خارج/.test(t)?'خ':(s.status||'').slice(0,1);};
          function msData(D){
            const AL=absList(D),aset=new Set(AL.map(o=>o.s.id)),dn=dayName(D),sl=slotsOf();
            const levels=[4,3,2,1].map(l=>{
              const cs=classes().filter(c=>levelOf(c)===l),g={};
              cs.forEach(c=>{const m=/(\d+)\s*$/.exec(c);if(m){const k=+m[1];if(k>=1&&k<=16){const st=studentsOf(c);g[k]={n:st.length,a:st.filter(x=>aset.has(x.id)).length};}}});
              const n=cs.reduce((t,c)=>t+studentsOf(c).length,0),a=cs.reduce((t,c)=>t+studentsOf(c).filter(x=>aset.has(x.id)).length,0);
              return {l,g,n,a};
            });
            const N=levels.reduce((t,o)=>t+o.n,0),A=levels.reduce((t,o)=>t+o.a,0);
            const hrs=MSN('repAbs',6),vol=N*MSN('repVol',7),ah=A*hrs;
            const ta=db.tabs.filter(t=>t.date===D).map(t=>{
              const T=db.teachers.find(x=>x.id===t.tid)||{name:'?'},cells=Array(8).fill(''),bySub=[];
              db.sched.filter(x=>x.tid===t.tid&&x.day===dn).forEach(x=>{
                const i=sl.indexOf(x.slot);if(i<0||i>7) return;
                if(db.subs.some(s=>s.date===D&&s.slot===x.slot&&s.cls===x.cls&&s.abs===t.tid)){bySub.push('ح'+(i+1));return;}
                cells[i]=cells[i]?cells[i]+' / '+x.cls:x.cls;
              });
              return {t,T,cells,note:(t.note||'')+(bySub.length?(t.note?' · ':'')+'عُوِّض '+bySub.join('،'):'')};
            });
            const sup=(rg(D).sup||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split('|').map(y=>y.trim());return {n:p[0]||'',w:p[1]||'',r:p[2]||''};});
            return {AL,levels,N,A,hrs,vol,ah,ta,sup,supN:MSN('supN',3)};
          }
          function msDoc(D){
            const d=msData(D),R=rg(D),no=repNo(D),dt=D.split('-').reverse().join('-'),wd=FRD[new Date(D+'T12:00:00').getDay()];
            const P=(v)=>esc(String(v==null?'':v));
            const long=d.AL.filter(o=>o.n>3),short=d.AL.filter(o=>o.n<=3);
            const bx=(h,t)=>`<div style="border:1px solid #000;height:${h}px;padding:4px;font-size:11px;white-space:pre-wrap;overflow:hidden">${t?P(t):''}</div>`;
            // 1.1
            let t11=d.ta.length?d.ta.map((o,i)=>`<tr><td>${i+1}</td><td>${P(o.T.name)}</td><td>${P(o.T.subject||'')}</td>${o.cells.map(c=>`<td>${P(c)}</td>`).join('')}<td style="font-size:10px">${P(o.note)}</td></tr>`).join(''):`<tr><td colspan="12"><b>لا يوجد</b></td></tr>`;
            // 2.1
            const g16=Array.from({length:16},(_,i)=>i+1);
            const t21=d.levels.map(o=>`<tr><td rowspan="2" style="width:48px"><b>${o.l} متوسط</b></td><td>التعداد</td>${g16.map(k=>`<td>${o.g[k]?o.g[k].n:''}</td>`).join('')}<td><b>${o.n||''}</b></td><td>/</td></tr><tr style="background:#cfcfcf"><td>الغياب</td>${g16.map(k=>`<td>${o.g[k]?o.g[k].a:''}</td>`).join('')}<td><b>${o.n?o.a:''}</b></td><td>${o.n?f2(o.a/o.n*100):''}</td></tr>`).join('');
            // summary
            const tA=d.ta.length,sA=d.sup.length,sP=Math.max(0,d.supN-sA);
            const sum=`<table><tr><th></th><th>التلاميذ</th><th>الأساتذة</th><th>المشرفون</th></tr>
            <tr><th>الحاضرون</th><td>${d.N-d.A}</td><td></td><td>${d.supN?sP:''}</td></tr>
            <tr><th>الغائبون</th><td>${d.A}</td><td>${tA}</td><td>${sA}</td></tr>
            <tr><th>المجموع</th><td>${d.N}</td><td></td><td>${d.supN||''}</td></tr>
            <tr><th>نسبة الغياب</th><td>${f2(d.vol?d.ah/d.vol*100:0)}</td><td></td><td>${d.supN?f2(sA/d.supN*100):''}</td></tr></table>`;
            const supT=`<table><tr><th style="width:26px">الرقم</th><th>المشرف</th><th style="width:40px">صباحا</th><th style="width:36px">مساء</th><th>السبب</th></tr>${d.sup.length?d.sup.map((o,i)=>`<tr><td>${i+1}</td><td>${P(o.n)}</td><td>${/ص/.test(o.w)?'✓':''}</td><td>${/م/.test(o.w)?'✓':''}</td><td>${P(o.r)}</td></tr>`).join(''):'<tr><td colspan="5"><b>لا يوجد</b></td></tr>'}</table>`;
            // page 2
            const L5=long.map((o,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${P(nameOf(o.s))}</td><td>${P(o.s.cls)}</td><td>${P(stat1(o.s))}</td><td>${fmtDate(o.start)}</td><td>${o.cal}</td><td>${fmtDate(addDays(o.start,3))}</td><td>${fmtDate(addDays(o.start,10))}</td><td>${fmtDate(addDays(o.start,17))}</td><td style="font-size:10px">${o.just?'مبرر':''}</td></tr>`);
            while(L5.length<8) L5.push(`<tr><td>${L5.length+1}</td>${'<td></td>'.repeat(9)}</tr>`);
            const row6=(o,i)=>o?`<tr><td>${i}</td><td style="text-align:right">${P(nameOf(o.s))}</td><td>${P(o.s.cls)}</td><td>${d.hrs}</td><td>${o.n}</td><td>${P(stat1(o.s))}</td><td style="font-size:10px">${o.just?'مبرر':''}</td></tr>`:`<tr><td>${i}</td>${'<td></td>'.repeat(6)}</tr>`;
            const rows6=n=>short.slice(n*15>0?15:0,n?30:15);
            const h6=`<tr><th style="width:24px">الرقم</th><th>التلميذ</th><th style="width:40px">القسم</th><th style="width:26px">ع.س</th><th style="width:26px">م.غ</th><th style="width:24px">ص</th><th style="width:50px">الملاحظات</th></tr>`;
            const tb6=k=>{const base=k*15,rows=[];for(let i=0;i<Math.max(15,short.length>30?Math.ceil(short.length/2):15);i++) rows.push(row6(short[base+i],base+i+1));return `<table>${h6}${rows.join('')}</table>`;};
            const css=`<style>.ms{width:794px;direction:rtl;font-family:Tahoma,Arial,sans-serif;color:#000;background:#fff}.ms .pg{width:794px;height:1123px;box-sizing:border-box;padding:26px 32px;position:relative;overflow:hidden;background:#fff}.ms table{border-collapse:collapse;width:100%}.ms td,.ms th{border:1px solid #000;text-align:center;padding:1px 3px;font-size:11px;height:20px;font-weight:normal}.ms th{font-weight:bold}.ms h4{margin:8px 0 3px;font-size:13px}</style>`;
            const sig=`<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:12px;position:absolute;left:32px;right:32px;bottom:60px"><span>إمضاء مستشار التربية:</span><span>إمضاء الناظر:</span><span>إمضاء المدير:</span></div>`;
            return `<div class="ms" dir="rtl">${css}
            <div class="pg blk">
             <table style="border:0"><tr><td style="border:0;width:30%;font-size:12px;font-weight:bold;text-align:center">مديرية التربية<br>لولاية الجزائر وسط</td><td style="border:0;font-size:13px;font-weight:bold;text-align:center">الجمهورية الجزائرية الديمقراطية الشعبية<br>وزارة التربية الوطنية</td><td style="border:0;width:30%;font-size:11px;font-weight:bold;text-align:center">متوسطة المجاهد المتوفي العلامة الطاهر ايت علجت - بولوغين</td></tr></table>
             <div style="text-align:center;font-size:17px;font-weight:bold;margin:8px 0 4px;text-decoration:underline">التقرير اليومي لمستشار التربية</div>
             <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>الموافق ليوم : ${wd} ${dt}</span><span>الرقم: <b>${P(no)}</b></span></div>
             <h4>1- الدراسة: 1.1 دروس لم تقدم</h4>
             <table><tr><th rowspan="2" style="width:26px">رقم</th><th rowspan="2">الأستاذ</th><th rowspan="2" style="width:80px">المادة</th><th colspan="4">الفترة الصباحية</th><th colspan="4">الفترة المسائية</th><th rowspan="2" style="width:70px">ملاحظات</th></tr><tr>${[1,2,3,4,5,6,7,8].map(i=>`<th style="width:36px">ح${i}</th>`).join('')}</tr>${t11}</table>
             <h4>1-2 الإجراءات المتخذة:</h4>${bx(34,R.act)}
             <h4>2-1 غيابات التلاميذ:</h4>
             <table><tr><th colspan="2">الأفــــواج</th>${g16.map(k=>`<th style="width:26px">${String(k).padStart(2,'0')}</th>`).join('')}<th style="width:40px">المجموع</th><th style="width:38px">ن غ %</th></tr>${t21}</table>
             <h4>2-2 ملاحظات:</h4>${bx(34,R.notes)}
             <div style="display:flex;gap:14px;margin-top:8px;align-items:flex-start"><div style="flex:1.15"><h4 style="margin-top:0">3- غيابات و تأخرات المشرفين التربويين:</h4>${supT}</div><div style="flex:1"><h4 style="margin-top:0">الخلاصــــة:</h4>${sum}<div style="display:flex;gap:10px;margin-top:6px;font-size:12px;font-weight:bold"><span>الحجم الساعي: <span style="border:1px solid #000;padding:1px 8px">${d.vol}</span></span><span>ساعات الغياب: <span style="border:1px solid #000;padding:1px 8px">${d.ah}</span></span></div></div></div>
             <div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1"><h4 style="margin-top:0">4- ملاحظات مستشار التربية</h4>${bx(120,R.cons)}</div><div style="flex:1"><h4 style="margin-top:0">ملاحظات الناظر:</h4>${bx(120,'')}</div><div style="flex:1"><h4 style="margin-top:0">قرارات المدير:</h4>${bx(120,'')}</div></div>
            </div>
            <div class="pg blk">
             <h4 style="margin-top:0">5- قائمة التلاميذ الغائبون لأكثر من 3 أيام (المشعرون):</h4>
             <table><tr><th style="width:26px">الرقم</th><th>التلميذ</th><th style="width:44px">القسم</th><th style="width:24px">ص</th><th style="width:72px">غائب منذ</th><th style="width:34px">مدة غ</th><th style="width:72px">الإشعار الأول</th><th style="width:72px">الإشعار الثاني</th><th style="width:72px">الإعذار</th><th style="width:50px">ملاحظات</th></tr>${L5.join('')}</table>
             <h4>6- قائمة التلاميذ الغائبون لأقل من 4 أيام:(ع س: عدد ساعات الغياب في اليوم)(م.غ: عدد أيام الغياب المتتالي)(ص:الصفة)</h4>
             <div style="display:flex;gap:8px;align-items:flex-start"><div style="flex:1">${tb6(0)}</div><div style="flex:1">${tb6(1)}</div></div>
             ${sig}
            </div></div>`;
          }
          /* ---------- الواجهة ---------- */
          function viewMs(){
            const D=S.msd,R=rg(D),d=msData(D),long=d.AL.filter(o=>o.n>3).length;
            const mk=(id,l,v,ph)=>`<label>${l}</label><textarea id="${id}" rows="2" placeholder="${ph||''}">${esc(v||'')}</textarea>`;
            return `<div class="bar"><input type="date" id="ms_date" value="${D}"><input type="number" id="ms_no" inputmode="numeric" value="${esc(repNo(D))}" placeholder="رقم التقرير" style="max-width:110px"></div>
            <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="mspdf">📄 حفظ PDF</button></div>
            <p class="hint">يُملأ تلقائيا من الغيابات والجداول والتعويضات المسجلة. عدّل الحقول أدناه عند الحاجة ثم اضغط حفظ PDF.</p>
            <div class="sum"><span>غائبون <b>${d.A}</b> من <b>${d.N}</b> · أكثر من 3 أيام <b>${long}</b> · أساتذة غائبون <b>${d.ta.length}</b></span></div>
            <div style="padding:0 12px">
            <div class="bar" style="padding:0"><button class="btn sm ghost" data-act="tabadd">➕ أستاذ غائب (دروس لم تقدم)</button><button class="btn sm ghost" data-act="assadd">➕ تلميذ غائب منذ تاريخ</button></div>
            ${d.ta.map(o=>`<div class="row" style="min-height:0"><span class="nm">${esc(o.T.name)}<br><small class="muted">${o.cells.map((c,i)=>c?'ح'+(i+1)+': '+esc(c):'').filter(Boolean).join(' · ')||'لا حصص غير معوَّضة'}</small></span><button class="x" data-act="tabdel" data-id="${o.t.id}" aria-label="حذف">✕</button></div>`).join('')}
            ${Object.keys(db.absSince).filter(k=>db.absSince[k]<=D&&byId(k)).map(k=>`<div class="row" style="min-height:0"><span class="nm">${esc(nameOf(byId(k)))}<br><small class="muted">${esc(byId(k).cls)} · غائب منذ ${fmtDate(db.absSince[k])} (يُحسب غائبا كل يوم)</small></span><button class="btn sm ghost" data-act="asback" data-sid="${k}">↩️ عاد</button></div>`).join('')}
            ${mk('ms_act','1-2 الإجراءات المتخذة',R.act)}${mk('ms_notes','2-2 ملاحظات',R.notes)}${mk('ms_cons','4- ملاحظات مستشار التربية',R.cons)}
            ${mk('ms_sup','غيابات وتأخرات المشرفين (سطر لكل مشرف: الاسم | ص أو م | السبب)',R.sup,'مثال: بن علي | ص | مرض')}
            <div class="bar" style="padding:0"><label style="margin:0">عدد المشرفين</label><input type="number" id="ms_supn" value="${MSN('supN',3)}" style="max-width:70px"><label style="margin:0">ساعات اليوم</label><input type="number" id="ms_vol" value="${MSN('repVol',7)}" style="max-width:70px"><label style="margin:0">ساعات غياب التلميذ</label><input type="number" id="ms_hrs" value="${MSN('repAbs',6)}" style="max-width:70px"></div>
            </div>
            <h3 class="d">معاينة</h3><div style="overflow:auto;padding:0 6px"><div style="zoom:.46;border:1px solid var(--line,#8884)">${msDoc(D)}</div></div>`;
          }
          const _ec8=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'mspdf':{const D=S.msd;rs(D).no=repNo(D);save();toast('جاري إنشاء PDF…');htmlToPdf(msDoc(D)).then(b=>download('تقرير-المستشار-'+D+'.pdf',b,'application/pdf')).then(ok=>{if(ok) toast('تم إنشاء الملف');}).catch(()=>toast('تعذّر إنشاء PDF'));return;}
              case 'tabadd':{modal(`<h3>أستاذ غائب — ${fmtDate(S.msd)}</h3><label>الأستاذ</label><select id="ta_t">${db.teachers.slice().sort((x,y)=>x.name.localeCompare(y.name,'ar')).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><label>ملاحظة (اختياري)</label><input id="ta_n"><div class="acts"><button class="btn" data-act="tabsave">حفظ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);return;}
              case 'tabsave':{const t=$('#ta_t').value;if(t&&!db.tabs.some(x=>x.date===S.msd&&x.tid===t)) db.tabs.push({id:uid(),date:S.msd,tid:t,note:$('#ta_n').value.trim()});save();closeM();render();return;}
              case 'tabdel':db.tabs=db.tabs.filter(x=>x.id!==d.id);save();render();return;
              case 'assadd':{modal(`<h3>تلميذ غائب منذ تاريخ</h3><p class="muted" style="font-size:12px">يُحسب غائبا في التقرير كل يوم إلى أن تضغط «عاد».</p><label>القسم</label><select id="as_c">${classOptions('','— اختر —')}</select><label>التلميذ</label><select id="as_s"></select><label>غائب منذ</label><input type="date" id="as_d" value="${S.msd}"><div class="acts"><button class="btn" data-act="asssave">حفظ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);return;}
              case 'asssave':{const s=$('#as_s').value,dt=$('#as_d').value;if(!s||!dt){toast('اختر التلميذ والتاريخ');return;}db.absSince[s]=dt;save();closeM();render();return;}
              case 'asback':delete db.absSince[d.sid];save();render();return;
            }
            _ec8(a,d,el,e);
          };
          const _ecg8=extraChange;
          extraChange=function(t){
            const id=t.id;
            if(id==='ms_date'){S.msd=t.value||todayStr();render();return;}
            if(id==='ms_no'){rs(S.msd).no=t.value;save();render();return;}
            if(id==='ms_act'||id==='ms_notes'||id==='ms_cons'||id==='ms_sup'){rs(S.msd)[id.slice(3)]=t.value;save();render();return;}
            if(id==='ms_supn'){db.settings.supN=t.value;save();render();return;}
            if(id==='ms_vol'){db.settings.repVol=t.value;save();render();return;}
            if(id==='ms_hrs'){db.settings.repAbs=t.value;save();render();return;}
            if(id==='as_c'){$('#as_s').innerHTML=studentsOf(t.value).map(s=>`<option value="${s.id}">${esc(nameOf(s))}</option>`).join('');return;}
            _ecg8(t);
          };

          /* ================= الحالات الصحية الخاصة ================= */
          Object.assign(S,{hseg:'l',hsel:'',hlv:0});
          const hItems=()=>db.health.map(h=>({h,s:byId(h.sid)})).filter(o=>o.s).sort((a,b)=>cmpNat(a.s.cls,b.s.cls)||cmpName(a.s,b.s));
          const schoolYear=()=>{if(db.settings.year) return db.settings.year;const d=new Date(),y=d.getFullYear(),a=d.getMonth()>=7?y:y-1;return a+' / '+(a+1);};
          const hKind=h=>h.dis+(h.kind==='إعاقة'?' (إعاقة)':'');
          const hTeachers=cls=>{const m={};db.sched.filter(x=>x.cls===cls).forEach(x=>{const t=db.teachers.find(t=>t.id===x.tid);if(t) m[t.id]=t;});return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name,'ar'));};
          const hHead=()=>`<div style="text-align:center;font-weight:bold;font-size:12px">الجمهورية الجزائرية الديمقراطية الشعبية<br>وزارة التربية الوطنية<br><span style="display:block;text-align:right;margin-top:4px">مديرية التربية لولاية الجزائر وسط<br>متوسطة المجاهد المتوفي العلامة الطاهر ايت علجت - بولوغين</span><span style="display:block;text-align:left;margin-top:2px">السنة الدراسية: ${schoolYear()}</span></div>`;
          const hWrap=(inner,pages)=>`<div dir="rtl" style="width:794px;background:#fff;color:#000;font-family:Arial,Tahoma,sans-serif;font-size:13px;line-height:1.6"><style>.hp table{border-collapse:collapse;width:100%}.hp td,.hp th{border:1px solid #000;padding:5px 6px;text-align:center;font-size:12.5px}.hp th{background:#e5e5e5}</style>${inner}</div>`;
          const hPage=body=>`<div class="hp blk" style="height:1120px;box-sizing:border-box;padding:30px 36px;overflow:hidden">${hHead()}${body}</div>`;
          function hListDoc(){
            const L=hItems();
            return hWrap(hPage(`<div style="text-align:center;font-size:19px;font-weight:bold;text-decoration:underline;margin:16px 0 4px">قائمة التلاميذ المصابين بالأمراض المزمنة والإعاقات</div><div style="text-align:center;margin-bottom:10px">السنة الدراسية ${schoolYear()} — العدد: ${L.length}</div>
            <table><tr><th>الرقم</th><th>اللقب والاسم</th><th>القسم</th><th>نوع المرض / الإعاقة</th><th>ملاحظات</th></tr>${L.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(nameOf(o.s))}</td><td>${esc(o.s.cls)}</td><td>${esc(hKind(o.h))}</td><td>${esc(o.h.note||'')}</td></tr>`).join('')||'<tr><td colspan="5">—</td></tr>'}</table>
            <div style="margin-top:30px;text-align:left;font-weight:bold">مدير المتوسطة</div>`));
          }
          function hNoticeBody(o){
            const s=o.s,f=s.sex==='أنثى',T=hTeachers(s.cls);
            return `<div style="text-align:center;font-size:20px;font-weight:bold;text-decoration:underline;margin:18px 0 12px">إشعار بحالة صحية خاصة</div>
            <p><b>إلى السادة أساتذة القسم: ${esc(s.cls)}</b></p><p><b>الموضوع:</b> إشعار بحالة صحية خاصة لدى ${f?'تلميذة':'تلميذ'}.</p>
            <p style="text-align:justify">نحيطكم علما بأن ${f?'التلميذة':'التلميذ'}: <b>${esc(nameOf(s))}</b>، ${f?'المتمدرسة':'المتمدرس'} بالقسم: <b>${esc(s.cls)}</b>، ${f?'تعاني':'يعاني'} من: <b>${esc(hKind(o.h))}</b>.</p>
            ${o.h.note?`<p style="text-align:justify"><b>التوصيات والاحتياطات:</b> ${esc(o.h.note)}</p>`:''}
            <p style="text-align:justify">لذا نرجو منكم أخذ العلم ومراعاة حالة ${f?'التلميذة':'التلميذ'} الصحية أثناء الحصص، مع التزام السرية التامة وعدم الحديث عن هذه الحالة أمام التلاميذ، وإبلاغ الإدارة فورا عند الحاجة.</p>
            <table style="margin-top:14px"><tr><th>الرقم</th><th>الأستاذ</th><th>المادة</th><th>الاطلاع (التاريخ والإمضاء)</th></tr>${(T.length?T:[null,null,null,null,null,null]).map((t,i)=>`<tr style="height:30px"><td>${i+1}</td><td>${t?esc(t.name):''}</td><td>${t?esc(t.subject||''):''}</td><td></td></tr>`).join('')}</table>
            <div style="display:flex;justify-content:space-between;margin-top:26px;font-weight:bold"><span>الجزائر في: ${fmtDate(todayStr())}</span><span>مدير المتوسطة</span></div>`;
          }
          const hNoticeDoc=os=>hWrap(os.map(o=>hPage(hNoticeBody(o))).join(''));
          function hLevelBody(l){
            const L=hItems().filter(o=>levelOf(o.s.cls)===l),cs=[...new Set(L.map(o=>o.s.cls))].sort(cmpNat),m={};
            cs.forEach(c=>hTeachers(c).forEach(t=>{(m[t.id]=m[t.id]||{t,cs:[]}).cs.push(c);}));
            const TT=Object.values(m).sort((a,b)=>a.t.name.localeCompare(b.t.name,'ar'));
            return `<div style="text-align:center;font-size:18px;font-weight:bold;text-decoration:underline;margin:14px 0 6px">قائمة موحدة للحالات الصحية الخاصة — ${LV[l]||''}</div>
            <b>أولا: التلاميذ (${L.length})</b><table><tr><th>الرقم</th><th>اللقب والاسم</th><th>القسم</th><th>نوع المرض / الإعاقة</th></tr>${L.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(nameOf(o.s))}</td><td>${esc(o.s.cls)}</td><td>${esc(hKind(o.h))}</td></tr>`).join('')||'<tr><td colspan="4">—</td></tr>'}</table>
            <div style="margin-top:12px"><b>ثانيا: الأساتذة المعنيون (${TT.length})</b></div><table><tr><th>الرقم</th><th>الأستاذ</th><th>المادة</th><th>الأقسام المعنية</th><th>الاطلاع</th></tr>${TT.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.t.name)}</td><td>${esc(o.t.subject||'')}</td><td>${o.cs.map(esc).join('، ')}</td><td></td></tr>`).join('')||'<tr><td colspan="5">—</td></tr>'}</table>
            <div style="margin-top:22px;text-align:left;font-weight:bold">مدير المتوسطة</div>`;
          }
          const hLevelDoc=ls=>hWrap(ls.map(l=>hPage(hLevelBody(l))).join(''));
          function hLevels(){return [...new Set(hItems().map(o=>levelOf(o.s.cls)))].filter(l=>l).sort();}
          function viewHealth(){
            const seg=`<div class="seg"><button class="${S.hseg==='l'?'on':''}" data-act="hseg" data-v="l">📋 القائمة</button><button class="${S.hseg==='n'?'on':''}" data-act="hseg" data-v="n">📄 إشعار الأساتذة</button><button class="${S.hseg==='u'?'on':''}" data-act="hseg" data-v="u">🏫 قائمة موحدة</button></div>`;
            if(!db.students.length) return `<div class="title">💊 الحالات الصحية</div>`+seg+emptyState();
            const L=hItems(),pv=(d)=>`<div style="overflow:auto;margin:8px 0;border-top:1px solid var(--line)"><div style="width:794px;zoom:.46;background:#fff">${d}</div></div>`;
            let h=`<div class="title">💊 الحالات الصحية الخاصة</div>`+seg+`<p class="hint">🔒 معلومات سرية — للإدارة والأساتذة المعنيين فقط.</p>`;
            if(S.hseg==='l'){
              h+=`<div class="bar"><input id="h_q" type="search" placeholder="🔍 ابحث عن تلميذ بالاسم…" value="${esc(S.hq||'')}" autocomplete="off"></div><div class="acts" style="padding:0 12px"><button class="btn sm" data-act="hadd">➕ إضافة تلميذ</button>${L.length?'<button class="btn sm ghost" data-act="hpdf" data-k="l">📄 PDF للطباعة ('+L.length+')</button>':''}</div>`;
              if((S.hq||'').trim()){
                const q=norm(S.hq),res=db.students.filter(s=>norm(nameOf(s)).includes(q)).sort(cmpName).slice(0,50);
                return h+(res.length?res.map(s=>{const x=db.health.find(y=>y.sid===s.id);return `<div class="row"><span class="nm">${esc(nameOf(s))}<br><small class="muted">${esc(s.cls)}${x?' · ✅ مسجَّل: '+esc(hKind(x))+(x.note?' — '+esc(x.note):''):''}</small></span>${x?`<button class="btn ghost sm" data-act="hedit" data-id="${x.id}">✏️ عرض / تعديل</button>`:`<button class="btn sm" data-act="hadd" data-sid="${s.id}">➕ إضافة</button>`}</div>`;}).join(''):'<p class="muted pad">لا توجد نتائج</p>');
              }
              h+=L.length?L.map((o,i)=>`<div class="row"><span class="no">${i+1}</span><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)} · ${esc(hKind(o.h))}</small></span><button class="btn ghost sm" data-act="hedit" data-id="${o.h.id}">✏️</button></div>`).join('')+pv(hListDoc()):'<p class="muted pad">لم تُسجَّل أي حالة بعد. اضغط «إضافة تلميذ».</p>';
            }else if(S.hseg==='n'){
              if(!L.length) return h+'<p class="muted pad">أضف الحالات أولا من تبويب القائمة.</p>';
              const cur=L.find(o=>o.h.id===S.hsel)||L[0];
              h+=`<div class="bar"><select id="h_sel">${L.map(o=>`<option value="${o.h.id}"${o===cur?' selected':''}>${esc(nameOf(o.s))} — ${esc(o.s.cls)}</option>`).join('')}</select></div>
              <p class="hint">يُوجَّه الإشعار لأساتذة قسم التلميذ حسب جدول التوقيت (${hTeachers(cur.s.cls).length} أستاذ).</p>
              <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="hpdf" data-k="n" data-id="${cur.h.id}">📄 إشعار هذا التلميذ</button><button class="btn sm ghost" data-act="hpdf" data-k="na">📄 كل الإشعارات (${L.length})</button></div>`+pv(hNoticeDoc([cur]));
            }else{
              const lv=hLevels();
              if(!lv.length) return h+'<p class="muted pad">أضف الحالات أولا من تبويب القائمة.</p>';
              if(!lv.includes(S.hlv)) S.hlv=lv[0];
              h+=`<div class="bar"><select id="h_lv">${lv.map(l=>`<option value="${l}"${l===S.hlv?' selected':''}>${LV[l]}</option>`).join('')}</select></div>
              <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="hpdf" data-k="u" data-v="${S.hlv}">📄 هذا المستوى</button><button class="btn sm ghost" data-act="hpdf" data-k="ua">📄 كل المستويات</button></div>`+pv(hLevelDoc([S.hlv]));
            }
            return h;
          }
          function hModal(id,psid){
            const h=db.health.find(x=>x.id===id),s=h?byId(h.sid):(psid?byId(psid):null);
            modal(`<h3>💊 ${h?'تعديل حالة':'إضافة تلميذ'}</h3>
            ${s?`<p><b>${esc(nameOf(s))}</b> · ${esc(s.cls)}</p>`:`<label>القسم</label><select id="h_cls"><option value="">اختر القسم</option>${classes().map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>التلميذ</label><select id="h_sid"><option value="">—</option></select>`}
            <label>النوع</label><select id="h_kind"><option${h&&h.kind==='مرض مزمن'?' selected':''}>مرض مزمن</option><option${h&&h.kind==='إعاقة'?' selected':''}>إعاقة</option></select>
            <label>نوع المرض / الإعاقة (مثال: السكري، الربو، صرع…)</label><input id="h_dis" value="${h?esc(h.dis):''}">
            <label>توصيات للأساتذة (اختياري)</label><div class="mrow"><textarea id="h_note" rows="2">${h?esc(h.note||''):''}</textarea><button type="button" class="mic" data-act="mic" data-for="h_note" aria-label="إملاء صوتي">🎤</button></div>
            <div class="acts"><button class="btn" data-act="hsave" data-id="${id||''}" data-sid="${psid||''}">💾 حفظ</button>${h?`<button class="btn danger" data-act="hdel" data-id="${id}">🗑️ حذف</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }
          const _ec9=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'hseg':S.hseg=d.v;render();return;
              case 'hadd':hModal('',d.sid);return;
              case 'hedit':hModal(d.id);return;
              case 'hsave':{
                const dis=$('#h_dis').value.trim(),kind=$('#h_kind').value,note=$('#h_note').value.trim();
                if(!dis){toast('اكتب نوع المرض');return;}
                if(d.id){const h=db.health.find(x=>x.id===d.id);Object.assign(h,{kind,dis,note});}
                else{const sid=d.sid||$('#h_sid').value;if(!sid){toast('اختر التلميذ');return;}if(db.health.some(x=>x.sid===sid)){toast('هذا التلميذ مسجّل من قبل');return;}db.health.push({id:uid(),sid,kind,dis,note});}
                save();closeM();render();return;
              }
              case 'hdel':db.health=db.health.filter(x=>x.id!==d.id);save();closeM();render();return;
              case 'hpdf':{
                const L=hItems();let doc,nm;
                if(d.k==='l'){doc=hListDoc();nm='قائمة-الحالات-الصحية';}
                else if(d.k==='n'){doc=hNoticeDoc(L.filter(o=>o.h.id===d.id));nm='إشعار-حالة-صحية';}
                else if(d.k==='na'){doc=hNoticeDoc(L);nm='إشعارات-الحالات-الصحية';}
                else if(d.k==='u'){doc=hLevelDoc([+d.v]);nm='قائمة-موحدة-مستوى-'+d.v;}
                else{doc=hLevelDoc(hLevels());nm='قائمة-موحدة-كل-المستويات';}
                toast('جاري إنشاء PDF…');
                htmlToPdf(doc).then(b=>download(nm+'.pdf',b,'application/pdf')).then(ok=>{if(ok) toast('تم إنشاء الملف');}).catch(()=>toast('تعذّر إنشاء PDF'));return;
              }
            }
            _ec9(a,d,el,e);
          };
          const _ecg9=extraChange;
          extraChange=function(t){
            if(t.id==='h_cls'){const q=$('#h_sid');q.innerHTML='<option value="">—</option>'+studentsOf(t.value).map(s=>`<option value="${s.id}">${esc(nameOf(s))}</option>`).join('');return;}
            if(t.id==='h_sel'){S.hsel=t.value;render();return;}
            if(t.id==='h_lv'){S.hlv=+t.value;render();return;}
            _ecg9(t);
          };

          document.addEventListener('input',e=>{const t=e.target;if(t.id==='h_q'){S.hq=t.value;render();const q=$('#h_q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}});

          render();

          </script>
          </body>
          </html>
          EOF_HTML

      - name: Install
        run: |
          npm install
          npm install @capacitor-community/speech-recognition@^6.0.0 || echo "speech plugin skipped"

      - name: Add Android
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

