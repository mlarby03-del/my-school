            <div class="acts"><button class="btn danger" data-act="delstu" data-sid="${sid}">🗑️ حذف التلميذ</button><button class="btn" data-act="closem">إغلاق</button></div>`);
          }

          /* ---------- استدعاء الولي ---------- */
          function times(n){return n===1?'مرة واحدة':n===2?'مرتين':n<=10?n+' مرات':n+' مرة';}
          function parentMsg(s,why){
            const c=counts()[s.id]||zero(),m=s.sex!=='أنثى',kid=m?'ابنكم':'ابنتكم',nm=nameOf(s);
            if(why==='auto'){why=['late','abs','book','bad','conv','rpt'].sort((a,b)=>c[b]-c[a])[0];if(!c[why]) why='gen';}
            let t;
            if(why==='late') t=`نعلمكم أن ${kid} ${nm} ${m?'تأخر':'تأخرت'} ${times(c.late)}. المرجو الحضور إلى الإدارة.`;
            else if(why==='abs') t=`نعلمكم أن ${kid} ${nm} ${m?'غاب':'غابت'} ${times(c.abs)}. المرجو الحضور إلى الإدارة لتبرير الغياب.`;
            else if(why==='book') t=`نعلمكم أن ${kid} ${nm} ${m?'لم يحضر':'لم تحضر'} دفتر المراسلة ${times(c.book)}. المرجو المتابعة.`;
            else if(why==='bad') t=`نعلمكم أنه سُجّلت على ${kid} ${nm} ${c.bad} ملاحظات سلوكية. المرجو الحضور إلى الإدارة.`;
            else if(why==='conv'||why==='rpt') t=`نعلمكم أنه تم استدعاؤكم بخصوص ${kid} ${nm}. المرجو الحضور إلى الإدارة.`;
            else t=`المرجو الحضور إلى الإدارة بخصوص ${kid} ${nm}.`;
            return 'السلام عليكم، '+t+'\n'+SCHOOL;
          }
          function waNum(p){
            let d=String(p||'').replace(/\D/g,'');
            if(d.startsWith('00')) d=d.slice(2);
            else if(d.startsWith('0')) d='213'+d.slice(1);
            else if(/^[567]\d{8}$/.test(d)) d='213'+d;
            return d.length>=9?d:'';
          }
          function pmLinks(){
            const box=$('#pmlinks');if(!box) return;
            const ph=$('#pm_phone').value,tx=$('#pm_text').value,wa=waNum(ph),tel=ph.replace(/[^\d+]/g,'');
            box.innerHTML=!wa?'<p class="muted">أدخل رقم هاتف الولي لتفعيل الأزرار.</p>':
              `<a class="btn" data-plog="call" data-sid="${esc(box.dataset.sid||'')}" href="tel:${esc(tel)}">📞 اتصال مباشر</a><a class="btn" href="https://wa.me/${wa}?text=${encodeURIComponent(tx)}" target="_blank" rel="noopener" data-plog="wa" data-sid="${esc(box.dataset.sid||'')}">💬 واتساب</a><a class="btn ghost" data-plog="sms" data-sid="${esc(box.dataset.sid||'')}" href="sms:${esc(tel)}?body=${encodeURIComponent(tx)}">✉️ SMS</a>`;
          }
          function parentModal(sid){
            const s=byId(sid);if(!s) return;
            modal(`<h3>📞 استدعاء الولي</h3><p class="muted">${esc(nameOf(s))} · ${esc(s.cls)}${s.father?' · الأب: '+esc(s.father):''}</p>
            <label>رقم هاتف الولي (يُحفظ تلقائيا)</label><input id="pm_phone" type="tel" inputmode="tel" dir="ltr" value="${esc(s.phone||'')}" data-sid="${sid}" autocomplete="off">
            <label>سبب الاستدعاء</label><select id="pm_why" data-sid="${sid}"><option value="auto">تلقائي (الأكثر تكرارا)</option>${Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k].nav}</option>`).join('')}<option value="gen">عام</option></select>
            <label>أو اختر قالبا <button type="button" class="btn ghost sm" data-act="tpl" data-back="${sid}" style="padding:2px 8px;font-size:12px">✏️ تعديل القوالب</button></label><select id="pm_tpl" data-sid="${sid}"><option value="">—</option>${db.templates.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select>
            <label>نص الرسالة (تقدر تعدله)</label><textarea id="pm_text" rows="5">${esc(parentMsg(s,'auto'))}</textarea>
            <div id="pmlinks" class="acts" data-sid="${sid}"></div>
            <div class="acts"><button class="btn ghost" data-act="stu" data-sid="${sid}">→ بطاقة التلميذ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            pmLinks();
          }

          /* ---------- التنبيهات الذكية ---------- */
          function alertList(){
            const st=db.settings,c={};
            recsP().forEach(r=>{
              if(r.type!=='late'&&r.type!=='abs') return;
              const o=c[r.sid]||(c[r.sid]={late:0,abs:0,j:0,uj:0});
              if(r.type==='late') o.late++; else{o.abs++;if(r.just) o.j++; else o.uj++;}
            });
            return Object.keys(c).filter(k=>byId(k)&&(c[k].late>=st.lateMax||c[k].uj>=st.absMax)).map(k=>({s:byId(k),...c[k]})).sort((a,b)=>(b.late+b.uj)-(a.late+a.uj));
          }
          function alertsHtml(){
            if(!db.records.length) return '';
            const L=alertList(),st=db.settings,show=S.alertAll?L:L.slice(0,5);
            return `<div class="alerts"><div class="ah"><b>⚠️ تنبيهات (${L.length})</b><button class="btn ghost sm" data-act="alertcfg">⚙️ الحدود</button></div>`+
              (L.length?show.map(o=>`<button class="row" data-act="stu" data-sid="${o.s.id}"><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)}</small></span><span class="rc hot">⏰${o.late} · 🚫${o.abs}${o.j?' ('+o.j+' مبرر)':''}</span></button>`).join('')+(L.length>5?`<button class="btn ghost sm" data-act="alertall" style="margin:8px 12px">${S.alertAll?'إخفاء':'عرض الكل ('+L.length+')'}</button>`:''):
              `<p class="muted pad" style="padding-top:4px">لا أحد بلغ الحد (${st.lateMax} تأخرات أو ${st.absMax} غيابات غير مبررة).</p>`)+`</div>`;
          }
          function alertCfg(){
            modal(`<h3>⚙️ حدود التنبيه</h3><p class="muted">يظهر التلميذ في التنبيهات عندما يبلغ أحد الحدّين في الفترة المختارة.</p>
            <label>عدد التأخرات</label><input id="a_late" type="number" min="1" inputmode="numeric" value="${db.settings.lateMax}">
            <label>عدد الغيابات غير المبررة</label><input id="a_abs" type="number" min="1" inputmode="numeric" value="${db.settings.absMax}">
            <div class="acts"><button class="btn" data-act="alertsave">حفظ</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }

          /* ---------- الكشوف: يومي وشهري ---------- */
          function dayData(date,cls){
            const out={abs:{},late:{},book:{},bad:{}};
            db.records.filter(r=>r.date===date&&out[r.type]).forEach(r=>{
              const s=byId(r.sid);if(!s||(cls&&s.cls!==cls)) return;
              (out[r.type][s.cls]=out[r.type][s.cls]||[]).push({s,r});
            });
            return out;
          }
          const DNAMES={abs:'الغيابات',late:'التأخرات',book:'دفتر المراسلة (لم يُحضر)',bad:'المشاغبون'};
          function dailyText(date,cls){
            const D=dayData(date,cls);
            let t=`كشف يوم ${fmtDate(date)}${cls?' — القسم '+cls:''}\n${SCHOOL}\n`;
            for(const k of ['abs','late','book','bad']){
              const cl=Object.keys(D[k]).sort(cmpNat),tot=cl.reduce((n,c)=>n+D[k][c].length,0);
              t+=`\n${DNAMES[k]} (${tot})\n`;
              if(!tot){t+='— لا يوجد\n';continue;}
              cl.forEach(c=>{t+=c+': '+D[k][c].sort((a,b)=>cmpName(a.s,b.s)).map(x=>nameOf(x.s)+(k==='late'&&x.r.time?' ('+x.r.time+')':'')+(k==='abs'&&x.r.just?' (مبرر)':'')).join('، ')+'\n';});
            }
            return t.trim();
          }
          function dailyRows(date,cls){
            const D=dayData(date,cls),rows=[['القسم','اللقب','الاسم','النوع','الوقت','الحالة / ملاحظة']];
            for(const k of ['abs','late','book','bad']) Object.keys(D[k]).sort(cmpNat).forEach(c=>D[k][c].sort((a,b)=>cmpName(a.s,b.s)).forEach(x=>rows.push([c,x.s.last,x.s.first,TYPES[k].nav,x.r.time||'',(k==='abs'?(x.r.just?'مبرر':'غير مبرر'):'')+(x.r.note?(k==='abs'?' — ':'')+x.r.note:'')])));
            return rows;
          }
          function monthData(ym,cls){
            const m={};
            db.records.filter(r=>r.date.slice(0,7)===ym).forEach(r=>{
              const s=byId(r.sid);if(!s||(cls&&s.cls!==cls)) return;
              const o=m[s.id]||(m[s.id]={s,abs:0,j:0,late:0,book:0,bad:0,conv:0,rpt:0});
              if(r.type==='abs'){o.abs++;if(r.just) o.j++;} else o[r.type]++;
            });
            return Object.values(m).sort((a,b)=>b.abs-a.abs||b.late-a.late||cmpName(a.s,b.s));
          }
          function monthRows(ym,cls){
            const rows=[['الترتيب','اللقب','الاسم','القسم','الغيابات','منها مبررة','غير مبررة','التأخرات','دفتر المراسلة','المشاغبة','الاستدعاءات','التقارير']];
            monthData(ym,cls).forEach((o,i)=>rows.push([i+1,o.s.last,o.s.first,o.s.cls,o.abs,o.j,o.abs-o.j,o.late,o.book,o.bad,o.conv,o.rpt]));
            return rows;
          }
          function viewKash(){
            const seg=`<div class="seg"><button class="${S.rtab==='day'?'on':''}" data-act="rtab" data-v="day">كشف يومي</button><button class="${S.rtab==='month'?'on':''}" data-act="rtab" data-v="month">كشف شهري</button><button class="${S.rtab==='cmp'?'on':''}" data-act="rtab" data-v="cmp">مقارنة الأقسام</button></div>`;
            if(!db.students.length) return seg+emptyState();
            if(S.rtab==='cmp') return seg+viewCmp();
            if(S.rtab==='day'){
              const txt=dailyText(S.rdate,S.rcls);
              return seg+`<div class="bar"><input type="date" id="r_date" value="${S.rdate}"><select id="r_cls2">${classOptions(S.rcls,'كل الأقسام')}</select></div>
              <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="rcopy">📋 نسخ النص</button><button class="btn sm ghost" data-act="rwa">📤 إرسال</button><button class="btn sm ghost" data-act="rxlsx">⬇️ Excel</button></div>
              <div class="rtxt">${esc(txt)}</div>`;
            }
            const L=monthData(S.rmonth,S.rcls),ta=L.reduce((n,o)=>n+o.abs,0),tl=L.reduce((n,o)=>n+o.late,0);
            return seg+`<div class="bar"><input type="month" id="r_month" value="${S.rmonth}"><select id="r_cls2">${classOptions(S.rcls,'كل الأقسام')}</select></div>
            <div class="sum"><span>${L.length} تلميذ · غيابات <b>${ta}</b> · تأخرات <b>${tl}</b></span><button class="btn sm ghost" data-act="mxlsx">⬇️ Excel</button></div>`+
            (L.length?L.map((o,i)=>`<button class="row" data-act="stu" data-sid="${o.s.id}"><span class="no">${i+1}</span><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)}${o.j?' · '+o.j+' غياب مبرر':''}</small></span><span class="rc ${o.abs>=5?'hot':''}">🚫${o.abs}</span><span class="rc ${o.late>=3?'hot':''}">⏰${o.late}</span></button>`).join(''):'<p class="muted pad">لا توجد تسجيلات في هذا الشهر</p>');
          }
          async function copyText(t){
            try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);return true;}}catch(e){}
            const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();
            let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();return ok;
          }

          /* ---------- ملف Excel (xlsx) ---------- */
          const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
          function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
          function concatU8(chunks){let n=0;chunks.forEach(c=>n+=c.length);const o=new Uint8Array(n);let p=0;chunks.forEach(c=>{o.set(c,p);p+=c.length;});return o;}
          function zipStore(files){
            const enc=new TextEncoder(),chunks=[],cen=[],now=new Date();
            const time=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),date=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
            let off=0;
            files.forEach(f=>{
              const name=enc.encode(f.name),data=f.data,crc=crc32(data);
              const lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);
              v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(10,time,true);v.setUint16(12,date,true);
              v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);lh.set(name,30);
              chunks.push(lh,data);
              const ch=new Uint8Array(46+name.length),w=new DataView(ch.buffer);
              w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint16(12,time,true);w.setUint16(14,date,true);
              w.setUint32(16,crc,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,off,true);ch.set(name,46);
              cen.push(ch);off+=lh.length+data.length;
            });
            let cs=0;cen.forEach(c=>{chunks.push(c);cs+=c.length;});
            const e=new Uint8Array(22),x=new DataView(e.buffer);
            x.setUint32(0,0x06054b50,true);x.setUint16(8,files.length,true);x.setUint16(10,files.length,true);x.setUint32(12,cs,true);x.setUint32(16,off,true);chunks.push(e);
            return concatU8(chunks);
          }
          const colL=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
          const xe=s=>String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          function makeXlsx(sheets){
            const enc=new TextEncoder(),F=(n,s)=>({name:n,data:enc.encode(s)});
            const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
            const files=[
              F('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'),
              F('_rels/.rels',H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
              F('xl/workbook.xml',H+`<workbook xmlns="${NS}" xmlns:r="${R}"><sheets>`+sheets.map((s,i)=>`<sheet name="${xe(String(s.name).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'),
              F('xl/_rels/workbook.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`),
              F('xl/styles.xml',H+`<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`)
            ];
            sheets.forEach((s,i)=>{
              const w=Math.max(1,...s.rows.map(r=>r.length));
              let x=H+`<worksheet xmlns="${NS}"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols><col min="1" max="${w}" width="20" customWidth="1"/></cols><sheetData>`;
              s.rows.forEach((r,ri)=>{
                x+=`<row r="${ri+1}">`;
                r.forEach((v,ci)=>{
                  if(v===''||v==null) return;
                  const ref=colL(ci)+(ri+1),st=ri===0?' s="1"':'';
                  x+=typeof v==='number'?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
                });
                x+='</row>';
              });
              files.push(F(`xl/worksheets/sheet${i+1}.xml`,x+'</sheetData></worksheet>'));
            });
            return zipStore(files);
          }
          const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

          /* ---------- ملف التلميذ و PDF ---------- */
          function fileDoc(sid,imgs,w){
            const s=byId(sid),p=curPeriod(),c=counts()[sid]||zero();
            const recs=recsP().filter(r=>r.sid===sid).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
            const aj=recs.filter(r=>r.type==='abs'&&r.just).length;
