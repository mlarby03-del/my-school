            (rec.length?`<h3>أُضيفوا الآن</h3>`+rec.map(s=>stRow(s,cnt,true)).join(''):'');
          }
          function addNew(){
            const last=$('#n_last').value.trim(),first=$('#n_first').value.trim();
            let cls=$('#n_cls').value;if(cls==='__new') cls=$('#n_newcls').value.trim();
            if(!(last||first)){toast('اكتب لقب التلميذ واسمه');return;}
            if(!cls){toast('اختر القسم');return;}
            const k=norm(cls)+'|'+norm(last)+'|'+norm(first);
            if(db.students.some(s=>norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first)===k)){toast('هذا التلميذ موجود مسبقا في القسم');return;}
            const st={id:uid(),last,first,cls};
            db.students.push(st);S.recent.unshift(st.id);S.ncls=cls;save();render();
            toast('تمت إضافة '+nameOf(st)+' إلى '+cls);
            setTimeout(()=>{const e=$('#n_last');if(e)e.focus();},50);
