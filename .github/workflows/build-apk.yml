              <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="rcopy">📋 نسخ النص</button><button class="btn sm ghost" data-act="rwa">📤 إرسال</button><button class="btn sm ghost" data-act="rxlsx">⬇️ Excel</button></div>
