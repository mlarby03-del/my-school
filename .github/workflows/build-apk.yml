            if(!S.q.trim()) return h+`<p class="muted pad">اكتب اسم التلميذ، ثم المسه لتسجيل غياب أو تأخر أو غيره، وتشوف كم مرة تأخر.</p><div class="pad"><button class="btn" data-act="rep">📊 التلاميذ المتكررون (تأخر/غياب)</button></div>`;
