          const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

          /* ---------- ملف التلميذ و PDF ---------- */
          function fileDoc(sid,imgs,w){
            const s=byId(sid),p=curPeriod(),c=counts()[sid]||zero();
            const recs=recsP().filter(r=>r.sid===sid).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
            const aj=recs.filter(r=>r.type==='abs'&&r.just).length,lj=recs.filter(r=>r.type==='late'&&r.just).length,cc=recs.filter(r=>r.type==='conv'&&r.came).length;
            const bd=/^\d{4}-\d\d-\d\d$/.test(s.birth||'')?fmtDate(s.birth):(s.birth||'');
            const id=[['اللقب والاسم',nameOf(s)],['القسم',s.cls],['الجنس',s.sex],['تاريخ الميلاد',bd],['مكان الميلاد',s.birthPlace],['الصفة',s.status],['اسم الأب',s.father],['الأم',motherName(s)],['العنوان',s.address],['هاتف الولي',s.phone]].filter(x=>x[1]);
            const det=r=>{
