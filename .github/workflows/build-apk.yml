              cl.forEach(c=>{t+=c+': '+D[k][c].sort((a,b)=>cmpName(a.s,b.s)).map(x=>nameOf(x.s)+((k==='late'||k==='late10')&&x.r.time?' ('+x.r.time+')':'')+((k==='abs'||k==='late')&&x.r.shift&&!S.rshift?' ['+(x.r.shift==='ص'?'صباحا':'مساء')+']':'')+((k==='abs'||k==='late')&&x.r.just?' (مبرر)':'')).join('، ')+'\n';});
            }
            return t.trim();
          }
          function dailyRows(date,cls){
            const D=dayData(date,cls),rows=[['القسم','اللقب','الاسم','النوع','الفترة','الوقت','الحالة / ملاحظة']];
            for(const k of ['abs','late','late10','esc','book','bad']) Object.keys(D[k]).sort(cmpNat).forEach(c=>D[k][c].sort((a,b)=>cmpName(a.s,b.s)).forEach(x=>rows.push([c,x.s.last,x.s.first,TYPES[k].nav,x.r.shift==='ص'?'صباحية':x.r.shift==='م'?'مسائية':'',x.r.time||'',((k==='abs'||k==='late')?(x.r.just?'مبرر':'غير مبرر'):'')+(x.r.note?((k==='abs'||k==='late')?' — ':'')+x.r.note:'')])));
            return rows;
          }
          function monthData(ym,cls){
            const m={};
            db.records.filter(r=>r.date.slice(0,7)===ym).forEach(r=>{
              const s=byId(r.sid);if(!s||(cls&&s.cls!==cls)) return;
              const o=m[s.id]||(m[s.id]={s,abs:0,j:0,late:0,lj:0,late10:0,book:0,bad:0,conv:0,rpt:0});
              if(r.type==='abs'){o.abs++;if(r.just) o.j++;} else{o[r.type]++;if(r.type==='late'&&r.just) o.lj++;}
            });
            return Object.values(m).sort((a,b)=>b.abs-a.abs||b.late-a.late||cmpName(a.s,b.s));
          }
          function monthRows(ym,cls){
            const rows=[['الترتيب','اللقب','الاسم','القسم','الغيابات','منها مبررة','غير مبررة','التأخرات','منها مبررة','تأخر العاشرة','دفتر المراسلة','المشاغبة','الاستدعاءات','التقارير']];
            monthData(ym,cls).forEach((o,i)=>rows.push([i+1,o.s.last,o.s.first,o.s.cls,o.abs,o.j,o.abs-o.j,o.late,o.lj,o.late10,o.book,o.bad,o.conv,o.rpt]));
            return rows;
          }
          function viewKash(){
