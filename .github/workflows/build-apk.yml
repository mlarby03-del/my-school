            r.innerHTML=res.map(s=>`<button class="btn ghost sm" style="display:block;width:100%;margin:2px 0;text-align:right" data-act="rqpick" data-sid="${s.id}">${esc(nameOf(s))} — ${esc(s.cls)}</button>`).join('');
