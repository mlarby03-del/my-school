          function DEF_TPL(){return [
           {id:'t1',name:'تأخر',text:'السلام عليكم، نعلمكم أن {الابن} {الاسم} {تأخر} {تأخرات}. المرجو الحضور إلى الإدارة.'},
           {id:'t2',name:'غياب',text:'السلام عليكم، نعلمكم أن {الابن} {الاسم} {غاب} {غيابات}. المرجو الحضور إلى الإدارة لتبرير الغياب.'},
           {id:'t3',name:'سلوك',text:'السلام عليكم، نعلمكم أنه سُجّلت على {الابن} {الاسم} ملاحظات سلوكية. المرجو الحضور إلى الإدارة.'},
           {id:'t4',name:'دفتر المراسلة',text:'السلام عليكم، نذكّركم بضرورة إحضار {الابن} {الاسم} لدفتر المراسلة وتوقيعه.'},
           {id:'t5',name:'اجتماع أولياء',text:'السلام عليكم، ندعوكم لحضور اجتماع الأولياء بالمؤسسة. يوم: … على الساعة: …'},
           {id:'t6',name:'شكر وتشجيع',text:'السلام عليكم، يسعدنا إبلاغكم بتحسن ملحوظ في سلوك {الابن} {الاسم}. شكرا لتعاونكم.'}];}
          function fillTpl(txt,s){
            const c=counts()[s.id]||zero(),m=s.sex!=='أنثى';
            const map={'الاسم':nameOf(s),'القسم':s.cls,'الابن':m?'ابنكم':'ابنتكم','تأخر':m?'تأخر':'تأخرت','غاب':m?'غاب':'غابت','تأخرات':times(c.late),'غيابات':times(c.abs),'الأب':s.father||'','الأم':motherName(s)};
            return txt.replace(/\{([^}]+)\}/g,(x,k)=>k in map?map[k]:x)+'\n'+SCHOOL;
          }
          function tplModal(back){
            modal(`<h3>✉️ قوالب الرسائل</h3><p class="muted">المتغيرات: {الاسم} {القسم} {الابن} {تأخر} {غاب} {تأخرات} {غيابات} {الأب} {الأم}. تُستبدل تلقائيا بقيمها عند الإرسال.</p>
            ${db.templates.map((t,i)=>`<div class="prev"><input id="tn${i}" value="${esc(t.name)}" placeholder="اسم القالب"><textarea id="tt${i}" rows="3">${esc(t.text)}</textarea><button class="btn danger sm" data-act="tpldel" data-i="${i}" data-back="${back||''}">🗑️ حذف</button></div>`).join('')}
            <div class="acts"><button class="btn ghost" data-act="tpladd" data-back="${back||''}">➕ قالب جديد</button><button class="btn" data-act="tplsave" data-back="${back||''}">حفظ</button><button class="btn ghost" data-act="tplreset" data-back="${back||''}">استرجاع الافتراضي</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }
          function tplCollect(){db.templates.forEach((t,i)=>{const n=$('#tn'+i),x=$('#tt'+i);if(n) t.name=n.value.trim()||'قالب';if(x) t.text=x.value;});save();}
          function tplDone(back){if(back){parentModal(back);}else closeM();}

          /* ---------- سجل الاتصالات والزيارات ---------- */
          const HOW={call:'📞 اتصال',wa:'💬 واتساب',sms:'✉️ SMS',visit:'🏫 زيارة الولي للإدارة',other:'📝 أخرى'};
          const cOf=sid=>db.contacts.filter(x=>x.sid===sid).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
          function logContact(sid,how,note){db.contacts.push({id:uid(),sid,date:todayStr(),time:nowHM(),how,note:note||''});save();}
          function contactsModal(sid){
            const s=byId(sid);if(!s) return;
            modal(`<h3>📒 اتصالات وزيارات الولي</h3><p class="muted">${esc(nameOf(s))} · ${esc(s.cls)}</p>
            <div class="hl">${cOf(sid).map(x=>`<div class="row hr"><span class="sub">${fmtDate(x.date)} ${esc(x.time||'')}</span><span class="nm">${HOW[x.how]||x.how}</span><span class="st" style="color:var(--tx);font-weight:400">${esc(x.note||'')}</span><button class="x" data-act="cdel" data-id="${x.id}" data-sid="${sid}" aria-label="حذف">✕</button></div>`).join('')||'<p class="muted">لا توجد اتصالات مسجلة</p>'}</div>
            <h3 style="font-size:15px;margin-top:14px">تسجيل جديد</h3>
            <select id="cx_how">${Object.keys(HOW).map(k=>`<option value="${k}">${HOW[k]}</option>`).join('')}</select>
            <label>ما قيل / الاتفاق</label><div class="mrow"><textarea id="cx_note" rows="3" placeholder="مثال: وعد بإحضار شهادة طبية غدا"></textarea><button type="button" class="mic" data-act="mic" data-for="cx_note" aria-label="إملاء صوتي">🎤</button></div>
            <div class="acts"><button class="btn" data-act="cadd" data-sid="${sid}">تسجيل</button><button class="btn ghost" data-act="stu" data-sid="${sid}">→ بطاقة التلميذ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }

          /* ---------- سنة دراسية جديدة ---------- */
          function yearPlan(){
            const up=[],grad=[],keep=[];
            classes().forEach(c=>{
              const m=/^(\d)\s*م(.*)$/.exec(c),n=m?+m[1]:levelOf(c);
              if(n===4) grad.push(c); else if(m&&n>=1&&n<4) up.push([c,(n+1)+'م'+m[2]]); else keep.push(c);
            });
            return {up,grad,keep};
          }
          function yearModal(){
            const P=yearPlan(),cnt=cs=>cs.reduce((n,c)=>n+db.students.filter(s=>s.cls===c).length,0);
            modal(`<h3>🎓 سنة دراسية جديدة</h3>
            <p class="muted">سيُنقل التلاميذ إلى المستوى الموالي (1م1 ← 2م1 …). تلاميذ الرابعة (${cnt(P.grad)}) يُحذفون لأنهم غادروا المتوسطة. وتُمسح التسجيلات والاتصالات والفترات والصور لتبدأ بقوائم نظيفة. التلاميذ الجدد في الأولى تستوردهم من Excel بعد ذلك.</p>
            <div class="prev">ينتقل: <b>${cnt(P.up.map(x=>x[0]))}</b> تلميذ · يُحذف (الرابعة): <b>${cnt(P.grad)}</b> · لا يتغير (اسم غير معروف): <b>${cnt(P.keep)}</b>${P.keep.length?' ('+P.keep.map(esc).join('، ')+')':''}</div>
            <p class="warn">⚠️ لا رجوع بعد التأكيد. المعطيات القديمة تبقى فقط في ملف النسخة الاحتياطية، فاحفظها أولا.</p>
            <div class="menu"><button class="btn" data-act="bkwa">📤 حفظ / إرسال نسخة كاملة الآن</button></div>
            <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="y_ok" style="width:auto;margin:0"> حفظت النسخة الاحتياطية وأريد المتابعة</label>
            <div class="acts"><button class="btn danger" data-act="yearGo">🎓 بدء السنة الجديدة</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }
          async function yearGo(){
            if(!$('#y_ok')||!$('#y_ok').checked){toast('أكّد أولا أنك حفظت نسخة احتياطية');return;}
            const P=yearPlan(),mp=new Map(P.up),gr=new Set(P.grad);
            db.students=db.students.filter(s=>!gr.has(s.cls));
            db.students.forEach(s=>{if(mp.has(s.cls)) s.cls=mp.get(s.cls);});
            await photoClear();Object.keys(purl).forEach(k=>delete purl[k]);
            db.records=[];db.contacts=[];db.periods=[];db.curP='';db.levels={};
            save();closeM();S.lcls='';S.cls='';S.tab='lists';render();toast('بدأت السنة الجديدة: '+db.students.length+' تلميذ');
          }

          /* ---------- مشاركة نص (واتساب / مسنجر …) ---------- */
          async function shareText(t){
            try{
              const C=window.Capacitor;
              if(C&&C.isNativePlatform&&C.isNativePlatform()){await plug('Share').share({text:t,dialogTitle:'إرسال عبر'});return;}
              if(navigator.share){await navigator.share({text:t});return;}
            }catch(e){if(/cancel|abort|dismiss/i.test(String(e&&(e.name||e.message)))) return;}
            window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
          }
          document.addEventListener('click',e=>{const a=e.target.closest('a[data-plog]');if(a) logContact(a.dataset.sid,a.dataset.plog,'');});

          /* ---------- ربط الأحداث ---------- */
          function extraClick(a,d,el,e){
            switch(a){
              case 'mic':micFor(d.for);break;
              case 'parent':parentModal(d.sid);break;
              case 'sfile':closeM();S.sfile=d.sid;render();window.scrollTo(0,0);break;
              case 'sfileback':S.sfile='';render();break;
              case 'sfilepdf':filePdf();break;
              case 'recinfo':S.recFrom=d.from||'stu';recModal(d.rid);break;
              case 'recsave':{recCollect(d.rid);const r=db.records.find(x=>x.id===d.rid);closeM();render();if(S.recFrom==='stu'&&r) stuModal(r.sid);break;}
              case 'recdel':{const r=db.records.find(x=>x.id===d.rid),sid=r&&r.sid;dropRec(d.rid);save();closeM();render();if(S.recFrom==='stu'&&sid) stuModal(sid);break;}
              case 'recshoot':{recCollect(d.rid);S.ptarget=d.rid;const i=$('#pcam');i.value='';i.click();break;}
              case 'recgallery':{recCollect(d.rid);S.ptarget=d.rid;const i=$('#pgal');i.value='';i.click();break;}
              case 'recphotodel':{recCollect(d.rid);const r=db.records.find(x=>x.id===d.rid);if(r){r.photos=(r.photos||[]).filter(x=>x!==d.pid);if(!r.photos.length) delete r.photos;photoDel(d.pid);save();}recModal(d.rid);break;}
              case 'period':periodModal();break;
              case 'pset':case 'pdel':case 'padd':case 'pnew':case 'pyear':periodAct(a,d);break;
              case 'alertall':S.alertAll=!S.alertAll;render();break;
              case 'alertcfg':alertCfg();break;
              case 'alertsave':{db.settings.lateMax=Math.max(1,+$('#a_late').value||3);db.settings.absMax=Math.max(1,+$('#a_abs').value||5);save();closeM();render();break;}
              case 'rtab':S.rtab=d.v;render();break;
              case 'rcopy':copyText(dailyText(S.rdate,S.rcls)).then(ok=>toast(ok?'تم نسخ الكشف':'تعذّر النسخ'));break;
              case 'rwa':shareText(dailyText(S.rdate,S.rcls));break;
              case 'rxlsx':download('كشف-يوم-'+S.rdate+'.xlsx',makeXlsx([{name:'كشف اليوم',rows:dailyRows(S.rdate,S.rcls)}]),XLSX_MIME);break;
              case 'ccopy':copyText(cmpText()).then(ok=>toast(ok?'تم نسخ المقارنة':'تعذّر النسخ'));break;
              case 'cwa':shareText(cmpText());break;
              case 'cxlsx':download('مقارنة-الأقسام-'+todayStr()+'.xlsx',makeXlsx([{name:'مقارنة الأقسام',rows:cmpRows()}]),XLSX_MIME);break;
              case 'bkwa':shareBackup(true);break;
              case 'bkwa2':shareBackup(false);break;
              case 'contacts':contactsModal(d.sid);break;
              case 'cadd':{const n=$('#cx_note').value.trim();logContact(d.sid,$('#cx_how').value,n);contactsModal(d.sid);toast('تم التسجيل');break;}
              case 'cdel':db.contacts=db.contacts.filter(x=>x.id!==d.id);save();contactsModal(d.sid);break;
              case 'tpl':tplModal(d.back);break;
              case 'tpladd':tplCollect();db.templates.push({id:uid(),name:'قالب جديد',text:'السلام عليكم، '});save();tplModal(d.back);break;
              case 'tpldel':tplCollect();db.templates.splice(+d.i,1);save();tplModal(d.back);break;
              case 'tplsave':tplCollect();toast('تم الحفظ');tplDone(d.back);break;
              case 'tplreset':db.templates=DEF_TPL();save();tplModal(d.back);break;
              case 'yearopen':yearModal();break;
              case 'yearGo':yearGo();break;
              case 'mxlsx':download('كشف-شهر-'+S.rmonth+'.xlsx',makeXlsx([{name:'كشف الشهر',rows:monthRows(S.rmonth,S.rcls)}]),XLSX_MIME);break;
            }
          }
          function extraChange(t){
            const id=t.id;
            if(id==='ltime') S.ltime=t.value;
            else if(id==='pm_phone'){const s=byId(t.dataset.sid);if(s){s.phone=t.value.trim();if(!s.phone) delete s.phone;save();}pmLinks();}
            else if(id==='pm_tpl'){const s=byId(t.dataset.sid),tp=db.templates[+t.value];if(s&&tp){$('#pm_text').value=fillTpl(tp.text,s);pmLinks();}}
            else if(id==='pm_why'){const s=byId(t.dataset.sid);if(s){$('#pm_text').value=parentMsg(s,t.value);pmLinks();}}
            else if(id==='c_r'){S.cmpR=t.value;render();}
            else if(id==='c_s'){S.cmpS=t.value;render();}
            else if(id==='r_date'){S.rdate=t.value||todayStr();render();}
            else if(id==='r_cls2'){S.rcls=t.value;render();}
            else if(id==='r_month'){S.rmonth=t.value||todayStr().slice(0,7);render();}
          }

          render();

          </script>
          </body>
          </html>
          EOF_HTML

      - name: Install
        run: |
          npm install
          npm install @capacitor-community/speech-recognition@^6.0.0 || echo "speech plugin skipped"

      - name: Add Android
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

