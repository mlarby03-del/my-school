            const rowTot=(t,lab)=>`<tr style="background:#cfcfcf;font-weight:bold"><td>${lab}</td>${cell(t.n)}${cell(t.as)}${cell(t.ad)}${cell(t.aj)}${cell(t.ad-t.aj)}<td>${f2(t.rate)}</td>${cell(t.late)}${cell(t.lj)}${cell(t.late10)}${cell(t.wc)}${cell(t.yard)}${cell(t.esc)}</tr>`;
            const tb=d.lv.map(x=>x.g.map(rowCls).join('')+rowTot(x.t,'مجموع '+x.l+' م')).join('')+rowTot(d.T,'المؤسسة');
            const top=(L,f)=>`<table><tr><th style="width:24px">#</th><th>التلميذ</th><th style="width:44px">القسم</th><th style="width:44px">العدد</th></tr>${L.length?L.map((o,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${P(nameOf(o.s))}</td><td>${P(o.s.cls)}</td><td>${f(o)}</td></tr>`).join(''):'<tr><td colspan="4"><b>لا يوجد</b></td></tr>'}</table>`;
            const tch=`<table><tr><th style="width:24px">#</th><th>الأستاذ</th><th style="width:90px">المادة</th><th style="width:60px">أيام الغياب</th><th style="width:70px">دروس لم تقدم</th></tr>${d.tch.length?d.tch.map((o,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${P(o.name)}</td><td>${P(o.subj)}</td><td>${o.d}</td><td>${o.les}</td></tr>`).join(''):'<tr><td colspan="5"><b>لا يوجد</b></td></tr>'}</table>`;
            const ev=(a)=>`غياب: <b>${d.cnt(a,'abs')}</b> · تأخر: <b>${d.cnt(a,'late')}</b> · خروج استثنائي: <b>${d.cnt(a,'exit')}</b>`;
            return `<div class="ms" dir="rtl">${css}
