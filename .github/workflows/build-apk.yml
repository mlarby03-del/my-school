          /* ---------- الكشوف: يومي وشهري ---------- */
          function dayData(date,cls){
            const out={abs:{},late:{},late10:{},esc:{},book:{},bad:{}};
            db.records.filter(r=>r.date===date&&out[r.type]&&(!S.rshift||r.shift===S.rshift)).forEach(r=>{
              const s=byId(r.sid);if(!s||(cls&&s.cls!==cls)) return;
