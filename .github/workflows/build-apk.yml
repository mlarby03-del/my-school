              else if(r.type==='conv'||r.type==='rpt') t=[r.type==='conv'?(r.came?'حضر الولي'+(r.cdate?' '+fmtDate(r.cdate):''):'لم يحضر الولي بعد'):'',r.teacher,r.reason].filter(Boolean).join(' — ');
              else if(0) t=[r.teacher,r.reason].filter(Boolean).join(' — ');
