            <label>التاريخ</label><input type="date" id="rq_date" value="${todayStr()}">
            <div class="acts"><button class="btn" data-act="rqsave">💾 حفظ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }
          document.addEventListener('input',e=>{
            const t=e.target;if(t.id!=='rq_q') return;
            const q=norm(t.value),r=$('#rq_res');if(!r) return;
