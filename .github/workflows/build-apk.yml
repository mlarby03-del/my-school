            </div>`;
          }
          function viewFile(){
            return `<div class="bar"><button class="btn ghost sm" data-act="sfileback">→ رجوع</button><b>ملف التلميذ</b><button class="btn sm" data-act="sfilepdf">⬇️ PDF</button></div><div style="padding:0 8px 16px;overflow-x:auto">${fileDoc(S.sfile,null,0)}</div>`;
          }
          function buildPdf(pages,pw,ph){
            const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
            const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);pos+=u.length;};
            const obj=(n,fn)=>{offs[n]=pos;push(n+' 0 obj\n');fn();push('\nendobj\n');};
            const N=pages.length,PW=595.28,PHt=841.89;
            push('%PDF-1.4\n');
            obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
            obj(2,()=>push(`<< /Type /Pages /Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${N} >>`));
            pages.forEach((jb,i)=>{
              const p=3+3*i,cs=`q ${PW} 0 0 ${PHt} 0 0 cm /Im0 Do Q`;
              obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PHt}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
              obj(p+1,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
              obj(p+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>\nstream\n`);push(jb);push('\nendstream');});
            });
            const xr=pos,total=3+3*N;
            push(`xref\n0 ${total}\n0000000000 65535 f \n`);
            for(let n=1;n<total;n++) push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
            push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
            return concatU8(parts);
          }
          async function htmlToPdf(inner){
            const W=794,PH=Math.round(W*1.4142),SC=2;
            const host=document.createElement('div');
            host.style.cssText=`position:fixed;left:-10000px;top:0;width:${W}px;background:#fff`;
            host.innerHTML=inner;document.body.appendChild(host);
            try{
              await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;})));
              const root=host.firstElementChild,H=Math.min(9000,Math.ceil(root.scrollHeight)),top=host.getBoundingClientRect().top;
              const marks=[...host.querySelectorAll('.blk')].map(e=>Math.ceil(e.getBoundingClientRect().bottom-top)).sort((a,b)=>a-b);
              const xml=new XMLSerializer().serializeToString(root);
              const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${xml}</foreignObject></svg>`;
              const img=new Image();
              await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
              const cv=document.createElement('canvas');cv.width=W*SC;cv.height=H*SC;
              const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.scale(SC,SC);cx.drawImage(img,0,0);
              const pages=[];let s=0;
              while(s<H){
                let e=Math.min(H,s+PH);
                if(H-s>PH){const c=marks.filter(m=>m>s+PH*0.5&&m<=s+PH);if(c.length) e=c[c.length-1];}
                const pc=document.createElement('canvas');pc.width=W*SC;pc.height=PH*SC;
                const px=pc.getContext('2d');px.fillStyle='#fff';px.fillRect(0,0,pc.width,pc.height);
                px.drawImage(cv,0,s*SC,W*SC,(e-s)*SC,0,0,W*SC,(e-s)*SC);
                const blob=await new Promise((res,rej)=>pc.toBlob(b=>b?res(b):rej(new Error('jpeg')),'image/jpeg',0.88));
                pages.push(new Uint8Array(await blob.arrayBuffer()));
                s=e;
              }
              return buildPdf(pages,W*SC,PH*SC);
            }finally{host.remove();}
          }
          async function filePdf(){
            const s=byId(S.sfile);if(!s) return;
            toast('جاري إنشاء PDF…');
            try{
              const imgs={};
              for(const r of recsP().filter(r=>r.sid===s.id&&r.photos)) for(const pid of r.photos){const b=await photoGet(pid);if(b) imgs[pid]=await blobToDataURL(b);}
              for(const j of db.justs.filter(j=>j.sid===s.id)) for(const pid of (j.photos||[])){const b=await photoGet(pid);if(b) imgs[pid]=await blobToDataURL(b);}
              const bytes=await htmlToPdf(fileDoc(s.id,imgs,794));
              const ok=await download('ملف-'+nameOf(s).replace(/\s+/g,'-')+'.pdf',bytes,'application/pdf');
              if(ok) toast('تم إنشاء الملف');
            }catch(e){toast('تعذّر إنشاء PDF');}
          }


          /* ---------- مقارنة الأقسام ---------- */
          function cmpFrom(){const td=todayStr();return S.cmpR==='7'?addDays(td,-6):S.cmpR==='30'?addDays(td,-29):S.cmpR==='month'?td.slice(0,8)+'01':'';}
          function cmpData(){
            const f=cmpFrom(),m={};
            classes().forEach(c=>{m[c]={cls:c,n:db.students.filter(s=>s.cls===c).length,abs:0,j:0,late:0};});
            recsP().forEach(r=>{
              if(f&&r.date<f) return;if(r.type!=='abs'&&r.type!=='late') return;
              const s=byId(r.sid);if(!s||!m[s.cls]) return;
              if(r.type==='abs'){m[s.cls].abs++;if(r.just) m[s.cls].j++;} else m[s.cls].late++;
            });
            const L=Object.values(m).filter(o=>o.n);
            L.forEach(o=>{o.ra=o.abs/o.n;o.rl=o.late/o.n;});
            const k=S.cmpS==='late'?'rl':'ra';
            return L.sort((a,b)=>b[k]-a[k]||cmpNat(a.cls,b.cls));
          }
          const f1=n=>(Math.round(n*100)/100).toString();
          function cmpText(){
            const L=cmpData(),r={all:'كل المدة',month:'هذا الشهر','7':'آخر 7 أيام','30':'آخر 30 يوما'}[S.cmpR],p=curPeriod();
            let t=`مقارنة الأقسام (${S.cmpS==='late'?'التأخرات':'الغيابات'}) — ${r}${p?' · '+p.name:''}\n${SCHOOL}\nالتاريخ: ${fmtDate(todayStr())}\n\n`;
            L.forEach((o,i)=>{t+=`${i+1}. ${o.cls} (${o.n} تلميذ): غيابات ${o.abs} (${f1(o.ra)} للتلميذ)، تأخرات ${o.late} (${f1(o.rl)} للتلميذ)\n`;});
            return t.trim();
          }
          function viewCmp(){
            if(!db.students.length) return emptyState();
            const L=cmpData(),k=S.cmpS==='late'?'rl':'ra',mx=Math.max(0.0001,...L.map(o=>o[k]));
            const ta=L.reduce((n,o)=>n+o.abs,0),tl=L.reduce((n,o)=>n+o.late,0);
            const op=(v,t,c)=>`<option value="${v}"${c===v?' selected':''}>${t}</option>`;
            return `<div class="bar"><select id="c_r">${op('all','كل المدة',S.cmpR)}${op('month','هذا الشهر',S.cmpR)}${op('7','آخر 7 أيام',S.cmpR)}${op('30','آخر 30 يوما',S.cmpR)}</select><select id="c_s">${op('abs','ترتيب بالغيابات',S.cmpS)}${op('late','ترتيب بالتأخرات',S.cmpS)}</select></div>
            <div class="sum"><span>${L.length} قسم · غيابات <b>${ta}</b> · تأخرات <b>${tl}</b></span></div>
            <p class="hint">النسبة = عدد الغيابات (أو التأخرات) لكل تلميذ، فيمكن مقارنة قسم كبير بقسم صغير.</p>
            <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="ccopy">📋 نسخ</button><button class="btn sm ghost" data-act="cwa">📤 إرسال</button><button class="btn sm ghost" data-act="cxlsx">⬇️ Excel</button></div>
            <div class="cmp">${L.map((o,i)=>`<div class="cr"><div class="ch"><b>${i+1}. ${esc(o.cls)}</b><span class="muted">${o.n} تلميذ</span></div>
            <div class="cb"><i style="width:${Math.max(2,o[k]/mx*100)}%"></i></div>
            <div class="cn"><span>🚫 ${o.abs}${o.j?' ('+o.j+' مبرر)':''} · ${f1(o.ra)}/تلميذ</span><span>⏰ ${o.late} · ${f1(o.rl)}/تلميذ</span></div></div>`).join('')}</div>`;
          }
          function cmpRows(){
            const rows=[['الترتيب','القسم','عدد التلاميذ','الغيابات','منها مبررة','غيابات لكل تلميذ','التأخرات','تأخرات لكل تلميذ']];
            cmpData().forEach((o,i)=>rows.push([i+1,o.cls,o.n,o.abs,o.j,Math.round(o.ra*100)/100,o.late,Math.round(o.rl*100)/100]));
            return rows;
          }

