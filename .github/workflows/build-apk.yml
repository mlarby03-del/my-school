            if(db.students.some(s=>norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first)===k)){toast('هذا التلميذ موجود مسبقا في القسم');return;}
            const st={id:uid(),last,first,cls};
            db.students.push(st);S.recent.unshift(st.id);S.ncls=cls;save();render();
            toast('تمت إضافة '+nameOf(st)+' إلى '+cls);
            setTimeout(()=>{const e=$('#n_last');if(e)e.focus();},50);
          }
          function lateTail(sid){
            const d=db.records.filter(r=>r.sid===sid&&r.type==='late').map(r=>r.date).sort().reverse().slice(0,4).map(fmtDate);
            return d.length?' — آخرها: '+d.join('، '):'';
          }
          function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
          function viewRep(){
