          const sfName=(p,id)=>p==='S'?((db.sups.find(x=>x.id===id)||{}).name||'؟'):tName(id);
          function sfEvents(p,pred){
            const L=db.pev.filter(e=>e.p===p&&pred(e.date)).map(e=>Object.assign({},e));
            if(p==='T') db.tabs.filter(t=>pred(t.date)).forEach(t=>L.push({id:t.id,p:'T',pid:t.tid,date:t.date,type:'abs',shift:'',note:t.note||'',tab:1}));
            return L;
          }
          function viewStaff(){
            const p=S.sfm==='s'?'S':'T',d=S.sfd,ym=d.slice(0,7),L=sfEvents(p,x=>x===d).sort((a,b)=>sfName(p,a.pid).localeCompare(sfName(p,b.pid),'ar')),M={};
            sfEvents(p,x=>x.slice(0,7)===ym).forEach(e=>{const o=M[e.pid]=M[e.pid]||{abs:0,late:0,exit:0};o[e.type]++;});
            const sg=(v,t)=>`<button class="${S.sfm===v?'on':''}" data-act="sfm" data-v="${v}">${t}</button>`;
            return `<div class="title">👥 غيابات وتأخرات الطاقم</div><div class="seg">${sg('s','👔 المشرفون')}${sg('t','🧑‍🏫 الأساتذة')}</div>
            <div class="bar"><input type="date" id="sf_d" value="${d}"></div>
            <div class="acts" style="padding:0 12px"><button class="btn sm" data-act="sfadd">➕ تسجيل</button>${p==='S'?'<button class="btn sm ghost" data-act="sfsups">👔 قائمة المشرفين ('+db.sups.length+')</button>':''}</div>
            <p class="hint">${p==='S'?'تظهر غيابات وتأخرات المشرفين تلقائيا في خانة 3 من تقرير مستشار التربية.':'غياب الأستاذ يظهر تلقائيا في «دروس لم تقدم» من تقرير المستشار.'}</p>`+
            (L.length?L.map(e=>`<div class="row"><span class="nm">${esc(sfName(p,e.pid))}<br><small class="muted">${SFL[e.type][0]} ${SFL[e.type][1]}${e.shift?' · '+(e.shift==='ص'?'صباحا':'مساء'):''}${e.time?' · ⏰ '+esc(e.time):''}${e.note?' — '+esc(e.note):''}</small></span><button class="x" data-act="sfdel" data-id="${e.id}" data-tab="${e.tab?1:''}" aria-label="حذف">✕</button></div>`).join(''):'<p class="muted pad">لا تسجيل في هذا اليوم</p>')+
            `<h3 class="d">حصيلة الشهر</h3>`+(Object.keys(M).length?Object.keys(M).sort((a,b)=>sfName(p,a).localeCompare(sfName(p,b),'ar')).map(id=>`<div class="row"><span class="nm">${esc(sfName(p,id))}</span><span class="rc">🚫 ${M[id].abs}</span><span class="rc">⏰ ${M[id].late}</span><span class="rc">🚪 ${M[id].exit}</span></div>`).join(''):'<p class="muted pad">—</p>');
          }
          function sfModal(){
            const p=S.sfm==='s'?'S':'T',P=p==='S'?db.sups.map(x=>[x.id,x.name]):db.teachers.map(x=>[x.id,x.name]).sort((a,b)=>a[1].localeCompare(b[1],'ar'));
            if(!P.length){toast(p==='S'?'أضف أسماء المشرفين أولا (👔 قائمة المشرفين)':'أضف الأساتذة أولا');return;}
            modal(`<h3>${p==='S'?'👔 مشرف':'🧑‍🏫 أستاذ'} — ${fmtDate(S.sfd)}</h3><label>الاسم</label><select id="sf_p">${P.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select>
            <label>النوع</label><select id="sf_t"><option value="abs">🚫 غياب</option><option value="late">⏰ تأخر</option><option value="exit">🚪 خروج استثنائي</option></select>
            <label>الفترة</label><select id="sf_s"><option value="">يوم كامل / غير محدد</option><option value="ص">صباحا</option><option value="م">مساء</option></select>
            <label>الساعة (للتأخر أو الخروج)</label><input type="time" id="sf_h">
            <label>السبب / ملاحظة</label><div class="mrow"><textarea id="sf_n" rows="2"></textarea><button type="button" class="mic" data-act="mic" data-for="sf_n" aria-label="إملاء صوتي">🎤</button></div>
            <div class="acts"><button class="btn" data-act="sfsave">💾 حفظ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
          }
          const _ec11=extraClick;
          extraClick=function(a,d,el,e){
            switch(a){
              case 'sfm':S.sfm=d.v;render();return;
              case 'sfadd':sfModal();return;
              case 'sfsups':modal(`<h3>👔 قائمة المشرفين التربويين</h3><p class="muted">اسم مشرف في كل سطر.</p><textarea id="sf_l" rows="6">${db.sups.map(x=>esc(x.name)).join('\n')}</textarea><div class="acts"><button class="btn" data-act="sfsupsave">💾 حفظ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);return;
              case 'sfsupsave':{const nm=$('#sf_l').value.split('\n').map(x=>x.trim()).filter(Boolean);db.sups=nm.map(n=>db.sups.find(x=>x.name===n)||{id:uid(),name:n});const ids=new Set(db.sups.map(x=>x.id));db.pev=db.pev.filter(e=>e.p!=='S'||ids.has(e.pid));save();closeM();render();return;}
              case 'sfsave':{const p=S.sfm==='s'?'S':'T',pid=$('#sf_p').value,ty=$('#sf_t').value,sh=$('#sf_s').value,h=$('#sf_h').value,n=$('#sf_n').value.trim();
                if(p==='T'&&ty==='abs'){if(!db.tabs.some(x=>x.date===S.sfd&&x.tid===pid)) db.tabs.push({id:uid(),date:S.sfd,tid:pid,note:n});}
                else db.pev.push({id:uid(),p,pid,date:S.sfd,type:ty,shift:sh,time:h,note:n});
                save();closeM();render();return;}
              case 'sfdel':if(d.tab) db.tabs=db.tabs.filter(x=>x.id!==d.id);else db.pev=db.pev.filter(x=>x.id!==d.id);save();render();return;
            }
            _ec11(a,d,el,e);
          };
          const _ecg11=extraChange;
          extraChange=function(t){
            if(t.id==='sf_d'){S.sfd=t.value||todayStr();render();return;}
            _ecg11(t);
          };

          const LGN={late:'⏰ التأخرات',late10:'🕙 العاشرة',wc:'🚻 المرحاض',yard:'🧍 الساحة'};
          const GSN=[['abs','🚫 الغيابات'],['late','⏰ التأخرات'],['esc','🏃 الهروب'],['book','📓 الدفتر'],['bad','⚠️ المشاغبة'],['conv','📨 الاستدعاء'],['rpt','📝 التقارير'],['jus','🩺 التبريرات'],['hlt','💊 الحالة الصحية'],['req','🙋 الطلبات'],['new','➕ تلميذ جديد']];
          const gsSeg=cur=>`<div class="seg" style="flex-wrap:wrap">${GSN.map(([k,t])=>`<button style="flex:1 0 22%;padding:7px 4px;font-size:13px" class="${(k===cur||(k==='late'&&LG.includes(cur)))?'on':''}" data-act="tab" data-tab="${k}">${t}</button>`).join('')}</div>`;
          const _vr12=viewRecord;
          viewRecord=function(type){
            const h=_vr12(type);
            if(!GS.includes(type)) return h;
            return gsSeg(type)+(LG.includes(type)?`<div class="seg">${LG.map(k=>`<button class="${k===type?'on':''}" data-act="tab" data-tab="${k}">${LGN[k]}</button>`).join('')}</div>`:'')+h;
          };
          const _vj12=viewJus;
          viewJus=function(){return gsSeg('jus')+_vj12();};

          const _vh12=viewHealth;viewHealth=function(){return gsSeg('hlt')+_vh12();};
          const _vq12=viewReq;viewReq=function(){return gsSeg('req')+_vq12();};
          const _vn12=viewNew;viewNew=function(){return gsSeg('new')+_vn12();};
          const _ec12=extraClick;
          extraClick=function(a,d,el,e){
            if(a==='latesh'){
              if(db.records.some(x=>x.type==='late'&&x.sid===d.sid&&x.date===S.date&&effShift(x)===d.v)) return;
              const r=mkRec('late',d.sid,S.date);r.shift=d.v;
              if(!S.ltime&&(S.date!==todayStr()||(nowHM()<'13:00'?'ص':'م')!==d.v)) delete r.time;
