            <div class="bar"><button class="btn ghost sm" data-act="tview" data-v="list">→ قائمة الأساتذة</button><span class="muted">${L.length} غائب · تُدرج تلقائيا في تقرير المستشار</span></div>`+
            (L.length?L.map(x=>{const t=db.teachers.find(y=>y.id===x.tid)||{name:'؟'},n=db.sched.filter(y=>y.tid===x.tid&&y.day===dn).length;return `<div class="row"><span class="nm">${esc(t.name)}<br><small class="muted">${esc(t.subject||'')}${t.subject?' · ':''}${n} حصة هذا اليوم${x.note?' · '+esc(x.note):''}</small></span><button class="x" data-act="tabdel" data-id="${x.id}" aria-label="حذف">✕</button></div>`;}).join(''):'<p class="muted pad">لا غياب مسجّل في هذا اليوم</p>')+
