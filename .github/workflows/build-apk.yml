name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p www
          cat > package.json <<'EOF_PKG'
          {
            "name": "suivi-eleves",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          EOF_PKG
          cat > capacitor.config.json <<'EOF_CFG'
          {
            "appId": "dz.mjd.suivi",
            "appName": "متابعة التلاميذ",
            "webDir": "www"
          }
          EOF_CFG
          cat > www/index.html <<'EOF_HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#0f766e">
          <title>متابعة التلاميذ</title>
          <style>
          :root{--bg:#f4f7f6;--card:#fff;--tx:#12201d;--mu:#62726e;--pr:#0f766e;--pr2:#0d5f59;--bd:#dbe4e1;--red:#c0392b;--amb:#fff4d6;--grn:#e3f6ee}
          @media (prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18231f;--tx:#e8f0ed;--mu:#9bb0aa;--pr:#2bb3a6;--pr2:#239a8f;--bd:#2a3a35;--red:#ff7b6b;--amb:#3a3118;--grn:#17352b}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
          header{position:sticky;top:0;z-index:5;background:var(--pr);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
          header .t{flex:1;line-height:1.25}header b{display:block;font-size:17px}header small{opacity:.85;font-size:12px}
          header button{background:rgba(255,255,255,.18);border:0;color:#fff;font-size:20px;border-radius:10px;width:42px;height:42px}
          main{max-width:720px;margin:0 auto}
          nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
          nav button{flex:1 0 auto;min-width:64px;border:0;background:none;color:var(--mu);padding:8px 2px 7px;font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
          nav button span{font-size:21px;line-height:1}nav button.on{color:var(--pr);font-weight:700}
          .bar{display:flex;gap:8px;align-items:center;padding:10px 12px}
          .bar b{flex:1}.bar input,.bar select{flex:1;min-width:0}
          input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:4px 0}
          label{display:block;font-size:13px;color:var(--mu);margin-top:8px}
          .btn{font:inherit;border:0;background:var(--pr);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600}
          .btn:disabled{opacity:.45}.btn.sm{padding:7px 12px;font-size:14px}
          .btn.ghost{background:transparent;color:var(--pr);border:1px solid var(--bd)}.btn.danger{background:var(--red);color:#fff}
          .title{font-size:20px;font-weight:700;padding:14px 14px 0}
          .sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 14px 6px;font-size:14px;color:var(--mu)}.sum b{color:var(--tx)}
          .hint{margin:0;padding:0 14px 8px;font-size:13px;color:var(--mu)}
          h3{margin:16px 14px 6px;font-size:16px}h3 small{color:var(--mu);font-weight:400;font-size:13px;margin-right:6px}h3.d{font-size:14px;color:var(--pr)}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:0 12px}
          .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;font:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px}
          .card b{font-size:18px}.card small{color:var(--mu)}
          .row{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:0;border-bottom:1px solid var(--bd);padding:13px 14px;font:inherit;color:var(--tx);text-align:right;min-height:52px}
          .row .nm{flex:1}.row .sub{color:var(--mu);font-size:13px}.row .no{width:24px;color:var(--mu);font-size:13px}
          .row .st{font-size:13px;font-weight:700;color:var(--red);max-width:48%;text-align:left}
          .row.rec.on{background:var(--amb)}.row.rec.on.just{background:var(--grn)}.row.rec.on.just .st{color:var(--pr)}
          .badges i{font-style:normal;font-size:12px;background:var(--bg);border-radius:8px;padding:2px 6px;margin-right:3px}
          .x{border:0;background:none;color:var(--red);font-size:18px;padding:4px 8px}
          .idx{display:none}
          .rc{font-size:13px;font-weight:700;color:var(--mu);background:var(--bg);border-radius:8px;padding:1px 7px}.rc.hot,.stats .hot b{color:var(--red)}
          .stats .hot{background:var(--amb)}
          .warn.bk{margin:10px 12px 0;cursor:pointer;border:1px solid var(--bd)}
          .warn{background:var(--amb);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
          .qk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.qk button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}.qk button span{font-size:22px}.qk button.on{background:var(--amb);border-color:var(--red);font-weight:700}
          .cv{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
          .qk button:last-child:nth-child(odd){grid-column:span 2}
          .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
          .th{position:relative}.th .x{position:absolute;top:-6px;left:-6px;background:var(--card);border:1px solid var(--bd);border-radius:50%;width:22px;height:22px;padding:0;font-size:12px;line-height:20px}
          .ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
          .vw{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
          .vw img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}.vw img.big{max-width:none;max-height:none;width:250%}.vw .btn{flex:none}
          nav::-webkit-scrollbar{display:none}
          .rf{display:grid;grid-template-columns:1fr 1fr;gap:6px}
          nav button{font-size:10.5px!important}
          .muted{color:var(--mu)}.pad{padding:12px 14px}
          .empty{text-align:center;padding:48px 24px}.empty .big{font-size:48px}.empty .btn{display:block;margin:10px auto;min-width:240px}
          .mb{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
          .mc{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
          .mc h3{margin:0 0 4px}.acts,.menu{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.menu{flex-direction:column}.menu .btn{text-align:right}
          .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.stats div{background:var(--bg);border-radius:10px;text-align:center;padding:8px 2px}.stats b{display:block;font-size:20px}.stats small{font-size:11px;color:var(--mu)}
          .hl .row{padding:9px 4px;min-height:0}
          .prev{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
          .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips span{background:var(--bg);border-radius:8px;padding:3px 8px;font-size:13px}
          #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}
          #toast.show{opacity:1;transform:translateX(-50%)}
          .mrow{display:flex;gap:6px;align-items:flex-start}.mrow input,.mrow textarea{flex:1}.mic{flex:none;width:46px;height:46px;margin:4px 0;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:20px}
          .alerts{margin:10px 12px 0;background:var(--amb);border-radius:12px;padding:4px 0 6px}.alerts .ah{display:flex;justify-content:space-between;align-items:center;padding:6px 12px}.alerts .row{background:transparent}
          .seg{display:flex;gap:6px;padding:10px 12px 0}.seg button{flex:1;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
          .rtxt{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 12px;padding:12px;font-size:14px}
          .pr{display:flex;gap:6px;align-items:center}.pr .btn{flex:1;text-align:right}.pr small{opacity:.75;margin-right:6px}
          .acts a.btn{text-decoration:none;display:inline-block}
          .row.hr[data-act=recinfo]{cursor:pointer}
          .cmp{padding:6px 12px}.cr{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}.ch{display:flex;justify-content:space-between}.cb{height:10px;background:var(--bg);border-radius:6px;margin:8px 0;overflow:hidden}.cb i{display:block;height:100%;background:var(--pr);border-radius:6px}.cn{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);gap:6px;flex-wrap:wrap}
          </style>
          </head>
          <body>
          <header><div class="t"><b>متابعة التلاميذ</b><small id="hsub">متوسطة المجاهد الطاهر ايت علجت</small></div><button data-act="period" aria-label="الفترة">📅</button><button data-act="settings" aria-label="الإعدادات">⚙️</button></header>
          <main id="app"></main>
          <nav id="nav"></nav>
          <div id="modal"></div>
          <div id="viewer"></div>
          <div id="toast"></div>
          <input type="file" id="file" hidden accept=".xlsx,.xlsm,.xls,.csv,.txt">
          <input type="file" id="rfile" hidden accept=".json,application/json">
          <input type="file" id="pcam" hidden accept="image/*" capture="environment">
          <input type="file" id="pgal" hidden accept="image/*" multiple>
          <script>
          /* ===== قراءة ملفات Excel (xlsx) و CSV بدون مكتبات خارجية ===== */
          async function inflateRaw(u8){
            const ds=new DecompressionStream('deflate-raw');
            const stream=new Blob([u8]).stream().pipeThrough(ds);
            return new Uint8Array(await new Response(stream).arrayBuffer());
          }
          async function unzip(buf){
            const u8=new Uint8Array(buf), dv=new DataView(buf);
            let eocd=-1;
            for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){
              if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
            }
            if(eocd<0) throw new Error('NOTZIP');
            const n=dv.getUint16(eocd+10,true);
            let p=dv.getUint32(eocd+16,true);
            const files={}, dec=new TextDecoder();
            for(let k=0;k<n;k++){
              if(dv.getUint32(p,true)!==0x02014b50) break;
              const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
              const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
              const off=dv.getUint32(p+42,true);
              const name=dec.decode(u8.subarray(p+46,p+46+nl));
              files[name]={method,csize,off};
              p+=46+nl+el+cl;
            }
            async function read(name){
              const f=files[name]; if(!f) return null;
              const ln=dv.getUint16(f.off+26,true), le=dv.getUint16(f.off+28,true);
              const start=f.off+30+ln+le;
              const data=u8.subarray(start,start+f.csize);
              const out=f.method===0?data:await inflateRaw(data);
              return dec.decode(out);
            }
            return {files,read};
          }
          function xmlDecode(s){
            return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
                    .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
                    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
          }
          function attrs(s){const o={};s.replace(/([\w:.-]+)\s*=\s*"([^"]*)"/g,(_,k,v)=>{o[k]=xmlDecode(v);});return o;}
          function tText(s){
            s=s.replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');
            let out='';s.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g,(_,t)=>{out+=xmlDecode(t);});
            return out;
          }
          function colIdx(ref){
            const m=/^([A-Z]+)/.exec(ref);let n=0;
            for(const ch of m[1]) n=n*26+ch.charCodeAt(0)-64;
            return n-1;
          }
          async function readXlsx(buf){
            if(typeof DecompressionStream==='undefined') throw new Error('NODS');
            const z=await unzip(buf);
            const wb=await z.read('xl/workbook.xml');
            if(!wb) throw new Error('NOTXLSX');
            const rels=await z.read('xl/_rels/workbook.xml.rels')||'';
            const relMap={};
            (rels.match(/<Relationship\b[^>]*>/g)||[]).forEach(t=>{const a=attrs(t);relMap[a.Id]=a.Target;});
            const sst=[];
            const sx=await z.read('xl/sharedStrings.xml');
            if(sx) (sx.match(/<si\b[^>]*>[\s\S]*?<\/si>|<si\b[^>]*\/>/g)||[]).forEach(si=>sst.push(tText(si)));
            const sheets=[];
            const tags=wb.match(/<sheet\b[^>]*>/g)||[];
            for(const tag of tags){
              const a=attrs(tag);
              let target=relMap[a['r:id']];
              if(!target) continue;
              target=target.startsWith('/')?target.slice(1):'xl/'+target;
              const xml=await z.read(target);
              if(!xml) continue;
              const rows=[];
              const cre=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
              let m;
              while((m=cre.exec(xml))){
                const at=attrs(m[1]); if(!at.r||m[2]===undefined) continue;
                const body=m[2]; let val='';
                if(at.t==='s'){const v=/<v>([\s\S]*?)<\/v>/.exec(body); if(v) val=sst[+v[1]]??'';}
                else if(at.t==='inlineStr'){val=tText(body);}
                else{const v=/<v>([\s\S]*?)<\/v>/.exec(body); if(v) val=xmlDecode(v[1]);}
                val=String(val).trim();
                if(val==='') continue;
                const r=+/\d+/.exec(at.r)[0]-1, c=colIdx(at.r);
                (rows[r]=rows[r]||[])[c]=val;
              }
              const out=[];
              for(let i=0;i<rows.length;i++){
                const r=rows[i]||[]; const row=[];
                for(let j=0;j<r.length;j++) row.push(r[j]??'');
                out.push(row);
              }
              sheets.push({name:a.name,rows:out});
            }
            if(!sheets.length) throw new Error('NOSHEETS');
            return sheets;
          }
          function parseCSV(t){
            t=t.replace(/^﻿/,'');
            const first=t.split('\n')[0];
            const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
            const rows=[];let row=[],cur='',q=false;
            for(let i=0;i<t.length;i++){
              const c=t[i];
              if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
              else if(c==='"') q=true;
              else if(c===d){row.push(cur);cur='';}
              else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; row.push(cur);rows.push(row);row=[];cur=''; }
              else cur+=c;
            }
            if(cur!==''||row.length){row.push(cur);rows.push(row);}
            return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==''));
          }
          if(typeof module!=='undefined') module.exports={readXlsx,parseCSV};

          /* ===== متابعة التلاميذ — متوسطة المجاهد الطاهر ايت علجت ===== */
          const KEY='mjd_suivi_v1';
          const TYPES={
            abs:{label:'الغيابات',icon:'🚫',nav:'الغيابات',short:'الغيابات'},
            late:{label:'التأخرات',icon:'⏰',nav:'التأخرات',short:'التأخرات'},
            book:{label:'عدم إحضار دفتر المراسلة',icon:'📓',nav:'دفتر المراسلة',short:'الدفتر'},
            bad:{label:'التلاميذ المشاغبون',icon:'⚠️',nav:'المشاغبون',short:'المشاغبة'},
            conv:{label:'الاستدعاءات',icon:'📨',nav:'الاستدعاءات',short:'الاستدعاء'},
            rpt:{label:'التقارير',icon:'📝',nav:'التقارير',short:'التقارير'}
          };
          const LV={1:'السنة الأولى متوسط',2:'السنة الثانية متوسط',3:'السنة الثالثة متوسط',4:'السنة الرابعة متوسط',0:'أقسام غير مصنفة'};
          const $=s=>document.querySelector(s);
          const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
          const pad=n=>String(n).padStart(2,'0');
          const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
          function norm(s){
            return String(s==null?'':s).toLowerCase()
              .replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-0x660))
              .normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g,'')
              .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
          }
          function load(){
            try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.students))return normDb(d);}catch(e){}
            return normDb({});
          }
          let db=load();
          function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('تعذّر الحفظ: ذاكرة المتصفح ممتلئة أو ممنوعة');}}
          let S={tab:'search',cls:'',lcls:'',date:todayStr(),q:'',hist:false,hcls:'',imp:null,rep:null,qdate:todayStr(),msid:'',pend:[],recent:[],ncls:''};

          const nameOf=s=>(s.last+' '+s.first).trim();
          const cmpName=(a,b)=>nameOf(a).localeCompare(nameOf(b),'ar');
          const cmpNat=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
          const classes=()=>[...new Set(db.students.map(s=>s.cls))].sort(cmpNat);
          const studentsOf=c=>db.students.filter(s=>s.cls===c).sort(cmpName);
          const byId=id=>db.students.find(s=>s.id===id);
          function levelOf(c){
            if(db.levels&&db.levels[c]) return db.levels[c];
            const n=norm(c);
            if(/ثاني|2eme|2em/.test(n)) return 2;
            if(/ثالث|3eme|3em/.test(n)) return 3;
            if(/رابع|4eme|4em/.test(n)) return 4;
            if(/اول|1er|premi/.test(n)) return 1;
            const d=/\d/.exec(n);
            if(d&&+d[0]>=1&&+d[0]<=4) return +d[0];
            return 0;
          }
          function classOptions(sel,allLabel){
            let h=allLabel?`<option value="">${allLabel}</option>`:`<option value="">— اختر القسم —</option>`;
            for(const l of [1,2,3,4,0]){
              const cs=classes().filter(c=>levelOf(c)===l); if(!cs.length) continue;
              h+=`<optgroup label="${LV[l]}">`+cs.map(c=>`<option value="${esc(c)}"${c===sel?' selected':''}>${esc(c)}</option>`).join('')+`</optgroup>`;
            }
            return h;
          }
          const zero=()=>({abs:0,late:0,book:0,bad:0,conv:0,rpt:0});
          function counts(){
            const m={};
            for(const r of recsP()){(m[r.sid]=m[r.sid]||zero())[r.type]++;}
            return m;
          }
          const findRec=(type,sid,date)=>db.records.find(r=>r.type===type&&r.sid===sid&&r.date===date);
          const fmtDate=d=>{const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];};

          /* ---------- واجهات صغيرة ---------- */
          let toastT;
          function toast(t){const e=$('#toast');e.textContent=t;e.className='show';clearTimeout(toastT);toastT=setTimeout(()=>e.className='',2600);}
          function modal(html){$('#modal').innerHTML=`<div class="mb" data-act="closem"><div class="mc" data-act="none">${html}</div></div>`;}
          function closeM(){$('#modal').innerHTML='';if(S.pend&&S.pend.length){S.pend.forEach(photoDel);S.pend=[];}}
          function toB64(data){
            const u=typeof data==='string'?new TextEncoder().encode(data):data;let s='';
            for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
            return btoa(s);
          }
          async function download(name,data,mime){
            const C=window.Capacitor;
            if(C&&C.isNativePlatform&&C.isNativePlatform()){
              const ext=((name.match(/\.(\w+)$/)||[])[1]||'dat').toLowerCase();
              const pre={json:'backup',xlsx:'report',pdf:'student-file',csv:'export'}[ext]||'file';
              const safe=pre+'-'+todayStr()+'-'+Date.now().toString(36).slice(-4)+'.'+ext;
              try{
                const FS=C.registerPlugin('Filesystem'),SH=C.registerPlugin('Share');
                const w=await FS.writeFile({path:safe,data:toB64(data),directory:'CACHE'});
                await SH.share({title:name,url:w.uri,dialogTitle:'حفظ / إرسال الملف'});
                return true;
              }catch(e){
                const m=String(e&&(e.message||e));
                if(/cancel|dismiss/i.test(m)) return false;
                toast('تعذّر تصدير الملف: '+m.slice(0,100));return false;
              }
            }
            const b=new Blob([data],{type:mime||'text/plain;charset=utf-8'});
            const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
            document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
            return true;
          }
          function toCSV(rows){return '﻿sep=;\r\n'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n');}

          /* ---------- الواجهة الرئيسية ---------- */
          function renderNav(){
            const items=[['search','🔍','بحث'],['lists','📋','القوائم'],...Object.keys(TYPES).map(k=>[k,TYPES[k].icon,TYPES[k].short]),['kash','📊','الكشوف'],['new','➕','تلميذ جديد'],['data','💾','حفظ المعطيات']];
            $('#nav').innerHTML=items.map(([k,i,l])=>`<button data-act="tab" data-tab="${k}" class="${S.tab===k&&!S.imp&&!S.rep?'on':''}"><span>${i}</span>${l}</button>`).join('');
            try{const on=$('#nav .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
          }
          function render(){
            renderNav();updHeader();
            const a=$('#app');
            if(S.sfile){a.innerHTML=viewFile();return;}
            if(S.imp){a.innerHTML=viewImport();return;}
            if(S.rep){a.innerHTML=viewRep();return;}
            a.innerHTML=S.tab==='search'?viewSearch():S.tab==='lists'?viewLists():S.tab==='kash'?viewKash():S.tab==='new'?viewNew():S.tab==='data'?viewData():viewRecord(S.tab);
          }
          function emptyState(){
            return `<div class="empty"><div class="big">👋</div><h2>ابدأ باستيراد قائمة التلاميذ</h2>
            <p>ملف Excel فيه اللقب والاسم والقسم لكل تلميذ.</p>
            <button class="btn" data-act="pick">📥 استيراد من Excel</button>
            <button class="btn ghost" data-act="addstu">➕ إضافة تلميذ يدويا</button></div>`;
          }
          function badgeHtml(c){
            if(!c) return '';
            return Object.keys(TYPES).filter(k=>c[k]).map(k=>`<i title="${TYPES[k].label}">${TYPES[k].icon}${c[k]}</i>`).join('');
          }
          function stRow(s,cnt,showCls){
            return `<button class="row" data-act="stu" data-sid="${s.id}"><span class="nm">${esc(nameOf(s))}</span>${showCls?`<span class="sub">${esc(s.cls)}</span>`:''}<span class="badges">${badgeHtml(cnt[s.id])}</span></button>`;
          }
          function viewSearch(){
            if(!db.students.length) return emptyState();
            const cnt=counts();
            let h=bkBanner()+(S.q.trim()?'':alertsHtml())+`<div class="bar"><input id="q" type="search" placeholder="🔍 ابحث عن تلميذ بالاسم..." value="${esc(S.q)}" autocomplete="off"></div>`;
            if(!S.q.trim()) return h+`<p class="muted pad">اكتب اسم التلميذ، ثم المسه لتسجيل غياب أو تأخر أو غيره، وتشوف كم مرة تأخر.</p><div class="pad"><button class="btn" data-act="rep">📊 التلاميذ المتكررون (تأخر/غياب)</button></div>`;
            const q=norm(S.q);
            const res=db.students.filter(s=>norm(nameOf(s)).includes(q)).sort(cmpName).slice(0,60);
            return h+(res.length?res.map(s=>stRow(s,cnt,true)).join(''):'<p class="muted pad">لا توجد نتائج</p>');
          }
          function viewLists(){
            if(!db.students.length) return emptyState();
            const cnt=counts();
            if(S.lcls){
              const list=studentsOf(S.lcls);
              return `<div class="bar"><button class="btn ghost sm" data-act="lback">→ الأقسام</button><b>${esc(S.lcls)}</b><span class="muted">${list.length} تلميذ</span><button class="btn ghost sm" data-act="editcls" data-c="${esc(S.lcls)}" aria-label="تعديل القسم">✏️</button><button class="btn sm" data-act="addstu">➕</button></div>`+
                (list.map((s,i)=>`<div class="idx">${i+1}</div>`+stRow(s,cnt,false)).join('')||'<p class="muted pad">لا يوجد تلاميذ في هذا القسم</p>');
            }
            let h=`<div class="bar"><b>الأقسام</b><button class="btn sm" data-act="rep">📊 المتكررون</button></div>`;
            for(const l of [1,2,3,4,0]){
              const cs=classes().filter(c=>levelOf(c)===l); if(!cs.length) continue;
              const total=cs.reduce((n,c)=>n+studentsOf(c).length,0);
              if(l===0){
                h+=`<h3>${LV[0]} <small>${cs.length} أقسام</small></h3><p class="muted" style="margin:0 14px 6px;font-size:13px">لم يُعرف مستوى هذه الأقسام من أسمائها. اختر مستوى كل قسم من 1 إلى 4.</p>`+
                  cs.map(c=>`<div class="row"><span class="nm"><b>${esc(c)}</b> <small class="muted">${studentsOf(c).length} تلميذ</small></span><button class="btn ghost sm" data-act="lcls" data-c="${esc(c)}">فتح</button><select data-lvc="${esc(c)}" style="width:auto;margin:0" aria-label="مستوى ${esc(c)}"><option value="">المستوى…</option>${[1,2,3,4].map(k=>`<option value="${k}">${LV[k]}</option>`).join('')}</select></div>`).join('');
                continue;
              }
              h+=`<h3>${LV[l]} <small>${cs.length} أقسام · ${total} تلميذ</small></h3>${l===0?'<p class="muted" style="margin:0 14px 6px;font-size:13px">مستوى هذه الأقسام غير معروف. المس القسم ثم ✏️ وصحّح اسمه (مثال: 1م1، الرقم الأول هو المستوى).</p>':''}<div class="grid">`+
                cs.map(c=>`<button class="card" data-act="lcls" data-c="${esc(c)}"><b>${esc(c)}</b><small>${studentsOf(c).length} تلميذ</small></button>`).join('')+`</div>`;
            }
            return h;
          }
          function rowState(type,r){
            if(!r) return '';
            if(type==='abs') return r.just?'غائب (مبرَّر)':'غائب';
            if(type==='late') return 'متأخر'+(r.time?' ⏰ '+esc(r.time):'');
            if(type==='book') return 'لم يحضر الدفتر';
            if(type==='conv') return 'استدعاء'+(r.teacher?' · '+esc(r.teacher):'')+(r.reason?' — '+esc(r.reason):'');
            if(type==='rpt') return 'تقرير'+(r.teacher?' · '+esc(r.teacher):'')+(r.reason?' — '+esc(r.reason):'')+(r.photos&&r.photos.length?' 📷':'');
            return 'مشاغب'+(r.note?' · '+esc(r.note):'');
          }
          function viewRecord(type){
            const T=TYPES[type];
            if(S.hist) return viewHist(type);
            let h=`<div class="title">${T.icon} ${T.label}</div><div class="bar"><input type="date" id="date" value="${S.date}"><select id="cls">${classOptions(S.cls)}</select></div>`;
            if(!db.students.length) return h+emptyState();
            const dayRecs=db.records.filter(r=>r.type===type&&r.date===S.date);
            const inCls=S.cls?dayRecs.filter(r=>{const s=byId(r.sid);return s&&s.cls===S.cls;}).length:0;
            h+=`<div class="sum"><span>${fmtDate(S.date)}${S.cls?` · ${esc(S.cls)}: <b>${inCls}</b>`:''} · في المؤسسة: <b>${dayRecs.length}</b></span><button class="btn ghost sm" data-act="hist">📜 السجل</button></div>`;
            if(!S.cls) return h+'<p class="muted pad">اختر القسم لعرض تلاميذه، ثم المس اسم التلميذ لتسجيله.</p>';
            if(type==='late') h+=lateBar();
            const hint={abs:'المس مرة: غائب · مرتين: غائب مبرَّر · ثلاث: إلغاء',late:'المس اسم التلميذ لتسجيل التأخر (ومرة أخرى للإلغاء)',book:'المس اسم التلميذ لتسجيل عدم إحضار الدفتر',bad:'المس اسم التلميذ لتسجيل المشاغبة مع ملاحظة',conv:'المس اسم التلميذ لتسجيل استدعاء (الأستاذ المستدعي + السبب)',rpt:'المس اسم التلميذ لتسجيل تقرير (الأستاذ + السبب + صورة التقرير)'}[type];
            h+=`<p class="hint">${hint}</p>`;
            const cn=counts();
            h+=studentsOf(S.cls).map((s,i)=>{
              const r=findRec(type,s.id,S.date), n=(cn[s.id]||{})[type]||0;
              return `<button class="row rec ${r?'on '+(r.just?'just':''):''}" data-act="tap" data-sid="${s.id}"><span class="no">${i+1}</span><span class="nm">${esc(nameOf(s))}</span>${n?`<span class="rc ${n>=3?'hot':''}">×${n}</span>`:''}<span class="st">${rowState(type,r)}${(type==='conv'||type==='rpt')&&r?detDay(type,s.id):''}</span></button>`;
            }).join('');
            return h;
          }
          function viewHist(type){
            const T=TYPES[type];
            let recs=recsP().filter(r=>r.type===type).filter(r=>{const s=byId(r.sid);return s&&(!S.hcls||s.cls===S.hcls);});
            recs.sort((a,b)=>b.date.localeCompare(a.date)||0);
            let h=`<div class="bar"><button class="btn ghost sm" data-act="hback">→ رجوع</button><b>سجل: ${T.nav}</b><button class="btn sm" data-act="export" data-type="${type}">⬇️ CSV</button></div>
            <div class="bar"><select id="hcls">${classOptions(S.hcls,'كل الأقسام')}</select><span class="muted">${recs.length} تسجيل</span></div>`;
            if(!recs.length) return h+'<p class="muted pad">لا توجد تسجيلات</p>';
            let last='';
            for(const r of recs){
              const s=byId(r.sid);
              if(r.date!==last){h+=`<h3 class="d">${fmtDate(r.date)}</h3>`;last=r.date;}
              h+=`<div class="row hr" data-act="recinfo" data-from="hist" data-rid="${r.id}"><span class="nm">${esc(nameOf(s))}</span><span class="sub">${esc(s.cls)}</span><span class="st">${rowState(type,r)}</span><button class="x" data-act="delrec" data-rid="${r.id}" aria-label="حذف">✕</button></div>`;
            }
            return h;
          }
          function tap(sid){
            const type=S.tab, r=findRec(type,sid,S.date);
            if(type==='conv'||type==='rpt'){detModal(type,sid,S.date);return;}
            if(type==='bad'){
              const s=byId(sid);
              modal(`<h3>⚠️ ${esc(nameOf(s))}</h3><p class="muted">${fmtDate(S.date)}</p><label>ملاحظة (اختياري)</label><textarea id="note" rows="3" placeholder="مثال: تشويش داخل القسم">${r?esc(r.note||''):''}</textarea>
              <div class="acts"><button class="btn" data-act="savebad" data-sid="${sid}">${r?'حفظ':'تسجيل'}</button>${r?`<button class="btn danger" data-act="unbad" data-sid="${sid}">إلغاء التسجيل</button>`:''}<button class="btn ghost" data-act="closem">إغلاق</button></div>`);
              return;
            }
            if(!r) db.records.push(mkRec(type,sid,S.date));
            else if(type==='abs'&&!r.just) r.just=true;
            else db.records.splice(db.records.indexOf(r),1);
            save();render();
          }

          /* ---------- بطاقة التلميذ ---------- */
          function quick(sid,type){
            const date=S.qdate||todayStr();
            if(type==='conv'||type==='rpt'){detModal(type,sid,date);return;}
            const r=findRec(type,sid,date);
            if(!r) db.records.push(mkRec(type,sid,date));
            else if(type==='abs'&&!r.just) r.just=true;
            else db.records.splice(db.records.indexOf(r),1);
            save();render();stuModal(sid);
          }
          function stuModal(sid){
            const s=byId(sid); if(!s) return;
            S.msid=sid;
            const c=counts()[sid]||zero();
            const recs=db.records.filter(r=>r.sid===sid).sort((a,b)=>b.date.localeCompare(a.date));
            modal(`<h3>${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)}</p>
            <label>سجّل في تاريخ</label><input type="date" id="qdate" value="${S.qdate}">
            <div class="qk">${Object.keys(TYPES).map(k=>{const r=findRec(k,sid,S.qdate);return `<button class="${r?'on':''}" data-act="quick" data-sid="${sid}" data-type="${k}"><span>${TYPES[k].icon}</span>${TYPES[k].nav}${r?(k==='abs'&&r.just?' (مبرر) ✓':' ✓'):''}</button>`;}).join('')}</div>
            <div class="stats">${Object.keys(TYPES).map(k=>`<div class="${c[k]>=3?'hot':''}"><b>${c[k]}</b><small>${TYPES[k].short}</small></div>`).join('')}</div>
            ${c.late>=3?`<p class="warn">⏰ تأخر ${c.late} مرات${lateTail(sid)}</p>`:''}${c.abs>=3?`<p class="warn">🚫 غاب ${c.abs} مرات</p>`:''}
            <div class="hl">${recs.length?recs.map(r=>`<div class="row hr"><span class="sub">${fmtDate(r.date)}</span><span class="nm">${TYPES[r.type].icon} ${TYPES[r.type].nav}</span><span class="st">${recNote(r)}</span><button class="x" data-act="delrec2" data-rid="${r.id}" data-sid="${sid}">✕</button></div>`).join(''):'<p class="muted">لا توجد تسجيلات</p>'}</div>
            <div class="acts"><button class="btn ghost" data-act="editstu" data-sid="${sid}">✏️ تعديل</button><button class="btn danger" data-act="delstu" data-sid="${sid}">🗑️ حذف</button><button class="btn" data-act="closem">إغلاق</button></div>`);
          }
          function recNote(r){
            if(r.type==='abs'&&r.just) return 'مبرَّر';
            if(r.type==='conv'||r.type==='rpt') return esc((r.teacher||'')+(r.teacher&&r.reason?' — ':'')+(r.reason||''))+(r.photos&&r.photos.length?' 📷'+r.photos.length:'');
            return esc(r.note||'');
          }
          function detDay(type,sid){
            const n=db.records.filter(x=>x.type===type&&x.sid===sid&&x.date===S.date).length;
            return n>1?' (×'+n+')':'';
          }
          const DET={
            conv:{icon:'📨',who:'الأستاذ المستدعي',why:'سبب الاستدعاء',add:'تسجيل الاستدعاء',cnt:'عدد الاستدعاءات',nw:'استدعاء جديد'},
            rpt:{icon:'📝',who:'الأستاذ كاتب التقرير',why:'سبب التقرير',add:'تسجيل التقرير',cnt:'عدد التقارير',nw:'تقرير جديد'}
          };
          function photosHtml(r){
            return r.photos&&r.photos.length?'<div class="thumbs">'+r.photos.map(id=>`<img data-pid="${id}" data-act="view" alt="صورة التقرير">`).join('')+'</div>':'';
          }
          function renderPend(){
            const e=$('#pend');if(!e) return;
            e.innerHTML=S.pend.map(id=>`<span class="th"><img data-pid="${id}" data-act="view" alt=""><button class="x" data-act="unpend" data-pid="${id}" aria-label="حذف الصورة">✕</button></span>`).join('');
            hydrate();
          }
          function detModal(type,sid,date){
            const s=byId(sid); if(!s) return;
            const D=DET[type];
            const recs=db.records.filter(r=>r.sid===sid&&r.type===type).sort((a,b)=>b.date.localeCompare(a.date));
            const teachers=[...new Set(db.records.filter(r=>(r.type==='conv'||r.type==='rpt')&&r.teacher).map(r=>r.teacher))];
            modal(`<h3>${D.icon} ${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)} · ${D.cnt}: <b>${recs.length}</b></p>
            <div>${recs.map(r=>`<div class="cv"><div><b>${fmtDate(r.date)}</b> · ${esc(r.teacher||'—')}<br><span class="muted">${esc(r.reason||'')}</span>${photosHtml(r)}</div><button class="x" data-act="deldet" data-type="${type}" data-rid="${r.id}" data-sid="${sid}" data-date="${date}" aria-label="حذف">✕</button></div>`).join('')}</div>
            <h3 style="margin-top:14px;font-size:15px">${D.nw} — ${fmtDate(date)}</h3>
            <label>${D.who}</label><input id="c_teacher" list="tl" autocomplete="off"><datalist id="tl">${teachers.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
            <label>${D.why}</label><textarea id="c_reason" rows="3"></textarea>
            ${type==='rpt'?`<label>صورة التقرير المكتوب</label><div class="ph"><button class="btn ghost sm" data-act="shoot">📷 تصوير</button><button class="btn ghost sm" data-act="gallery">🖼️ من المعرض</button></div><div id="pend" class="thumbs"></div>`:''}
            <div class="acts"><button class="btn" data-act="adddet" data-type="${type}" data-sid="${sid}" data-date="${date}">${D.add}</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            renderPend();hydrate();
          }
          function dropRec(rid){
            const r=db.records.find(x=>x.id===rid);
            if(r&&r.photos) r.photos.forEach(photoDel);
            db.records=db.records.filter(x=>x.id!==rid);
          }

          /* ---------- الصور (IndexedDB) ---------- */
          let _idb;
          function idb(){return _idb||(_idb=new Promise((res,rej)=>{const q=indexedDB.open('mjd_photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
          async function photoPut(id,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('p','readwrite');t.objectStore('p').put(blob,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
          async function photoGet(id){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
          function photoDel(id){idb().then(d=>{d.transaction('p','readwrite').objectStore('p').delete(id);delete purl[id];}).catch(()=>{});}
          function photoClear(){return idb().then(d=>new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').clear();t.oncomplete=()=>res();t.onerror=()=>res();})).catch(()=>{});}
          const purl={};
          async function photoUrl(id){if(purl[id]) return purl[id];try{const b=await photoGet(id);if(!b) return '';return purl[id]=URL.createObjectURL(b);}catch(e){return '';}}
          async function hydrate(){
            for(const im of document.querySelectorAll('img[data-pid]')){
              if(im.getAttribute('src')) continue;
              const u=await photoUrl(im.dataset.pid);
              if(u) im.src=u; else im.alt='الصورة غير متوفرة';
            }
          }
          function shrink(file,max,q){
            return new Promise((res,rej)=>{
              const url=URL.createObjectURL(file),im=new Image();
              im.onload=()=>{
                let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));
                w=Math.round(w*k);h=Math.round(h*k);
                const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
                URL.revokeObjectURL(url);
                c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
              };
              im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
              im.src=url;
            });
          }
          async function addPhotos(files){
            for(const f of files){
              try{
                const b=await shrink(f,1600,0.72),id='p'+uid();
                await photoPut(id,b);
                const tr=S.ptarget&&db.records.find(x=>x.id===S.ptarget);
                if(tr){(tr.photos=tr.photos||[]).push(id);save();}else S.pend.push(id);
              }catch(e){toast('تعذّر حفظ الصورة');}
            }
            if(S.ptarget){const t=S.ptarget;S.ptarget='';recModal(t);render();}else renderPend();
          }

          /* ---------- حفظ المعطيات واسترجاعها ---------- */
          let BK=null;
          const lastBk=()=>{try{return localStorage.getItem('mjd_last_backup')||'';}catch(e){return '';}};
          const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?'':pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
          function bkBanner(){
            if(!db.records.length) return '';
            const l=lastBk(),days=l?(Date.now()-Date.parse(l))/864e5:999;
            if(days<7) return '';
            return `<div class="warn bk" data-act="gotodata">💾 ${l?'آخر نسخة احتياطية منذ '+Math.floor(days)+' أيام':'لم تحفظ نسخة احتياطية بعد'}. المس هنا لحفظ معطياتك.</div>`;
          }
          function nPhotos(){return db.records.reduce((n,r)=>n+(r.photos||[]).length,0);}
          function viewData(){
            const l=lastBk();
            return `<div class="title">💾 حفظ المعطيات واسترجاعها</div><div class="pad">
            <div class="prev"><b>${db.students.length}</b> تلميذ · <b>${db.records.length}</b> تسجيل · <b>${nPhotos()}</b> صورة<br><span class="muted">آخر نسخة احتياطية: ${l?fmtDT(l):'لم تُحفظ بعد'}</span></div>
