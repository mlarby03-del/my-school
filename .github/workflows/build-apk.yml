          function settingsModal(){
            modal(`<h3>⚙️ الإعدادات</h3><p class="muted">${db.students.length} تلميذ · ${classes().length} قسم · ${db.records.length} تسجيل</p>
            <div class="menu">
            <button class="btn" data-act="pick">📥 استيراد تلاميذ من Excel / CSV</button>
