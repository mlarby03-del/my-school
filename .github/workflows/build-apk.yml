            h+=`<div class="sum"><span>${fmtDate(S.date)}${S.cls?` · ${esc(S.cls)}: <b>${inCls}</b>`:''} · في المؤسسة: <b>${dayRecs.length}</b></span><button class="btn ghost sm" data-act="hist">📜 السجل</button></div>`;
            if(!S.cls) return h+'<p class="muted pad">اختر القسم لعرض تلاميذه، ثم المس اسم التلميذ لتسجيله.</p>';
            if(type==='late') h+=lateBar();
            const hint={abs:'المس مرة: غائب · مرتين: غائب مبرَّر · ثلاث: إلغاء',late:'المس اسم التلميذ لتسجيل التأخر (ومرة أخرى للإلغاء)',book:'المس اسم التلميذ لتسجيل عدم إحضار الدفتر',bad:'المس اسم التلميذ لتسجيل المشاغبة مع ملاحظة',conv:'المس اسم التلميذ لتسجيل استدعاء (الأستاذ المستدعي + السبب)',rpt:'المس اسم التلميذ لتسجيل تقرير (الأستاذ + السبب + صورة التقرير)'}[type];
            h+=`<p class="hint">${hint}</p>`;
