name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p www
          cat > package.json <<'EOF_PKG'
          {
            "name": "suivi-eleves",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          EOF_PKG
          cat > capacitor.config.json <<'EOF_CFG'
          {
            "appId": "dz.mjd.suivi",
            "appName": "متابعة التلاميذ",
            "webDir": "www"
          }
