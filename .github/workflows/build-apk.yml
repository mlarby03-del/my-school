          }
          function periodAct(a,d){
            const td=todayStr();
            if(a==='pset'){db.curP=d.id;}
            else if(a==='pdel'){db.periods=db.periods.filter(p=>p.id!==d.id);if(db.curP===d.id)db.curP='';save();periodModal();render();return;}
            else if(a==='padd'){
              const name=$('#p_name').value.trim(),from=$('#p_from').value,to=$('#p_to').value;
              if(!name||!from){toast('اكتب اسم الفترة وتاريخ البداية');return;}
              if(to&&to<from){toast('تاريخ النهاية قبل البداية');return;}
              const p={id:uid(),name,from,to};db.periods.push(p);db.curP=p.id;
            }else if(a==='pnew'){
              db.periods.filter(p=>!p.to&&p.from<td).forEach(p=>{p.to=addDays(td,-1);});
              const p={id:uid(),name:'الفصل '+(db.periods.length+1),from:td,to:''};db.periods.push(p);db.curP=p.id;
            }else if(a==='pyear'){
              const n=new Date(),y=n.getMonth()>=8?n.getFullYear():n.getFullYear()-1;
              const defs=[['الفصل الأول',y+'-09-01',y+'-12-31'],['الفصل الثاني',(y+1)+'-01-01',(y+1)+'-03-31'],['الفصل الثالث',(y+1)+'-04-01',(y+1)+'-07-15']];
              defs.forEach(([name,from,to])=>{if(!db.periods.some(p=>p.name===name&&p.from===from))db.periods.push({id:uid(),name,from,to});});
              const c=db.periods.find(p=>td>=p.from&&td<=p.to);if(c)db.curP=c.id;
            }
            save();closeM();render();toast(curPeriod()?'الفترة: '+curPeriod().name:'كل المدة');
          }

          /* ---------- بيانات التلميذ الإضافية ---------- */
          const EXK=['secret','father','motherLast','motherFirst','phone','address','sex','birth','birthPlace'];
          function extraFields(s,p){
            const o=(v,t)=>`<option value="${v}"${s.sex===v?' selected':''}>${t}</option>`;
            return `<label>اسم الأب</label><input id="${p}father" value="${esc(s.father||'')}" autocomplete="off">
            <label>لقب الأم</label><input id="${p}motherLast" value="${esc(s.motherLast||'')}" autocomplete="off">
            <label>اسم الأم</label><input id="${p}motherFirst" value="${esc(s.motherFirst||'')}" autocomplete="off">
            <label>رقم هاتف الولي</label><input id="${p}phone" type="tel" inputmode="tel" dir="ltr" value="${esc(s.phone||'')}" autocomplete="off">
            <label>العنوان (اكتب أو المس 🎤 وتكلّم)</label><div class="mrow"><input id="${p}address" value="${esc(s.address||'')}" autocomplete="off"><button type="button" class="mic" data-act="mic" data-for="${p}address" aria-label="إملاء صوتي">🎤</button></div>
            <label>🔒 ملاحظة سرية (حالة اجتماعية / صحية…) — لا تظهر إلا داخل بطاقة التلميذ</label><textarea id="${p}secret" rows="2">${esc(s.secret||'')}</textarea>
            <label>الجنس</label><select id="${p}sex"><option value="">—</option>${o('ذكر','ذكر')}${o('أنثى','أنثى')}</select>
            <label>تاريخ الميلاد</label><input id="${p}birth" type="date" value="${/^\d{4}-\d\d-\d\d$/.test(s.birth||'')?s.birth:''}">
            <label>مكان الميلاد</label><input id="${p}birthPlace" value="${esc(s.birthPlace||'')}" autocomplete="off">`;
          }
          function readExtra(p){
            const o={};
            EXK.forEach(k=>{const e=$('#'+p+k);const v=e?e.value.trim():'';if(v)o[k]=v;});
            return o;
          }
          function formStu(sid){
            const s=sid?byId(sid):{last:'',first:'',cls:S.lcls||S.cls||''};
            modal(`<h3>${sid?'تعديل تلميذ':'إضافة تلميذ'}</h3>
            <label>اللقب</label><input id="f_last" value="${esc(s.last)}">
            <label>الاسم</label><input id="f_first" value="${esc(s.first)}">
            <label>القسم</label><input id="f_cls" list="dl" value="${esc(s.cls)}"><datalist id="dl">${classes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
            ${extraFields(s,'f_')}
            <div class="acts"><button class="btn" data-act="savestu" data-sid="${sid||''}">حفظ</button><button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }
          function saveStu(sid){
            const last=$('#f_last').value.trim(),first=$('#f_first').value.trim(),cls=$('#f_cls').value.trim();
            if(!(last||first)||!cls){toast('اكتب الاسم والقسم');return;}
            const ex=readExtra('f_');
            if(sid){const s=byId(sid);Object.assign(s,{last,first,cls});EXK.forEach(k=>{if(ex[k]) s[k]=ex[k]; else delete s[k];});}
            else db.students.push({id:uid(),last,first,cls,...ex});
            save();closeM();render();toast('تم الحفظ');
          }

          /* ---------- الإملاء الصوتي ---------- */
          function micPut(el,t){el.value=(el.value?el.value+' ':'')+t;el.dispatchEvent(new Event('input',{bubbles:true}));toast('كُتب: '+t);}
          async function micFor(id){
            const el=$('#'+id);if(!el) return;
            try{
              const C=window.Capacitor;
              if(C&&C.isNativePlatform&&C.isNativePlatform()&&hasPlug('SpeechRecognition')){
                const SR=plug('SpeechRecognition');
                try{await SR.requestPermissions();}catch(e){}
                const r=await SR.start({language:'ar-DZ',maxResults:1,popup:true,prompt:'تكلّم الآن'});
                const t=r&&r.matches&&r.matches[0];
                if(t){micPut(el,t);return;}
              }else{
                const W=window.SpeechRecognition||window.webkitSpeechRecognition;
                if(W){const rc=new W();rc.lang='ar-DZ';rc.interimResults=false;rc.maxAlternatives=1;
                  rc.onresult=ev=>{const t=ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript;if(t) micPut(el,t);};
                  rc.onerror=()=>{el.focus();toast('تعذّر الإملاء. استعمل 🎤 في لوحة المفاتيح');};
                  rc.start();toast('🎤 تكلّم الآن…');return;}
              }
            }catch(e){}
            el.focus();toast('المس 🎤 في لوحة مفاتيح التليفون وتكلّم، يكتب لك ما تقول');
          }

          /* ---------- تفاصيل التسجيل: تبرير، وقت، ملاحظة، صور ---------- */
          function recCollect(rid){
            const r=db.records.find(x=>x.id===rid);if(!r) return;
            const g=id=>{const e=$('#'+id);return e?e.value.trim():null;};
            const nd=g('ri_date');if(nd&&/^\d{4}-\d\d-\d\d$/.test(nd)&&nd!==r.date){if(db.records.some(x=>x!==r&&x.type===r.type&&x.sid===r.sid&&x.date===nd)) toast('يوجد تسجيل من نفس النوع في ذلك اليوم'); else r.date=nd;}
            if(r.type==='abs'||r.type==='late'){const sh=g('ri_shift');if(sh!==null){if(sh) r.shift=sh; else delete r.shift;}}
            if(r.type==='abs'||r.type==='late'||r.type==='late10'){const j=g('ri_just');if(j!==null){if(j) r.just=true; else delete r.just;}}
            if(r.type==='late'||r.type==='late10'){const t=g('ri_time');if(t!==null){if(t) r.time=t; else delete r.time;}}
            if(r.type==='conv'){const c=g('ri_came'),cd=g('ri_cdate');if(c!==null){if(c){r.came=true;r.cdate=cd||todayStr();}else{delete r.came;delete r.cdate;}}}
            if(r.type==='conv'||r.type==='rpt'){const a=g('ri_teacher'),b=g('ri_reason');if(a!==null) r.teacher=a;if(b!==null) r.reason=b;}
            else{const n=g('ri_note');if(n!==null){if(n) r.note=n; else delete r.note;}}
            save();
          }
          function recModal(rid){
            const r=db.records.find(x=>x.id===rid);if(!r) return;
            const s=byId(r.sid),T=TYPES[r.type];if(!s) return;
            let b='';
            if(r.type==='abs'||r.type==='late') b+=`<label>${r.type==='abs'?'حالة الغياب':'حالة التأخر'}</label><select id="ri_just"><option value="">غير مبرر</option><option value="1"${r.just?' selected':''}>مبرر</option></select>`;
            if(r.type==='abs'||r.type==='late') b+=`<label>الفترة</label><select id="ri_shift"><option value="">—</option><option value="ص"${r.shift==='ص'?' selected':''}>صباحية</option><option value="م"${r.shift==='م'?' selected':''}>مسائية</option></select>`;
            if(r.type==='conv') b+=`<label>حضور الولي</label><select id="ri_came"><option value="">لم يحضر بعد</option><option value="1"${r.came?' selected':''}>تم حضور الولي</option></select><label>تاريخ الحضور</label><input type="date" id="ri_cdate" value="${esc(r.cdate||'')}">`;
            if(r.type==='late10') b+=`<label>حالة التأخر</label><select id="ri_just"><option value="">غير مبرر</option><option value="1"${r.just?' selected':''}>مبرر</option></select>`;
            if(r.type==='late'||r.type==='late10') b+=`<label>وقت الدخول</label><input type="time" id="ri_time" value="${esc(r.time||'')}">`;
            if(r.type==='conv'||r.type==='rpt') b+=`<label>الأستاذ</label><input id="ri_teacher" value="${esc(r.teacher||'')}"><label>السبب</label><textarea id="ri_reason" rows="3">${esc(r.reason||'')}</textarea>`;
            else b+=`<label>${r.type==='abs'?'ملاحظة (مثال: شهادة طبية)':'ملاحظة'}</label><div class="mrow"><textarea id="ri_note" rows="3">${esc(r.note||'')}</textarea><button type="button" class="mic" data-act="mic" data-for="ri_note" aria-label="إملاء صوتي">🎤</button></div>`;
            b=`<label>تاريخ التسجيل (تقدر تغيّر اليوم)</label><input type="date" id="ri_date" value="${esc(r.date)}">`+b;
            modal(`<h3>${T.icon} ${esc(nameOf(s))}</h3><p class="muted">${T.nav} · ${fmtDate(r.date)} · ${esc(s.cls)}</p>${b}
            <label>صور مرفقة (شهادة طبية، دفتر المراسلة…)</label>
            <div class="thumbs">${(r.photos||[]).map(id=>`<span class="th"><img data-pid="${id}" data-act="view" alt=""><button class="x" data-act="recphotodel" data-rid="${rid}" data-pid="${id}" aria-label="حذف الصورة">✕</button></span>`).join('')}</div>
            <div class="ph"><button class="btn ghost sm" data-act="recshoot" data-rid="${rid}">📷 تصوير</button><button class="btn ghost sm" data-act="recgallery" data-rid="${rid}">🖼️ من المعرض</button></div>
            <div class="acts"><button class="btn" data-act="recsave" data-rid="${rid}">حفظ</button><button class="btn danger" data-act="recdel" data-rid="${rid}">🗑️ حذف التسجيل</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            hydrate();
          }
          function recNote(r){
            let t='';
            if(r.type==='abs') t=(r.just?'مبرَّر':'غير مبرر')+(r.note?' — '+esc(r.note):'');
            else if(r.type==='late'||r.type==='late10') t=(r.time?'⏰ '+esc(r.time)+' · ':'')+(r.just?'مبرر':'غير مبرر')+(r.note?' — '+esc(r.note):'');
            else if(r.type==='conv'||r.type==='rpt') t=(r.type==='conv'?(r.came?'✅ حضر الولي · ':'⏳ لم يحضر · '):'')+esc((r.teacher||'')+(r.teacher&&r.reason?' — ':'')+(r.reason||''));
            else t=esc(r.note||'');
            return t+(r.photos&&r.photos.length?' 📷'+r.photos.length:'');
          }
          function lateBar(){
            return `<div class="bar"><label style="margin:0;white-space:nowrap">وقت الدخول</label><input type="time" id="ltime" value="${esc(S.ltime||'')}"><span class="muted" style="font-size:12px">فارغ = ساعة الهاتف الآن</span></div>`;
          }

          /* ---------- بطاقة التلميذ ---------- */
          function stuModal(sid){
            const s=byId(sid);if(!s) return;
            S.msid=sid;
            const c=counts()[sid]||zero();
            const recs=recsP().filter(r=>r.sid===sid).sort((a,b)=>b.date.localeCompare(a.date)||(b.time||'').localeCompare(a.time||''));
            const aj=recs.filter(r=>r.type==='abs'&&r.just).length,lj=recs.filter(r=>r.type==='late'&&r.just).length,cc=recs.filter(r=>r.type==='conv'&&r.came).length;
            const p=curPeriod();
            modal(`<h3>${esc(nameOf(s))}</h3><p class="muted">${esc(s.cls)}${s.father?' · الأب: '+esc(s.father):''}${motherName(s)?' · الأم: '+esc(motherName(s)):''}</p>
            ${s.secret?`<div class="warn" style="border:1px dashed var(--red)">🔒 <b>ملاحظة سرية:</b> ${esc(s.secret)}<br><small class="muted">للإدارة فقط — لا تُطبع ولا تُرسل.</small></div>`:''}
            ${s.phone?`<p class="muted" dir="ltr" style="text-align:right;margin:0">📞 ${esc(s.phone)}</p>`:''}${s.address?`<p class="muted" style="margin:0">🏠 ${esc(s.address)}</p>`:''}
            <div class="acts" style="margin:8px 0"><button class="btn ghost sm" data-act="parent" data-sid="${sid}">📞 الولي</button><button class="btn ghost sm" data-act="dec" data-sid="${sid}" data-type="late">📝 قرار التأخرات (${decOf(sid,'late').length})</button><button class="btn ghost sm" data-act="dec" data-sid="${sid}" data-type="abs">📝 قرار الغياب (${decOf(sid,'abs').length})</button><button class="btn ghost sm" data-act="jnew" data-sid="${sid}">🩺 تبرير (${db.justs.filter(j=>j.sid===sid).length})</button><button class="btn ghost sm" data-act="contacts" data-sid="${sid}">📒 الاتصالات (${cOf(sid).length})</button><button class="btn ghost sm" data-act="sfile" data-sid="${sid}">📄 ملف التلميذ</button><button class="btn ghost sm" data-act="editstu" data-sid="${sid}">✏️ تعديل</button></div>
            <label>سجّل في تاريخ</label><input type="date" id="qdate" value="${S.qdate}">
            <div class="qk">${Object.keys(TYPES).map(k=>{const r=findRec(k,sid,S.qdate);return `<button class="${r?'on':''}" data-act="quick" data-sid="${sid}" data-type="${k}"><span>${TYPES[k].icon}</span>${TYPES[k].nav}${r?(k==='abs'&&r.just?' (مبرر) ✓':' ✓'):''}</button>`;}).join('')}</div>
            <div class="stats">${Object.keys(TYPES).map(k=>`<div class="${c[k]>=3?'hot':''}"><b>${c[k]}</b><small>${TYPES[k].short}</small></div>`).join('')}</div>
            <p class="muted" style="font-size:13px;margin:4px 0">الغيابات: ${c.abs} (مبررة ${aj} · غير مبررة ${c.abs-aj})${p?' · '+esc(p.name):''}</p>
            <p class="muted" style="font-size:13px;margin:4px 0">التأخرات: ${c.late} (مبررة ${lj} · غير مبررة ${c.late-lj}) · الاستدعاءات: ${c.conv} (حضر الولي ${cc})</p>
            ${c.late>=3?`<p class="warn">⏰ تأخر ${c.late} مرات${lateTail(sid)}</p>`:''}
            <div class="hl">${recs.length?recs.map(r=>`<div class="row hr" data-act="recinfo" data-rid="${r.id}"><span class="sub">${fmtDate(r.date)}</span><span class="nm">${TYPES[r.type].icon} ${TYPES[r.type].nav}</span><span class="st">${recNote(r)}</span><button class="x" data-act="delrec2" data-rid="${r.id}" data-sid="${sid}" aria-label="حذف">✕</button></div>`).join(''):'<p class="muted">لا توجد تسجيلات</p>'}</div>
            <p class="muted" style="font-size:12px">المس أي تسجيل لتعديله، تبرير الغياب، أو إرفاق صورة.</p>
            <div class="acts"><button class="btn danger" data-act="delstu" data-sid="${sid}">🗑️ حذف التلميذ</button><button class="btn" data-act="closem">إغلاق</button></div>`);
          }

          /* ---------- استدعاء الولي ---------- */
          function times(n){return n===1?'مرة واحدة':n===2?'مرتين':n<=10?n+' مرات':n+' مرة';}
          function parentMsg(s,why){
            const c=counts()[s.id]||zero(),m=s.sex!=='أنثى',kid=m?'ابنكم':'ابنتكم',nm=nameOf(s);
            if(why==='auto'){why=['late','abs','book','bad','conv','rpt'].sort((a,b)=>c[b]-c[a])[0];if(!c[why]) why='gen';}
            let t;
            if(why==='late') t=`نعلمكم أن ${kid} ${nm} ${m?'تأخر':'تأخرت'} ${times(c.late)}. المرجو الحضور إلى الإدارة.`;
            else if(why==='abs') t=`نعلمكم أن ${kid} ${nm} ${m?'غاب':'غابت'} ${times(c.abs)}. المرجو الحضور إلى الإدارة لتبرير الغياب.`;
            else if(why==='book') t=`نعلمكم أن ${kid} ${nm} ${m?'لم يحضر':'لم تحضر'} دفتر المراسلة ${times(c.book)}. المرجو المتابعة.`;
            else if(why==='bad') t=`نعلمكم أنه سُجّلت على ${kid} ${nm} ${c.bad} ملاحظات سلوكية. المرجو الحضور إلى الإدارة.`;
            else if(why==='conv'||why==='rpt') t=`نعلمكم أنه تم استدعاؤكم بخصوص ${kid} ${nm}. المرجو الحضور إلى الإدارة.`;
            else t=`المرجو الحضور إلى الإدارة بخصوص ${kid} ${nm}.`;
            return 'السلام عليكم، '+t+'\n'+SCHOOL;
          }
          function waNum(p){
            let d=String(p||'').replace(/\D/g,'');
            if(d.startsWith('00')) d=d.slice(2);
            else if(d.startsWith('0')) d='213'+d.slice(1);
            else if(/^[567]\d{8}$/.test(d)) d='213'+d;
            return d.length>=9?d:'';
          }
          function pmLinks(){
            const box=$('#pmlinks');if(!box) return;
            const ph=$('#pm_phone').value,tx=$('#pm_text').value,wa=waNum(ph),tel=ph.replace(/[^\d+]/g,'');
            box.innerHTML=!wa?'<p class="muted">أدخل رقم هاتف الولي لتفعيل الأزرار.</p>':
              `<a class="btn" data-plog="call" data-sid="${esc(box.dataset.sid||'')}" href="tel:${esc(tel)}">📞 اتصال مباشر</a><a class="btn" href="https://wa.me/${wa}?text=${encodeURIComponent(tx)}" target="_blank" rel="noopener" data-plog="wa" data-sid="${esc(box.dataset.sid||'')}">💬 واتساب</a><a class="btn ghost" data-plog="sms" data-sid="${esc(box.dataset.sid||'')}" href="sms:${esc(tel)}?body=${encodeURIComponent(tx)}">✉️ SMS</a>`;
          }
          function parentModal(sid){
            const s=byId(sid);if(!s) return;
            modal(`<h3>📞 استدعاء الولي</h3><p class="muted">${esc(nameOf(s))} · ${esc(s.cls)}${s.father?' · الأب: '+esc(s.father):''}</p>
            <label>رقم هاتف الولي (يُحفظ تلقائيا)</label><input id="pm_phone" type="tel" inputmode="tel" dir="ltr" value="${esc(s.phone||'')}" data-sid="${sid}" autocomplete="off">
            <label>سبب الاستدعاء</label><select id="pm_why" data-sid="${sid}"><option value="auto">تلقائي (الأكثر تكرارا)</option>${Object.keys(TYPES).map(k=>`<option value="${k}">${TYPES[k].nav}</option>`).join('')}<option value="gen">عام</option></select>
            <label>أو اختر قالبا <button type="button" class="btn ghost sm" data-act="tpl" data-back="${sid}" style="padding:2px 8px;font-size:12px">✏️ تعديل القوالب</button></label><select id="pm_tpl" data-sid="${sid}"><option value="">—</option>${db.templates.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select>
            <label>نص الرسالة (تقدر تعدله)</label><textarea id="pm_text" rows="5">${esc(parentMsg(s,'auto'))}</textarea>
            <div id="pmlinks" class="acts" data-sid="${sid}"></div>
            <div class="acts"><button class="btn ghost" data-act="stu" data-sid="${sid}">→ بطاقة التلميذ</button><button class="btn ghost" data-act="closem">إغلاق</button></div>`);
            pmLinks();
          }

          /* ---------- التنبيهات الذكية ---------- */
          function alertList(){
            const st=db.settings,c={};
            recsP().forEach(r=>{
              if(r.type!=='late'&&r.type!=='abs') return;
              {const ld=decDate(r.sid,r.type);if(ld&&r.date<=ld) return;}
              const o=c[r.sid]||(c[r.sid]={late:0,lu:0,abs:0,j:0,uj:0});
              if(r.type==='late'){o.late++;if(!r.just) o.lu++;} else{o.abs++;if(r.just) o.j++; else o.uj++;}
            });
            return Object.keys(c).filter(k=>byId(k)&&(c[k].lu>=st.lateMax||c[k].uj>=st.absMax)).map(k=>({s:byId(k),...c[k]})).sort((a,b)=>(b.late+b.uj)-(a.late+a.uj));
          }
          function alertsHtml(){
            if(!db.records.length) return '';
            const L=alertList(),st=db.settings,show=S.alertAll?L:L.slice(0,5);
            return `<div class="alerts"><div class="ah"><b>⚠️ تنبيهات (${L.length})</b><button class="btn ghost sm" data-act="alertcfg">⚙️ الحدود</button></div>`+
              (L.length?show.map(o=>`<button class="row" data-act="stu" data-sid="${o.s.id}"><span class="nm">${esc(nameOf(o.s))}<br><small class="muted">${esc(o.s.cls)}</small></span><span class="rc hot">⏰${o.late} · 🚫${o.abs}${o.j?' ('+o.j+' مبرر)':''}</span></button>`).join('')+(L.length>5?`<button class="btn ghost sm" data-act="alertall" style="margin:8px 12px">${S.alertAll?'إخفاء':'عرض الكل ('+L.length+')'}</button>`:''):
