              const r=mkRec('late',d.sid,dt);r.shift=d.v;
              if(!S.ltime&&(dt!==todayStr()||(nowHM()<'13:00'?'ص':'م')!==d.v)) delete r.time;
              db.records.push(r);save();render();stuModal(d.sid);return;
            }
            _ec12(a,d,el,e);
          };

          const sgSeg=c=>`<div class="seg"><button class="${c==='tch'?'on':''}" data-act="tab" data-tab="tch">🧑‍🏫 الأساتذة والتعويض</button><button class="${c==='stf'?'on':''}" data-act="tab" data-tab="stf">📋 غيابات وتأخرات الطاقم</button></div>`;
          const _vt14=viewTeachers;viewTeachers=function(){return sgSeg('tch')+_vt14();};
          const _vs14=viewStaff;viewStaff=function(){return sgSeg('stf')+_vs14();};

          /* ---------- التقرير الشهري للمستشار ---------- */
          const MNAMES=['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
          S.mmonth=S.mmonth||todayStr().slice(0,7);
          const mmR=ym=>(db.reps['M'+ym]=db.reps['M'+ym]||{});
          function mmDays(ym){
            const R=db.reps['M'+ym]||{};if(R.days) return +R.days;
            const t=todayStr(),last=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();let n=0;
            for(let i=1;i<=last;i++){const d=ym+'-'+String(i).padStart(2,'0');if(d>t) break;if(isSchoolDay(d)) n++;}
            return n;
          }
          function mmData(ym){
            const days=mmDays(ym)||1,cs=classes().slice().sort(cmpNat);
            const recs=db.records.filter(r=>r.date.slice(0,7)===ym);
            const rows=cs.map(c=>{
              const st=studentsOf(c),ids=new Set(st.map(s=>s.id)),rr=recs.filter(r=>ids.has(r.sid));
              const ab=rr.filter(r=>r.type==='abs'),o={c,l:levelOf(c),n:st.length,
                as:new Set(ab.map(r=>r.sid)).size,ad:ab.length,aj:ab.filter(r=>r.just).length};
              ['late','late10','wc','yard','esc'].forEach(k=>o[k]=rr.filter(r=>r.type===k).length);
              o.lj=rr.filter(r=>r.type==='late'&&r.just).length;
              o.rate=o.n?o.ad/(o.n*days)*100:0;return o;
            });
            const lv=[4,3,2,1].map(l=>{
              const g=rows.filter(o=>o.l===l),t={l,n:0,as:0,ad:0,aj:0,late:0,late10:0,wc:0,yard:0,esc:0,lj:0};
              g.forEach(o=>Object.keys(t).forEach(k=>{if(k!=='l') t[k]+=o[k];}));
              t.rate=t.n?t.ad/(t.n*days)*100:0;return {l,g,t};
            }).filter(x=>x.g.length);
            const T={n:0,as:0,ad:0,aj:0,late:0,late10:0,wc:0,yard:0,esc:0,lj:0};
            lv.forEach(x=>Object.keys(T).forEach(k=>T[k]+=x.t[k]));T.rate=T.n?T.ad/(T.n*days)*100:0;
            const md=monthData(ym,'');
            const topA=md.filter(o=>o.abs>0).sort((a,b)=>b.abs-a.abs||cmpName(a.s,b.s)).slice(0,10);
            const topL=md.filter(o=>o.late+o.late10>0).sort((a,b)=>(b.late+b.late10)-(a.late+a.late10)||cmpName(a.s,b.s)).slice(0,10);
            // الأساتذة
            const tabs=db.tabs.filter(t=>t.date.slice(0,7)===ym),tmap={};
            const dset=[...new Set(tabs.map(t=>t.date))];
            dset.forEach(D=>{msData(D).ta.forEach(o=>{const m=tmap[o.t.tid]=tmap[o.t.tid]||{name:o.T.name,subj:o.T.subject||'',d:0,les:0};m.d++;m.les+=o.cells.filter(Boolean).length;});});
            const subs=db.subs.filter(s=>s.date&&s.date.slice(0,7)===ym).length;
            const tev=db.pev.filter(e=>e.p==='T'&&e.date.slice(0,7)===ym),sev=db.pev.filter(e=>e.p==='S'&&e.date.slice(0,7)===ym);
            const cnt=(a,t)=>a.filter(e=>e.type===t).length;
            return {days,rows,lv,T,topA,topL,tch:Object.values(tmap).sort((a,b)=>b.d-a.d),subs,tev,sev,
              tabsN:tabs.length,health:db.health.length,reqs:db.requests.filter(r=>(r.date||'').slice(0,7)===ym).length,cnt};
          }
          function mmDoc(ym){
            const d=mmData(ym),R=mmR(ym),P=v=>esc(String(v==null?'':v)),mn=MNAMES[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
            const bx=(h,t)=>`<div style="border:1px solid #000;min-height:${h}px;padding:4px;font-size:11px;white-space:pre-wrap">${t?P(t):''}</div>`;
            const css=`<style>.ms{width:794px;direction:rtl;font-family:Tahoma,Arial,sans-serif;color:#000;background:#fff}.ms .pg{width:794px;height:1123px;box-sizing:border-box;padding:26px 32px;position:relative;overflow:hidden;background:#fff}.ms table{border-collapse:collapse;width:100%}.ms td,.ms th{border:1px solid #000;text-align:center;padding:1px 3px;font-size:11px;height:20px;font-weight:normal}.ms th{font-weight:bold;background:#e8e8e8}.ms h4{margin:10px 0 4px;font-size:13px}</style>`;
            const cell=(v)=>`<td>${v||''}</td>`;
