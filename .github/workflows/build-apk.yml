name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create app project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/speech-recognition@6 xlsx
          mkdir www
          cat > www/index.html <<'HTML_END'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>متابعة التلاميذ</title>
          <style>
          :root{--p:#0f766e;--bg:#f3f6f6;--card:#fff;--tx:#1b2b2b;--mu:#6b7c7c;--bd:#dde6e6}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
          header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
          header h1{margin:0;font-size:18px}
          main{padding:12px 12px 90px}
          nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
          nav button{flex:1;border:0;background:none;padding:7px 0 6px;font-size:10.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
          nav button i{font-style:normal;font-size:19px}
          nav button.on{color:var(--p);font-weight:700}
          .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
          input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx)}
          .row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--bd)}
          .row:last-child{border:0}
          .grow{flex:1;min-width:0}
          .nm{font-weight:600}
          .sub{font-size:13px;color:var(--mu)}
          .b{display:inline-block;min-width:24px;padding:2px 8px;border-radius:99px;color:#fff;font-size:13px;text-align:center;white-space:nowrap}
          .chip{display:inline-block;background:#eef3f3;border-radius:8px;padding:2px 7px;font-size:12px;margin:3px 0 0 4px}
          .btn{border:0;border-radius:10px;padding:12px;font-size:15px;color:#fff;font-family:inherit;font-weight:600;background:var(--p)}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
          .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
          .stat{background:#fff;border:2px solid;border-radius:10px;text-align:center;padding:6px 2px;font-size:11px;color:var(--mu)}
          .stat b{display:block;font-size:22px}
          .q{width:42px;height:36px;border-radius:9px;border:1px solid var(--bd);background:#fff;font-weight:700;font-family:inherit;font-size:15px}
          .q.on{color:#fff;border-color:transparent}
          .idx{width:26px;color:var(--mu);font-size:13px;text-align:center}
          .warn{background:#fff3e0;border:1px solid #ffb74d;border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
          .empty{text-align:center;color:var(--mu);padding:30px 10px}
          #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-end}
          #modal.on{display:flex}
          .sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
          .sheet h2{margin:0 0 2px;font-size:19px}
          .sheet h3{font-size:15px;margin:14px 0 4px}
          .del{border:0;background:none;font-size:18px}
          .fld{display:flex;gap:6px;margin-top:8px}
          .fld input{flex:1;min-width:0}
          .mic{width:50px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-size:20px}
          #toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
          #toast.on{display:block}
          </style>
          </head>
          <body>
          <header><h1 id="ttl">متابعة التلاميذ</h1></header>
          <main id="main"></main>
          <nav id="nav"></nav>
          <div id="modal"></div>
          <div id="toast"></div>
          <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
          <script src="xlsx.full.min.js"></script>
          <script>
          const T={
           abs:{n:'الغيابات',s:'غياب',c:'#e53935',i:'🚫'},
           late:{n:'التأخرات',s:'تأخر',c:'#fb8c00',i:'⏰'},
           book:{n:'دفتر المراسلة',s:'نسيان دفتر المراسلة',c:'#8e24aa',i:'📒'},
           bad:{n:'المشاغبون',s:'شغب',c:'#3949ab',i:'⚠️'}
          };
          const ALERT=3; // عدد التسجيلات الذي يظهر بعده تنبيه "متكرر"
          const TABS=[['search','🔍','بحث'],['abs','🚫','غياب'],['late','⏰','تأخر'],['book','📒','الدفاتر'],['bad','⚠️','مشاغبون'],['lists','👥','الأقسام'],['set','⚙️','إعدادات']];
          const TITLES={search:'متابعة التلاميذ',abs:'الغيابات',late:'التأخرات',book:'دفتر المراسلة',bad:'التلاميذ المشاغبون',lists:'قوائم الأقسام',set:'الإعدادات'};

          let DB=(function(){try{const d=JSON.parse(localStorage.getItem('suivi_db'));if(d&&d.students&&d.records)return d}catch(e){}return{students:[],records:[]}})();
          function save(){try{localStorage.setItem('suivi_db',JSON.stringify(DB))}catch(e){alert('تعذر الحفظ')}}
          const $=id=>document.getElementById(id);
          const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          function norm(s){return String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim()}
          const pad=n=>String(n).padStart(2,'0');
          function ds(off){const d=new Date();d.setDate(d.getDate()-(off||0));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
          const fmt=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
          const fmtS=d=>d.slice(8,10)+'/'+d.slice(5,7);
          const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

          let MAP={},NORM={};
          function reindex(){MAP={};NORM={};DB.students.forEach(s=>{MAP[s.id]=s;NORM[s.id]=norm(s.name)})}
          reindex();
          const classes=()=>[...new Set(DB.students.map(s=>s.cls))].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));
          const recs=(sid,k)=>DB.records.filter(r=>r.sid===sid&&(!k||r.type===k));
          function addRec(sid,type,date,note){DB.records.push({id:uid(),sid,type,date,note:note||''});save()}

          let tab='search',F={cls:'',per:'all'},L={cls:''},M={};
          let tt;function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',1800)}

          function badges(id){return Object.keys(T).map(k=>{const n=recs(id,k).length;return n?`<span class="b" style="background:${T[k].c}">${T[k].i} ${n}</span>`:''}).join(' ')}
          function matches(q){const toks=norm(q).split(' ').filter(Boolean);if(!toks.length)return[];return DB.students.filter(s=>toks.every(t=>NORM[s.id].includes(t)))}

          /* ---------- العرض ---------- */
          function render(){
           $('nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('');
           $('ttl').textContent=TITLES[tab];
           const m=$('main');
           if(T[tab])m.innerHTML=vType(tab);
           else if(tab==='lists')m.innerHTML=vLists();
           else if(tab==='set')m.innerHTML=vSet();
           else{m.innerHTML=vSearch();$('q').oninput=fillRes;fillRes()}
          }
          function vSearch(){
           const td=ds(0);
           return '<input id="q" type="search" placeholder="🔍 ابحث عن تلميذ بالاسم أو اللقب..." autocomplete="off">'+
           '<div class="grid4">'+Object.keys(T).map(k=>`<div class="stat" style="border-color:${T[k].c}"><b style="color:${T[k].c}">${DB.records.filter(r=>r.type===k&&r.date===td).length}</b>${T[k].n}<br>اليوم</div>`).join('')+'</div><div id="res"></div>';
          }
          function fillRes(){
           const r=$('res');if(!r)return;
           if(!DB.students.length){r.innerHTML='<div class="empty">لم تستورد قائمة التلاميذ بعد.<br><br><button class="btn" data-a="tab" data-v="set">⚙️ اذهب إلى الإعدادات</button></div>';return}
           const q=$('q').value;
           if(!norm(q)){r.innerHTML='<div class="empty">اكتب اسم التلميذ ثم اضغط عليه لتسجيل غياب أو تأخر...</div>';return}
           const l=matches(q);
           r.innerHTML=l.length?'<div class="card">'+l.slice(0,40).map(s=>`<div class="row" data-a="stu" data-v="${esc(s.id)}"><div class="grow"><div class="nm">${esc(s.name)}</div><div class="sub">${esc(s.cls)}</div></div><div>${badges(s.id)}</div></div>`).join('')+'</div>':'<div class="empty">لا توجد نتيجة</div>';
          }
          function vType(k){
           const cl=classes();
           let h=`<div class="card"><div class="grid"><select data-s="cls"><option value="">كل الأقسام</option>${cl.map(c=>`<option ${F.cls===c?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select>`+
           `<select data-s="per">${[['all','الكل'],['today','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر']].map(p=>`<option value="${p[0]}" ${F.per===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>`+
           `<button class="btn" style="background:${T[k].c};width:100%;margin-top:8px" data-a="pick" data-v="${k}">＋ تسجيل ${T[k].s}</button></div>`;
           const td=ds(0),wk=ds(6),mo=td.slice(0,7);
           const rs=DB.records.filter(r=>r.type===k&&MAP[r.sid]&&(!F.cls||MAP[r.sid].cls===F.cls)&&(F.per==='all'||(F.per==='today'&&r.date===td)||(F.per==='week'&&r.date>=wk)||(F.per==='month'&&r.date.slice(0,7)===mo)));
           const g={};rs.forEach(r=>(g[r.sid]=g[r.sid]||[]).push(r));
           const ids=Object.keys(g).sort((a,b)=>g[b].length-g[a].length||MAP[a].name.localeCompare(MAP[b].name,'ar'));
           h+=`<div class="sub" style="margin:0 4px 6px">${rs.length} تسجيل · ${ids.length} تلميذ (الأكثر تكراراً أولاً)</div>`;
           if(!ids.length)return h+'<div class="empty">لا توجد تسجيلات</div>';
           h+='<div class="card">'+ids.map(id=>{
            const s=MAP[id],n=g[id].length,ds2=g[id].map(r=>r.date).sort().reverse();
            const hot=n>=ALERT;
            return `<div class="row" data-a="stu" data-v="${esc(id)}"><div class="grow"><div class="nm">${esc(s.name)} ${hot?'⚠️':''}</div><div class="sub">${esc(s.cls)}${hot?' · متكرر':''}</div><div>${ds2.slice(0,8).map(d=>`<span class="chip">${fmtS(d)}</span>`).join('')}${ds2.length>8?'<span class="chip">…</span>':''}</div></div><span class="b" style="background:${hot?'#d32f2f':T[k].c};font-size:16px">${n}</span></div>`}).join('')+'</div>';
           return h;
          }
          function vLists(){
           const cl=classes();
           if(!cl.length)return '<div class="empty">لم تستورد قائمة التلاميذ بعد.<br><br><button class="btn" data-a="tab" data-v="set">⚙️ اذهب إلى الإعدادات</button></div>';
           if(!L.cls||!cl.includes(L.cls))L.cls=cl[0];
           const td=ds(0);
           const st=DB.students.filter(s=>s.cls===L.cls);
           let h=`<div class="card"><select data-s="lcls">${cl.map(c=>`<option value="${esc(c)}" ${L.cls===c?'selected':''}>${esc(c)} (${DB.students.filter(s=>s.cls===c).length})</option>`).join('')}</select><div class="sub" style="margin-top:6px">زر <b>غ</b> = غياب اليوم · زر <b>ت</b> = تأخر اليوم (اضغط مرة ثانية للإلغاء)</div><button class="btn" style="width:100%;margin-top:10px" data-a="exp1">📤 تصدير هذا القسم إلى Excel</button></div><div class="card">`;
           h+=st.map((s,i)=>{
            const a=DB.records.some(r=>r.sid===s.id&&r.type==='abs'&&r.date===td),l=DB.records.some(r=>r.sid===s.id&&r.type==='late'&&r.date===td);
            return `<div class="row"><div class="idx">${i+1}</div><div class="grow" data-a="stu" data-v="${esc(s.id)}"><div class="nm">${esc(s.name)}</div>${s.phone?'<div class="sub">📞 '+esc(s.phone)+'</div>':''}</div>`+
            `<button class="q ${a?'on':''}" style="${a?'background:'+T.abs.c:''}" data-a="q" data-t="abs" data-v="${esc(s.id)}">غ</button>`+
            `<button class="q ${l?'on':''}" style="${l?'background:'+T.late.c:''}" data-a="q" data-t="late" data-v="${esc(s.id)}">ت</button></div>`}).join('');
           return h+'</div>';
          }
          function vSet(){
           const cl=classes();
           return `<div class="card"><h3 style="margin-top:0">📥 استيراد قائمة التلاميذ</h3>
           <div class="sub" style="margin-bottom:10px">ملف Excel فيه عمود للقسم وعمود للاسم (واللقب). عمود الهاتف والعنوان اختياري، ويمكنك إضافتهما يدوياً لكل تلميذ. أو ورقة (Sheet) لكل قسم باسم القسم. إعادة الاستيراد لا تحذف التسجيلات السابقة للتلاميذ الموجودين.</div>
           <button class="btn" style="width:100%" data-a="imp">اختيار ملف Excel</button></div>
           <div class="card"><h3 style="margin-top:0">📊 الحالة</h3><div>${DB.students.length} تلميذ · ${cl.length} قسم · ${DB.records.length} تسجيل</div>
           <div style="margin-top:6px">${cl.map(c=>`<span class="chip">${esc(c)}: ${DB.students.filter(s=>s.cls===c).length}</span>`).join('')}</div></div>
           <div class="card"><h3 style="margin-top:0">📤 تصدير Excel</h3><div class="sub" style="margin-bottom:8px">ملف واحد فيه ورقة لكل قسم: الاسم، القسم، الهاتف، العنوان، وعدد الغيابات والتأخرات والدفاتر والشغب. بعد التصدير تختار حفظ أو إرسال الملف.</div><button class="btn" style="width:100%" data-a="expall">تصدير كل الأقسام</button></div>
           <div class="card"><h3 style="margin-top:0">💾 نسخة احتياطية</h3><div class="sub" style="margin-bottom:8px">البيانات محفوظة في الهاتف. انسخها واحفظها في مكان آمن (ملاحظات / واتساب) قبل حذف التطبيق.</div>
           <div class="grid"><button class="btn" data-a="bk">📋 نسخ البيانات</button><button class="btn" style="background:#546e7a" data-a="rs">📤 استرجاع</button></div></div>
           <div class="card"><h3 style="margin-top:0">🗑 حذف</h3><div class="grid"><button class="btn" style="background:#e53935" data-a="clr_rec">حذف التسجيلات</button><button class="btn" style="background:#b71c1c" data-a="clr_all">حذف كل شيء</button></div></div>`;
          }

          /* ---------- نافذة التلميذ ---------- */
          function openM(h){$('modal').innerHTML=h;$('modal').className='on'}
          const FLD={ph:'phone',ad:'addr',fa:'father',ml:'mlast',mn:'mfirst'};
          let LANG='ar-DZ';
          const langLbl=()=>'🎤 الإملاء: '+(LANG==='ar-DZ'?'العربية':'Français');
          const fld=(id,ph,v)=>`<div class="fld"><input id="${id}" placeholder="${ph}" value="${esc(v||'')}"><button type="button" class="mic" data-a="mic" data-v="${id}">🎤</button></div>`;
          function saveInfo(){if(!$('ph')||!M.sid||!MAP[M.sid])return;const s=MAP[M.sid];let ch=false;Object.keys(FLD).forEach(id=>{const e=$(id);if(!e)return;const v=e.value.trim();if((s[FLD[id]]||'')!==v){s[FLD[id]]=v;ch=true}});if(ch)save()}
          function webDictate(el){
           const R=window.SpeechRecognition||window.webkitSpeechRecognition;
           if(!R){alert('الإملاء الصوتي غير متوفر هنا. اضغط على الخانة واستعمل ميكروفون لوحة المفاتيح.');return}
           const r=new R();r.lang=LANG;r.interimResults=false;
           r.onresult=e=>{const t=e.results[0][0].transcript;el.value=(el.value?el.value+' ':'')+t};
           r.onerror=()=>toast('تعذر التسجيل');
           r.start();toast('🎤 تكلم الآن...');
          }
          async function dictate(id){
           const el=$(id);if(!el)return;
           const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeechRecognition;
           if(!P){webDictate(el);return}
           try{
            const p=await P.requestPermissions();
            if(p&&p.speechRecognition&&p.speechRecognition!=='granted'){alert('اسمح للتطبيق باستعمال الميكروفون من إعدادات الهاتف.');return}
            const r=await P.start({language:LANG,maxResults:1,prompt:'تكلم الآن',popup:true});
            const t=r&&r.matches&&r.matches[0];
            if(t){el.value=(el.value?el.value+' ':'')+t;toast('✓ '+t)}
           }catch(e){
            if(/cancel|no match|didn't|aborted/i.test(String(e&&e.message||e)))return;
            alert('تعذر الإملاء الصوتي. اضغط على الخانة واستعمل ميكروفون لوحة المفاتيح.');
           }
          }
          function closeM(){saveInfo();$('modal').className='';$('modal').innerHTML='';M={};if(tab==='search')fillRes();else render()}
          function showStu(id){M={mode:'stu',sid:id,date:M.date||ds(0)};drawStu()}
          function drawStu(){
           saveInfo();
           const s=MAP[M.sid];if(!s)return closeM();
           const late=recs(s.id,'late');
           let h=`<div class="sheet"><h2>${esc(s.name)}</h2><div class="sub">${esc(s.cls)}</div>`;
           if(late.length>=ALERT)h+=`<div class="warn">⚠️ هذا التلميذ تأخر <b>${late.length}</b> مرات:<br>${late.map(r=>r.date).sort().reverse().map(d=>`<span class="chip">${fmtS(d)}</span>`).join('')}</div>`;
           h+=`<div class="grid4">${Object.keys(T).map(k=>`<div class="stat" style="border-color:${T[k].c}"><b style="color:${T[k].c}">${recs(s.id,k).length}</b>${T[k].n}</div>`).join('')}</div>`;
           h+=`<div class="card"><div class="sub" style="margin-bottom:6px">بيانات التلميذ (تُحفظ تلقائياً)</div><input id="ph" type="tel" inputmode="tel" placeholder="📞 رقم الهاتف" value="${esc(s.phone||'')}">${fld('fa','👨 اسم الأب',s.father)}${fld('ml','👩 لقب الأم',s.mlast)}${fld('mn','👩 اسم الأم',s.mfirst)}${fld('ad','🏠 العنوان',s.addr)}<div class="sub" style="margin-top:6px">زر 🎤 بجانب الخانة: تكلم فيكتب لك ما قلته.</div><div class="grid" style="margin-top:6px"><button class="btn" style="background:#546e7a" data-a="lang">${langLbl()}</button><button class="btn" style="background:#546e7a" data-a="sinfo">حفظ البيانات</button></div></div>`;
           h+=`<div class="grid"><input type="date" id="dt" value="${M.date}"><input id="nt" placeholder="ملاحظة (اختياري)"></div><div class="grid" style="margin-top:8px">${Object.keys(T).map(k=>`<button class="btn" style="background:${T[k].c}" data-a="add" data-v="${k}">${T[k].i} ${T[k].s}</button>`).join('')}</div>`;
           const all=recs(s.id).sort((a,b)=>b.date.localeCompare(a.date));
           h+='<h3>السجل</h3>'+(all.length?all.map(r=>`<div class="row"><div class="grow"><div class="nm" style="color:${T[r.type].c}">${T[r.type].i} ${T[r.type].s}</div><div class="sub">${fmt(r.date)}${r.note?' · '+esc(r.note):''}</div></div><button class="del" data-a="del" data-v="${r.id}">🗑</button></div>`).join(''):'<div class="sub">لا توجد تسجيلات</div>');
           h+='<button class="btn" data-a="close" style="width:100%;background:#607d8b;margin-top:14px">إغلاق</button></div>';
           openM(h);
          }
          /* ---------- نافذة التسجيل السريع ---------- */
          function showPick(type){
           M={mode:'pick',type};
           openM(`<div class="sheet"><h2>${T[type].i} تسجيل ${T[type].s}</h2><div class="sub" style="margin-bottom:8px">اكتب الاسم ثم اضغط على التلميذ ليُسجَّل اليوم</div><input id="pq" type="search" placeholder="🔍 اسم التلميذ..." autocomplete="off"><div id="pres"></div><button class="btn" data-a="close" style="width:100%;background:#607d8b;margin-top:12px">إغلاق</button></div>`);
           $('pq').oninput=fillPick;fillPick();setTimeout(()=>$('pq')&&$('pq').focus(),150);
          }
          function fillPick(){
           const l=matches($('pq').value),td=ds(0),k=M.type;
           $('pres').innerHTML=l.length?l.slice(0,30).map(s=>{const t=DB.records.some(r=>r.sid===s.id&&r.type===k&&r.date===td);return `<div class="row" data-a="padd" data-v="${esc(s.id)}"><div class="grow"><div class="nm">${esc(s.name)}</div><div class="sub">${esc(s.cls)}</div></div>${t?'<span class="b" style="background:#2e7d32">✓ اليوم</span>':''}<span class="b" style="background:${T[k].c}">${recs(s.id,k).length}</span></div>`}).join(''):'';
          }

          /* ---------- الاستيراد ---------- */
          const NAME_OK=/اسم|لقب|nom|prénom|prenom|name|تلميذ|eleve|élève/i;
          const NAME_BAD=/رقم|num|matri|\bid\b|تاريخ|date|ميلاد|naiss|مكان|lieu|جنس|sexe|n°|الأب|الاب|الأم|الام|père|pere|mère|mere|هاتف|عنوان|adresse/i;
          const CLS_RE=/قسم|فوج|class|section|groupe/i;
          const PH_RE=/هاتف|جوال|نقال|tel|phone|mobile/i;
          const AD_RE=/عنوان|adresse|address/i;
          function parseWB(wb){
           const out=[];
           wb.SheetNames.forEach(sn=>{
            const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});
            let h=-1,nc=[0],cc=-1,pc=-1,ac=-1;
            for(let i=0;i<Math.min(rows.length,15);i++){
             const r=rows[i].map(x=>String(x).trim());
             const c=r.findIndex(x=>x&&CLS_RE.test(x)&&!NAME_BAD.test(x));
             const n=[];r.forEach((x,j)=>{if(x&&j!==c&&NAME_OK.test(x)&&!NAME_BAD.test(x)&&!CLS_RE.test(x))n.push(j)});
             if(n.length){h=i;nc=n;cc=c;pc=r.findIndex(x=>x&&PH_RE.test(x));ac=r.findIndex(x=>x&&AD_RE.test(x));break}
            }
            let last=sn.trim();
            for(let i=h+1;i<rows.length;i++){
             const r=rows[i];
             const name=nc.map(j=>String(r[j]==null?'':r[j]).trim()).filter(Boolean).join(' ').replace(/\s+/g,' ');
             if(cc>=0){const c=String(r[cc]==null?'':r[cc]).trim();if(c)last=c}
             if(!name||/^[\d\s.\-\/]+$/.test(name))continue;
             const g=j=>j>=0?String(r[j]==null?'':r[j]).trim():'';
             out.push({name,cls:last,phone:g(pc),addr:g(ac)});
            }
           });
           const seen={};
           return out.map(o=>{let id=o.cls+'|'+o.name;if(seen[id]){seen[id]++;id+='#'+seen[id]}else seen[id]=1;return{id,name:o.name,cls:o.cls,phone:o.phone,addr:o.addr}});
          }
          $('file').onchange=function(){
           const f=this.files[0];if(!f)return;
           const rd=new FileReader();
           rd.onload=e=>{
            try{
             const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
             const l=parseWB(wb);
             if(!l.length){alert('لم أجد أي تلميذ في الملف. تأكد من وجود عمود الاسم (والقسم).');return}
             const nc=new Set(l.map(x=>x.cls)).size;
             if(confirm(`تم العثور على ${l.length} تلميذ في ${nc} قسم.\nاستبدال القائمة الحالية؟`)){l.forEach(x=>{const o=MAP[x.id];if(o){if(!x.phone)x.phone=o.phone||'';if(!x.addr)x.addr=o.addr||''}});DB.students=l;reindex();save();render();toast('تم الاستيراد ✓')}
            }catch(err){alert('تعذرت قراءة الملف: '+err.message)}
            $('file').value='';
           };
           rd.readAsArrayBuffer(f);
          };

          /* ---------- التصدير ---------- */
          function sheetRows(list){
           const H=['#','الاسم واللقب','القسم','اسم الأب','لقب الأم','اسم الأم','الهاتف','العنوان','الغيابات','التأخرات','دفاتر المراسلة','الشغب'];
           return [H].concat(list.map((s,i)=>[i+1,s.name,s.cls,s.father||'',s.mlast||'',s.mfirst||'',s.phone||'',s.addr||'',recs(s.id,'abs').length,recs(s.id,'late').length,recs(s.id,'book').length,recs(s.id,'bad').length]));
          }
          async function exportXlsx(groups,fname){
           if(!groups.length){toast('لا توجد بيانات للتصدير');return}
           const wb=XLSX.utils.book_new(),used={};
           groups.forEach(g=>{
            let nm=String(g[0]).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31)||'قسم';
            while(used[nm])nm=nm.slice(0,27)+'_'+(Object.keys(used).length+1);
            used[nm]=1;
            const ws=XLSX.utils.aoa_to_sheet(sheetRows(g[1]));
            ws['!cols']=[{wch:5},{wch:28},{wch:10},{wch:16},{wch:14},{wch:14},{wch:16},{wch:32},{wch:10},{wch:10},{wch:14},{wch:10}];
            XLSX.utils.book_append_sheet(wb,ws,nm);
           });
           wb.Workbook={Views:[{RTL:true}]};
           const P=window.Capacitor&&window.Capacitor.Plugins;
           if(P&&P.Filesystem&&P.Share){
            try{
             const b64=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
             const r=await P.Filesystem.writeFile({path:fname,data:b64,directory:'CACHE'});
             await P.Share.share({title:fname,url:r.uri,dialogTitle:'حفظ أو إرسال الملف'});
             return;
            }catch(e){if(/cancel/i.test(String(e&&e.message||e)))return;alert('تعذر التصدير: '+(e&&e.message||e));return}
           }
           try{XLSX.writeFile(wb,fname)}catch(e){alert('تعذر التصدير')}
          }

          /* ---------- الأحداث ---------- */
          document.addEventListener('change',e=>{
           const s=e.target.dataset&&e.target.dataset.s;if(!s)return;
           if(s==='cls')F.cls=e.target.value;else if(s==='per')F.per=e.target.value;else if(s==='lcls')L.cls=e.target.value;
           render();
          });
          document.addEventListener('click',e=>{
           if(e.target===$('modal')){closeM();return}
           const t=e.target.closest('[data-a]');if(!t)return;
           const a=t.dataset.a,v=t.dataset.v;
           if(a==='tab'){tab=v;render();window.scrollTo(0,0)}
           else if(a==='stu')showStu(v);
           else if(a==='pick')showPick(v);
           else if(a==='close')closeM();
           else if(a==='imp')$('file').click();
           else if(a==='sinfo'){saveInfo();toast('تم حفظ البيانات ✓')}
           else if(a==='mic')dictate(v);
           else if(a==='lang'){LANG=LANG==='ar-DZ'?'fr-FR':'ar-DZ';t.textContent=langLbl()}
           else if(a==='exp1'){const cl=classes();exportXlsx([[L.cls,DB.students.filter(s=>s.cls===L.cls)]],'liste_classe_'+(cl.indexOf(L.cls)+1)+'_'+ds(0)+'.xlsx')}
           else if(a==='expall'){exportXlsx(classes().map(c=>[c,DB.students.filter(s=>s.cls===c)]),'liste_eleves_'+ds(0)+'.xlsx')}
           else if(a==='add'){
            const d=$('dt').value||ds(0),n=$('nt').value.trim();
            addRec(M.sid,v,d,n);M.date=d;toast('✓ تم تسجيل '+T[v].s);drawStu();
           }
           else if(a==='del'){if(confirm('حذف هذا التسجيل؟')){DB.records=DB.records.filter(r=>r.id!==v);save();drawStu()}}
           else if(a==='padd'){
            const k=M.type,td=ds(0);
            if(DB.records.some(r=>r.sid===v&&r.type===k&&r.date===td)&&!confirm('مسجل اليوم بالفعل. تسجيل مرة أخرى؟'))return;
            addRec(v,k,td,'');toast('✓ '+T[k].s+': '+MAP[v].name);fillPick();
           }
           else if(a==='q'){
            const k=t.dataset.t,td=ds(0);
            const i=DB.records.findIndex(r=>r.sid===v&&r.type===k&&r.date===td);
            if(i>=0){DB.records.splice(i,1);save();t.classList.remove('on');t.style.background=''}
            else{addRec(v,k,td,'');t.classList.add('on');t.style.background=T[k].c}
           }
           else if(a==='bk'){
            const txt=JSON.stringify(DB);
            const ok=()=>toast('تم النسخ ✓ الصقه في مكان آمن');
            if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>prompt('انسخ النص:',txt));
            else prompt('انسخ النص:',txt);
           }
           else if(a==='rs'){
            const txt=prompt('الصق النسخة الاحتياطية هنا:');if(!txt)return;
            try{const d=JSON.parse(txt);if(!d.students||!d.records)throw 0;if(confirm('استبدال كل البيانات الحالية؟')){DB=d;reindex();save();render();toast('تم الاسترجاع ✓')}}
            catch(err){alert('النص غير صالح')}
           }
           else if(a==='clr_rec'){if(confirm('حذف كل التسجيلات (غيابات، تأخرات...)؟ لا يمكن التراجع.')){DB.records=[];save();render();toast('تم الحذف')}}
           else if(a==='clr_all'){if(confirm('حذف كل شيء (التلاميذ والتسجيلات)؟ لا يمكن التراجع.')){DB={students:[],records:[]};reindex();save();render();toast('تم الحذف')}}
          });
          render();
          </script>
          </body>
          </html>
          HTML_END
          cp node_modules/xlsx/dist/xlsx.full.min.js www/
          npx cap init "Suivi Eleves" com.ecole.suivi --web-dir=www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' $M
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: suivi-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
