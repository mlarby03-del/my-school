          /* ---------- إرسال النسخة الاحتياطية بواتساب ---------- */
          async function shareBackup(full){
            toast('جاري تحضير النسخة…');
            try{
              const txt=await buildBackup(full),name='نسخة-احتياطية-'+todayStr()+(full?'-كاملة':'')+'.json';
              const C=window.Capacitor;
              if(C&&C.isNativePlatform&&C.isNativePlatform()){
                const ok=await download(name,txt,'application/json');
                if(ok){try{localStorage.setItem('mjd_last_backup',new Date().toISOString());}catch(e){}render();toast('اختر واتساب من نافذة المشاركة');}
                return;
              }
              const f=new File([txt],name,{type:'application/json'});
              if(navigator.canShare&&navigator.canShare({files:[f]})){
                await navigator.share({files:[f],title:name});
                try{localStorage.setItem('mjd_last_backup',new Date().toISOString());}catch(e){}render();return;
              }
              await download(name,txt,'application/json');
              toast('تم حفظ الملف. أرسله من واتساب (المس 📎 وأرفقه)');
              window.open('https://wa.me/','_blank');
            }catch(e){if(!/abort|cancel/i.test(String(e&&(e.name||e.message)))) toast('تعذّر إرسال النسخة');}
          }


