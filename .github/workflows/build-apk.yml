            <p class="muted">ثبّت التطبيق، افتح هذه الخانة، واختر الملف المحفوظ. تقدر تدمجه مع معطيات موجودة أو تستبدلها.</p></div>`;
          }
          function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
          function dataURLToBlob(u){
            const i=u.indexOf(','),m=/data:([^;,]+)/.exec(u.slice(0,i)),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);
            for(let k=0;k<bin.length;k++) a[k]=bin.charCodeAt(k);
            return new Blob([a],{type:m?m[1]:'image/jpeg'});
          }
          async function buildBackup(withPhotos){
            const out={v:2,app:'suivi-eleves',date:new Date().toISOString(),students:db.students,records:db.records,levels:db.levels||{},periods:db.periods,curP:db.curP,settings:db.settings,contacts:db.contacts,templates:db.templates};
            if(withPhotos){
              out.photos={};
              for(const id of new Set(db.records.flatMap(r=>r.photos||[]))){
                const b=await photoGet(id);if(b) out.photos[id]=await blobToDataURL(b);
              }
            }
            return JSON.stringify(out);
          }
          async function readBackup(f){
            try{
              const d=JSON.parse(await f.text());
              if(!d||!Array.isArray(d.students)) throw 0;
              d.records=Array.isArray(d.records)?d.records:[];
              BK=d;restoreModal(d);
            }catch(e){toast('ملف النسخة الاحتياطية غير صالح');}
          }
          function restoreModal(d){
            const np=d.photos?Object.keys(d.photos).length:0,empty=!db.students.length;
            modal(`<h3>📥 نسخة احتياطية</h3><p class="muted">${d.date?'محفوظة في '+fmtDT(d.date):''}</p>
            <div class="prev">في الملف: <b>${d.students.length}</b> تلميذ · <b>${d.records.length}</b> تسجيل · <b>${np}</b> صورة</div>
            ${empty?'':`<p class="muted">الموجود الآن: ${db.students.length} تلميذ · ${db.records.length} تسجيل</p>`}
            <div class="acts"><button class="btn" data-act="rsreplace">${empty?'استرجاع':'استبدال كل البيانات الحالية'}</button>${empty?'':'<button class="btn ghost" data-act="rsmerge">دمج مع الحالية</button>'}<button class="btn ghost" data-act="closem">إلغاء</button></div>`);
          }
          async function restoreApply(merge){
            const d=BK;if(!d) return;
            closeM();
            try{
              Object.keys(purl).forEach(k=>delete purl[k]);
              let msg;
              if(!merge){
                await photoClear();
                db=normDb(d);
                msg='تم الاسترجاع: '+d.students.length+' تلميذ، '+d.records.length+' تسجيل';
              }else{
                const key=s=>norm(s.cls)+'|'+norm(s.last)+'|'+norm(s.first);
                const have=new Map(db.students.map(s=>[key(s),s.id]));
                const idmap={};let ns=0,nr=0;
                for(const s of d.students){
                  const k=key(s);
                  if(have.has(k)){idmap[s.id]=have.get(k);continue;}
                  const c={...s};if(db.students.some(x=>x.id===c.id)) c.id=uid();
                  db.students.push(c);have.set(k,c.id);idmap[s.id]=c.id;ns++;
                }
                const rids=new Set(db.records.map(r=>r.id));
                for(const r of d.records){
                  if(rids.has(r.id)) continue;
                  const sid=idmap[r.sid];if(!sid) continue;
                  db.records.push({...r,sid});nr++;
                }
                const cids=new Set((db.contacts||[]).map(x=>x.id));
                (d.contacts||[]).forEach(x=>{const sid=idmap[x.sid];if(sid&&!cids.has(x.id)) db.contacts.push({...x,sid});});
                db.levels={...(d.levels||{}),...(db.levels||{})};
                msg='تم الدمج: أُضيف '+ns+' تلميذ و'+nr+' تسجيل';
              }
              if(d.photos) for(const id in d.photos){try{await photoPut(id,dataURLToBlob(d.photos[id]));}catch(e){}}
              save();BK=null;S.lcls='';S.cls='';render();toast(msg);
            }catch(e){toast('تعذّر الاسترجاع');}
          }

